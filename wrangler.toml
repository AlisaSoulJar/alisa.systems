# ═══════════════════════════════════════════════════════════════════════════
#  Cloudflare Pages — cuál es la raíz del sitio
# ═══════════════════════════════════════════════════════════════════════════
# Una sola línea que importa, y estaba viviendo en un panel web donde nadie la
# veía y el repositorio no podía contradecirla.
#
# ⚠️ QUÉ ESTABA PASANDO EN PRODUCCIÓN
# El sitio servía la raíz del REPOSITORIO en vez de `public/`. Consecuencias,
# comprobadas contra el dominio en vivo antes de tocar nada:
#
#   · la portada era un `index.html` viejo de la raíz, no la Sala del Huevo
#     —que lleva meses escrita, con su texto para quien llega sin WebGL—;
#   · **todas las rutas devolvían la misma página**: `/rooms/…`, `/api/…` y
#     hasta `/src/main.js` contestaban 6.313 bytes de HTML;
#   · y como esa portada importa `/src/main.js`, el navegador recibía HTML donde
#     esperaba un módulo. **La portada estaba rota en producción**, y desde
#     fuera no se notaba: cargaba, se veía algo, y fallaba en la consola.
#
# La pista fue que `/colonia/` —una ruta que todavía no existe en ninguna rama—
# también devolvía 200. Un sitio que contesta que sí a todo no está contestando.
#
# `servir.py` sirve `public/` desde siempre, así que en local todo iba bien y el
# despliegue iba mal por su cuenta. **Lo desplegado y el árbol de trabajo pueden
# llevar meses siendo cosas distintas si nadie lo comprueba desde fuera.**
#
# Con esto la configuración vive en el repositorio: se revisa en un PR, viaja
# con el código y no se pierde en un panel.
name = "alisa-systems"
pages_build_output_dir = "dist_publico"
compatibility_date = "2026-08-03"

# Las Functions (`/api/verificar`) NO van aquí dentro: Cloudflare las coge de la
# carpeta `functions/` de la raíz del proyecto, que es donde están. El
# directorio de salida sólo dice de dónde salen los ficheros estáticos.

# ── PRESENCIA ──────────────────────────────────────────────────────────────
# El único estado compartido de todo el sitio, y es a propósito el más pequeño
# posible: quién está ahora mismo en la sala y en qué estación.
#
# Todo lo demás aquí es SIN ESTADO —el gym re-simula, el verificador re-simula—
# y esa es la fuerza del proyecto: nada que guardar, nada que corromper, nada
# que auditar. Pero «verse unos a otros» es irreduciblemente un estado
# compartido: no hay forma de que dos seres coincidan si nadie recuerda que el
# otro está ahí.
#
# Así que se acota al mínimo: entradas que caducan solas en 60 s, sin cuentas,
# sin histórico y sin nada que identifique a nadie más allá del nombre que se
# ponga. Si el servicio se cae, la sala sigue funcionando en solitario.
[[kv_namespaces]]
binding = "PRESENCIA"
id = "5f08e01c349a49aab99b996cd40e728c"

# ── DATASET ────────────────────────────────────────────────────────────────
# El corpus de partidas verificadas. La base ya existía —`alisa-mmo-db`, creada
# el 30 de abril— y llevaba desde entonces con CERO tablas: alguien la
# provisionó para el multijugador y ahí se quedó. Se reutiliza en vez de crear
# otra, que es la regla de esta casa.
#
# Aquí sí hay estado, y a diferencia de la presencia este merece la pena: una
# fila sólo entra si el servidor ha vuelto a jugar la partida, así que el
# almacén no guarda afirmaciones de nadie — guarda resultados recalculados.
[[d1_databases]]
binding = "DATASET"
database_name = "alisa-mmo-db"
database_id = "0852197b-9c2d-46f6-ab25-e79c6104ef5d"
