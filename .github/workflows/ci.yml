# ═══════════════════════════════════════════════════════════════════════════
#  CI — que la tesis siga siendo cierta en cada empujón
# ═══════════════════════════════════════════════════════════════════════════
# Esto no comprueba «que compile»: comprueba **el argumento del proyecto**.
# Si una partida legítima deja de aceptarse, o una trampa deja de cazarse, o el
# motor vuelve a acoplarse a la colonia, el empujón se pone en rojo.
#
# Y hay una comprobación que va aparte y primero: los secretos. Publicar una
# credencial no tiene marcha atrás —queda en clones, cachés y rastreadores— así
# que se mira antes que nada, en su propio trabajo, para que se vea en rojo sin
# tener que abrir un registro.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  secretos:
    name: sin credenciales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check_secretos.py` mira lo que git publicaría, así que necesita el
          # historial real y no una copia superficial.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python check_secretos.py

  pruebas:
    name: la tesis se sostiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # `preflight.py` mide EL PAQUETE, no el taller. Sin construirlo antes,
      # estaría midiendo otra cosa y diciendo que todo va bien.
      - name: construir el paquete
        run: python empaquetar.py

      # Cuatro etapas, de dentro afuera:
      #   1. `prueba_reglas.mjs`  — los 16 juegos se juegan, se repiten y se
      #                             verifican, y ninguno comparte huella
      #   2. `check_gym_envs.mjs` — los entornos nativos arrancan
      #   3. `prueba_funcion.mjs` — el verificador de produccion, con una
      #                             peticion sintetica
      #   4. `preflight.py`       — la lista de antes de publicar
      - name: npm test
        run: npm test

      # `npm test` comprueba que los juegos FUNCIONAN. Esto comprueba que MIDEN,
      # que no es lo mismo: un entorno donde una politica tonta y una razonable
      # sacan el mismo numero no es una prueba, es un generador de numeros.
      # Falla solo con lo estructural —metrica constante, la tonta ganando, o el
      # control de la Guerra separando—; la falta de senal por ruido es un aviso.
      - name: los entornos miden algo
        run: npm run calibrar

      - name: guardar el paquete si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist_publico
          path: dist_publico/
          retention-days: 7

      # Guardamos el paquete construido para el job de despliegue
      - name: guardar dist_publico para despliegue
        uses: actions/upload-artifact@v4
        with:
          name: dist_publico
          path: dist_publico/

  # ⚠️ ESTA PRUEBA ESTABA FUERA DE CI, Y POR ESO PUDO ESTAR ROTA SIN QUE SE VIERA.
  #
  # Se dejó aparte de `npm test` porque toca la red, que es un motivo legítimo. La
  # consecuencia no lo era: el árbitro empezó a exigir un `secreto` por asiento y
  # **ningún cliente del navegador se enteró**. Toda partida compartida contestaba
  # 403 desde la web, con el motivo escrito, y nadie lo leyó. La prueba lo decía —
  # sólo que no la corría nadie.
  #
  # Va en su propio trabajo y NO bloquea el despliegue: que el árbitro compartido
  # tenga un mal día no debe impedir publicar un arreglo del sitio estático. Pero
  # sale en rojo en el commit, que es lo que hace falta para enterarse.
  mesas:
    name: la mesa compartida sigue en pie
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm run prueba:mesas

  despliegue:
    name: desplegar a cloudflare pages
    needs: pruebas
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # ⚠️ SÍ, HACE FALTA EL CÓDIGO, AUNQUE SÓLO SE SUBAN FICHEROS ESTÁTICOS.
      #
      # Este trabajo se limitaba a bajar el paquete, así que corría en un
      # directorio VACÍO: sin `wrangler.toml` —que es donde vive la configuración
      # del proyecto desde que la sacamos del panel web— y sin `package.json`,
      # que es lo primero que busca la acción para saber cómo instalarse.
      #
      # En local funciona porque ahí está todo. Otra vez la misma forma del fallo:
      # el mismo comando, dos entornos distintos, y el que falla es el que nadie
      # mira.
      - uses: actions/checkout@v4

      # El paquete viene del trabajo de pruebas, ya construido y ya medido. Se
      # baja DESPUÉS del checkout: al revés, el checkout lo borraría.
      - name: descargar paquete construido
        uses: actions/download-artifact@v4
        with:
          name: dist_publico
          path: dist_publico

      # ⚠️ LAS CREDENCIALES, ANTES DE INTENTARLO, Y DICIENDO CUÁL FALTA.
      #
      # Este paso no arregla nada: hace que el fallo se pueda leer. Costó una hora
      # averiguar por qué no publicaba, porque lo único que decía era «failure» en
      # el único trabajo que nadie abre —los tres de arriba estaban en verde— y el
      # registro de Actions no se puede consultar sin un token de GitHub.
      #
      # Ojo con el diagnóstico fácil: que `wrangler` funcione en la máquina de
      # casa NO dice nada de esto. En local entra con la Global API Key de la
      # cuenta; aquí, con un token con permisos acotados. Son dos credenciales
      # distintas, y la de aquí es la única que puede caducar sin que nadie use la
      # otra para nada.
      #
      # El token necesita **Cloudflare Pages — Edit** sobre la cuenta del sitio.
      # Se renueva en dash.cloudflare.com → Manage Account → API Tokens, y se
      # guarda en Settings → Secrets del repositorio.
      - name: ¿están las credenciales?
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CUENTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          falta=0
          [ -n "$TOKEN" ]  || { echo "::error::falta el secreto CLOUDFLARE_API_TOKEN"; falta=1; }
          [ -n "$CUENTA" ] || { echo "::error::falta el secreto CLOUDFLARE_ACCOUNT_ID"; falta=1; }
          if [ "$falta" = 1 ]; then
            echo "Sin eso no se publica. Se guardan en Settings → Secrets and variables → Actions."
            echo "El token necesita el permiso 'Cloudflare Pages — Edit'."
            exit 1
          fi
          echo "las dos están puestas — si el despliegue falla ahora, es por lo que dicen, no por que falten"

      # ⚠️ `cloudflare/pages-action@v1` YA NO EXISTE, Y ESO NOS DEJÓ SIN PUBLICAR.
      #
      # Las pruebas pasaban en verde y este paso fallaba solo, así que el sitio se
      # quedó congelado mientras el repositorio seguía avanzando. Se descubrió al
      # mirar por qué no llegaba a producción un fichero recién empujado — no por
      # el aviso, que decía «failure» sin decir de qué, en un trabajo que casi
      # nadie abre porque los dos de arriba estaban en verde.
      #
      # Cloudflare archivó esa acción y su sustituto es `wrangler-action`, que
      # ejecuta el mismo `wrangler` que usamos en local (`npm run desplegar:mesas`)
      # y lee la misma `wrangler.toml`. Una herramienta menos que mantener.
      - name: publicar en cloudflare pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch=main` marca el despliegue como el de PRODUCCIÓN. Sin eso
          # entra como vista previa: se sube, contesta 200 en su propia dirección
          # y alisa.systems sigue enseñando lo de antes. Otra forma de desplegar
          # sin publicar.
          command: pages deploy dist_publico --project-name=alisa-systems --branch=main
