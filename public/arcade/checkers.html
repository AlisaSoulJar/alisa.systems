<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALISA Arcade — Damas</title>
</head>
<body>
<!--
  UNA PAGINA DE JUEGO ES SU CONFIGURACION, NADA MAS.
  ==========================================================================
  Aqui habia ~50 lineas: 35 de un CSS identico al de las otras cinco paginas de
  tablero, tres scripts de vendor listados a mano en el orden justo, y el HUD.
  Lo unico que decia algo era el nombre del juego y el de su visualizador.

  El andamio vive en js/montarMesa.js y el aspecto en css/mesa3d.css. Seis
  copias del mismo andamio se separan solas, y ya paso: checkers.html perdio el
  panel de agente que tenian las otras cinco y no se noto hasta que un asiento
  dejo de jugar.
  
  idJuego` porque esta pagina registra sus reglas con otro nombre: las reglas
  son `damas` y el visualizador busca la partida como `checkers`. Viene de antiguo y se
  respeta en vez de renombrar: cambiarlo rompe recibos ya emitidos.

  Quien ocupa cada silla va en la direccion, igual que en la mesa de cartas:
      ?asientos=persona,fsm:casa      tu contra la heuristica del juego
      ?asientos=fsm:casa,fsm:azar     dos politicas jugando solas
      ?asientos=persona,llm           tu contra un modelo
-->
<script type="module">
import { montarMesa } from './js/montarMesa.js';
/**
 * ⚠️ SIN VISUALIZADOR PROPIO: ÉSTE ES EL PRIMERO QUE VUELVE A LA MESA GENÉRICA.
 *
 * `checkers_visualizer.js` sigue en el repositorio pero ya no lo monta nadie. La
 * mesa genérica dibuja las damas desde el sustrato y ofrece el clic origen-destino
 * desde `acciones`, sin saber que existen las damas.
 *
 * POR QUÉ ÉSTE Y NO OTRO. Fable, revisando: los once visualizadores propios no son
 * once accidentes, son una SEGUNDA COLUMNA VERTEBRAL —`SovereignBoardEngine` y
 * `SovereignCardEngine`, 2.800 líneas duplicando lo que ProtoHub y las mesas ya
 * hacen— y mientras exista, cada arreglo hay que hacerlo dos veces. El 13-08-2026
 * hice tres así sin darme cuenta: el panel en inglés, las jugadas sin botones, y los
 * clics que el panel interceptaba.
 *
 * Damas es el que más paga la migración y el que mejor la pone a prueba: tiene
 * betatesters activos, es el único con normas variables (`damaVuela`,
 * `peonComeAtras`) y es donde apareció el fallo de los clics.
 *
 * Lo que se pierde son los discos bonitos. Eso son DATOS —una geometría por
 * leyenda— y se recuperan sin devolver la columna duplicada.
 */
montarMesa({ juego: 'damas', idJuego: 'checkers' });
</script>
</body>
</html>
