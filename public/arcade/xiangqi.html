<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALISA Arcade — Xiangqi</title>
<meta name="alisa-escaparate" content="juegos">
<meta name="alisa-muestra" content="Ajedrez chino 9x10, con su propio vocabulario de jugadas">
</head>
<body>
<!--
  UNA PAGINA DE JUEGO ES SU CONFIGURACION, NADA MAS.
  ==========================================================================
  Aqui habia ~50 lineas: 35 de un CSS identico al de las otras cinco paginas de
  tablero, tres scripts de vendor listados a mano en el orden justo, y el HUD.
  Lo unico que decia algo era el nombre del juego y el de su visualizador.

  El andamio vive en js/montarMesa.js y el aspecto en css/mesa3d.css. Seis
  copias del mismo andamio se separan solas, y ya paso: checkers.html perdio el
  panel de agente que tenian las otras cinco y no se noto hasta que un asiento
  dejo de jugar.

  Quien ocupa cada silla va en la direccion, igual que en la mesa de cartas:
      ?asientos=persona,fsm:casa      tu contra la heuristica del juego
      ?asientos=fsm:casa,fsm:azar     dos politicas jugando solas
      ?asientos=persona,llm           tu contra un modelo
-->
<script type="module">
import { montarMesa } from './js/montarMesa.js';
montarMesa({ juego: 'xiangqi', visualizador: 'xiangqi_visualizer.js' });
</script>
</body>
</html>
