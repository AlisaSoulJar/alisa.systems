  SUSTRATO —zonas, cartas vistas y cuántas hay tapadas— así que no sabe a qué se
  juega ni le hace falta. El porqué de todo esto está escrito en `brisca.html`.

      ?semilla=7              fija el reparto
      ?sala=cocina&yo=oscar   la misma partida que quien abra ese enlace
-->
