<title>ALISA Arcade — Texas Hold'em</title>
<!--
  ⚠️ ESTA PÁGINA ERA DEL FORMATO VIEJO, Y LE FALTABA TODO LO QUE SE ARREGLÓ FUERA.

  Traía sus tres <script> de vendor a mano, su propio arranque y su lista de
  ficheros. Eso significa que se quedó fuera de tres arreglos que ya existían:

    · `?semilla=` no hacía nada. La página anunciaba una partida fija y repartía
      una al azar —se vio en el número: `semilla: 3426103106` con `?semilla=7`
      en la barra—. Compartir «juega esta mano» es un enlace; sin esto, no lo era.
    · Los scripts no llevaban el sello `?v=`, así que un despliegue podía llegarle
      a medias, que es lo que costó una tarde entera.
    · Y el guardián de vendor duplicado tampoco la cubría — el fallo que dejó las
      cartas congeladas sin un solo error en consola.

  Nada de eso se arregla aquí: se arregla usando `montarMesa`, donde ya estaba
  arreglado. El visualizador propio se conserva tal cual, que funciona y es bonito.

      ?semilla=7   ahora sí fija el reparto
-->
<script type="module">
  import { montarMesa } from './js/montarMesa.js';
  montarMesa({ juego: 'poker', visualizador: 'poker_visualizer.js',
               titulo: "Texas Hold'em" });
</script>
