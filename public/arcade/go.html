<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALISA Arcade — Go</title>
<meta name="alisa-escaparate" content="juegos">
<meta name="alisa-muestra" content="Go 19x19; el mismo tablero se juega clicando o leyendo su rejilla en texto">
</head>
<body>
<!--
  UNA PÁGINA DE JUEGO ES SU CONFIGURACIÓN, NADA MÁS.
  ═══════════════════════════════════════════════════════════════════════════
  Aquí había 50 líneas: 35 de un CSS idéntico al de las otras cinco páginas de
  tablero, tres scripts de vendor listados a mano en el orden justo, y el HUD.
  De todo aquello, lo único que decía algo era el nombre del juego y el de su
  visualizador — que es lo que queda.

  El andamio vive en `js/montarMesa.js` y el aspecto en `css/mesa3d.css`. Eso no
  es aseo: seis copias del mismo andamio se separan solas, y ya pasó —
  `checkers.html` perdió el panel de agente que tenían las otras cinco y no se
  notó hasta que un asiento dejó de jugar.

  Quién ocupa cada silla va en la dirección y funciona igual aquí que en la mesa
  de cartas:
      ?asientos=persona,fsm:casa      tú contra la heurística del juego
      ?asientos=fsm:casa,fsm:azar     dos políticas jugando solas
      ?asientos=persona,llm           tú contra un modelo
-->
<script type="module">
import { montarMesa } from './js/montarMesa.js';
montarMesa({ juego: 'go' });
</script>
</body>
</html>
