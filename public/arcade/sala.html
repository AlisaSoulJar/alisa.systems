<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALISA — Sala</title>
<link rel="stylesheet" href="css/arcade.css">
<link rel="stylesheet" href="css/mesa3d.css">
<link rel="stylesheet" href="/vendor/fonts/fuentes.css">
<!--
  sala.html — una mesa, en un sitio, a escala de persona
  ═══════════════════════════════════════════════════════════════════════════

  ⚠️ QUÉ PRUEBA ESTO, QUE ES MÁS QUE UNA PÁGINA BONITA.

  Sentarse a una mesa de la Sala del Huevo y entrar por `/arcade/entrar` tienen
  que ser LO MISMO. Hoy no lo son: la Sala del Huevo te «abduce» a un iframe a
  pantalla completa, porque el motor de cartas creaba siempre su propia escena,
  su cámara y su bucle — era dueño de la página, así que la única forma de
  enseñarlo era darle una página entera.

  Aquí el motor entra de INVITADO (`window.ALISA_ANFITRION`): dibuja dentro de un
  grupo que le damos, y el bucle lo llevamos nosotros. Las cartas pasan a ser
  objetos de ESTA escena, con la sombra de ESTA lámpara.

  ⚠️ Y RESUELVE LA OTRA MITAD: LA ESCALA.

  Las cartas del arcade miden 1,2 × 1,8. Las de la Sala del Huevo, 0,088 × 0,123
  — catorce veces menos, porque allí todo está en metros de verdad y la cámara
  mira desde 1,62, la altura de los ojos de alguien de pie.

  No se reescala nada a mano: se mide la caja del grupo y se encoge entero hasta
  que quepa en el tablero. Es exactamente lo que la Sala del Huevo ya hace con
  los tableros —`conjunto.scale.setScalar(1.28 / max(ancho, largo))`— y lo que le
  faltaba para las cartas.

  La geometría de la mesa está copiada de allí a propósito: mismo radio, mismo
  pie, mismos taburetes. Si las dos salas se ven distintas, no son la misma casa.

      sala.html?juego=entropy&sala=cocina
-->
<script src="/vendor/three-r128/three.min.js"></script>
<script src="/vendor/three-r128/OrbitControls.js"></script>
<script src="/vendor/tween/tween.umd.js"></script>

<div id="canvas-container"></div>
<div id="hud-container"></div>

<script type="module">
import { JUEGOS, TITULOS, cargarReglas } from './js/protohub/rules/index.js';
import { ProtoHub } from './js/protohub/ProtoHub.js';

const p = new URLSearchParams(location.search);

/**
 * ⚠️ AQUÍ HABÍA OTRO `: 'entropy'`, Y ES EL MISMO DE ESTA MAÑANA.
 *
 * Un juego que no estuviera en la lista caía en entropy sin decir nada. Así que
 * `?juego=chess` abría esta sala, la montaba entera y repartía ENTROPY — y no es
 * un caso rebuscado: la clave del ajedrez es `ajedrez`, y `chess` es justo lo que
 * escribe cualquiera que venga de `chess.html`. Media hora de mirar por qué la
 * sala «no funcionaba con tableros» cuando lo que pasaba es que nunca le llegó uno.
 *
 * Un valor por defecto en el sitio donde se decide QUÉ se juega no es un defecto
 * amable: convierte una dirección equivocada en una partida distinta y silenciosa.
 * Si no se conoce el juego, se dice — en la propia sala, que es donde se mira.
 */
const pedido = p.get('juego') ?? '';
if (!JUEGOS.includes(pedido)) {
    document.body.innerHTML =
        `<div style="max-width:640px;margin:12vh auto;padding:0 20px;`
      + `font-family:'JetBrains Mono',monospace;color:#e2e2f0">`
      + `<h1 style="font-family:Inter,sans-serif">No conozco «${pedido || '(nada)'}»</h1>`
      + `<p style="color:#8a8a9e">Esta sala sirve a cualquiera de los treinta, pero por su `
      + `clave de reglas — el ajedrez es <b>ajedrez</b>, no <code>chess</code>.</p>`
      + `<p style="color:#8a8a9e">${JUEGOS.map(j => `<code>${j}</code>`).join(' · ')}</p>`
      + `<p><a href="entrar" style="color:#a180ff">← elegir en la puerta</a></p></div>`;
    throw new Error(`sala: '${pedido}' no está en rules/index.js`);
}
const juego = pedido;
window.ALISA_JUEGO = juego;
window.ALISA_TITULO = TITULOS[juego] ?? juego;
document.title = `ALISA — ${window.ALISA_TITULO}`;

// ── La sala ───────────────────────────────────────────────────────────────
const escena = new THREE.Scene();
escena.fog = new THREE.Fog(0x0d0b12, 6, 22);

const camara = new THREE.PerspectiveCamera(
    50,
    // Mismo cuidado que en el motor: `0/0` es NaN, la proyección se corrompe y
    // no se dibuja un píxel sin dar ningún error.
    (innerWidth > 0 && innerHeight > 0) ? innerWidth / innerHeight : 16 / 9,
    0.05, 60);
// 1,62 son los ojos de alguien sentado-de-pie junto a la mesa. Es la altura que
// usa la Sala del Huevo al sentarte, y copiarla es lo que hace que las dos
// salas se sientan el mismo sitio.
camara.position.set(0, 1.62, 2.15);
camara.lookAt(0, 0.95, 0);

const render = new THREE.WebGLRenderer({ antialias: true });
render.setSize(innerWidth, innerHeight);
render.setPixelRatio(Math.min(devicePixelRatio, 2));
render.shadowMap.enabled = true;
render.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('canvas-container').appendChild(render.domElement);

const controles = new THREE.OrbitControls(camara, render.domElement);
controles.target.set(0, 0.95, 0);
controles.maxPolarAngle = Math.PI / 2.05;   // no meter la cámara bajo el suelo
controles.minDistance = 0.9;
// 4,5 se quedaba corto en un teléfono en vertical: ahí la partida necesita 6 m
// para caber de lado a lado. Sigue estando dentro de la sala (el muro está a 11).
controles.maxDistance = 6.5;
controles.update();

/**
 * ⚠️ LOS MISMOS COLORES QUE LA SALA DEL HUEVO, MEDIDOS DE ELLA.
 *
 * Esta mesa decía estar copiada de allí «mismos números a propósito», y los
 * números lo estaban: Ø3,0 × 0,11 a 0,92 de alto, pie Ø0,68, tres taburetes Ø0,6.
 * Todo cuadra. Lo que no se copió fueron los colores — tapa `#d8d4e0` contra
 * `#ffffff`, pie `#241f2b` contra `#1b232e` — y eso basta para que al sentarte
 * notes que has cambiado de sitio, que es justo lo que esta sala existe para
 * evitar. Se comprobó recorriendo las dos escenas y comparando malla a malla.
 */
const matClara = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85 });
const matOscura = new THREE.MeshStandardMaterial({ color: 0x1b232e, roughness: 0.9 });

// Suelo, muro y techo — el sitio.
const suelo = new THREE.Mesh(new THREE.CircleGeometry(11, 48),
    new THREE.MeshStandardMaterial({ color: 0x2b211c, roughness: 0.95 }));
suelo.rotation.x = -Math.PI / 2;
suelo.receiveShadow = true;
escena.add(suelo);

const muro = new THREE.Mesh(new THREE.CylinderGeometry(11, 11, 5, 48, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x191521, roughness: 1, side: THREE.BackSide }));
muro.position.y = 2.5;
escena.add(muro);

const techo = new THREE.Mesh(new THREE.CircleGeometry(11, 48),
    new THREE.MeshStandardMaterial({ color: 0x120f18, roughness: 1 }));
techo.rotation.x = Math.PI / 2;
techo.position.y = 5;
escena.add(techo);

/**
 * ⚠️ LA MESA YA NO SE COPIA: SE PIDE.
 *
 * Aquí estaban la tapa, el pie y los tres taburetes escritos a mano, con el
 * comentario «copiada de la Sala del Huevo, mismos números a propósito». Los números
 * lo estaban. Lo demás no, y se midió recorriendo las DOS escenas en vivo y
 * comparando cilindro a cilindro:
 *
 *     pieza        aquí                      Sala del Huevo
 *     tapa         #ffffff rough .85 met 0   #ffffff rough .55 met .06
 *     pie          #1b232e rough .90 met 0   #1b232e rough .42 met .22
 *     taburetes    #ffffff rough .85 met 0   #ffffff rough .55 met .06
 *
 * La geometría idéntica y el acabado distinto en las tres. Y ya había pasado antes:
 * el comentario que estaba aquí contaba que los COLORES se habían desincronizado y
 * que hubo que igualarlos a mano malla a malla. Se igualó lo que se comparó y quedó
 * lo que no se miró, que es lo que siempre le pasa a una copia mantenida a mano.
 *
 * Ahora es una pieza —`protohub/mueble.js`, al lado de `tapete.js`, que ya se sacó
 * por lo mismo— y las dos salas la piden. «Es la misma mesa» deja de ser una promesa
 * que alguien mantiene y pasa a ser un hecho.
 */
const { crearMesaRedonda } = await import('./js/protohub/mueble.js');
// El desfase de los taburetes: aquí fijo, porque sólo hay una mesa y no hay de qué
// distinguirla. La Sala del Huevo le pasa su azar sembrado para que sus cinco no
// salgan calcadas.
escena.add(crearMesaRedonda(THREE, { angulo: 0.7 }));

/**
 * Tapete: es lo que dice «aquí se juega», y además recibe la sombra de las cartas.
 *
 * ⚠️ NI 1,34 NI 2,68: LO QUE MIDE LO REPARTIDO.
 *
 * La Sala del Huevo pone 1,34 y esta sala ponía 2,68 — el doble— así que al
 * sentarte el tapete cambiaba de tamaño. Ninguno de los dos estaba bien: medido,
 * la brisca reparte 1,47 de ancho y UNIT 1,79, o sea que se salían del pequeño y
 * nadaban en el grande. Dos números elegidos a ojo, cada uno mal por su lado.
 *
 * 2,10 es el mayor reparto (1,79) más un margen que se vea. Va aquí como
 * constante compartida y no como gusto de cada sala: si mañana un juego reparte
 * más ancho, este número sube en los dos sitios o vuelve a haber dos mesas.
 */
const LADO_TAPETE = 2.10;
const { crearTapete } = await import('./js/protohub/tapete.js');
const tapete = crearTapete(THREE, LADO_TAPETE);
/**
 * ⚠️ 0,98 Y NO 1,00, Y ESOS DOS CENTÍMETROS NO SON UNA DISCREPANCIA.
 *
 * Al ver que la Sala del Huevo lo pone a 1,00 lo subí «para igualar», y la mesa
 * salió vacía: las cartas se posan a 0,99 y el tapete, que tiene medio centímetro
 * de grosor, pasó a taparlas. Cuarenta cartas puestas y medidas, debajo del
 * fieltro, con sus jugadas legales perfectamente listadas al lado.
 *
 * Allí el tapete es decoración y no lleva nada encima; aquí lleva la partida. La
 * misma altura habría sido copiar el número sin copiar el motivo.
 */
tapete.position.y = 0.98;
tapete.receiveShadow = true;
escena.add(tapete);

// ── La luz ────────────────────────────────────────────────────────────────
escena.add(new THREE.HemisphereLight(0xbfd4e6, 0x1a1420, 0.55));
const foco = new THREE.SpotLight(0xfff2d0, 1.1, 12, Math.PI / 4.2, 0.5, 1.2);
foco.position.set(0, 3.2, 0);
foco.target.position.set(0, 0.98, 0);
foco.castShadow = true;
escena.add(foco, foco.target);

const pantalla = new THREE.Mesh(new THREE.ConeGeometry(0.55, 0.32, 20, 1, true),
    new THREE.MeshStandardMaterial({ color: 0x2a2233, roughness: 0.8, side: THREE.DoubleSide }));
pantalla.position.y = 3.2;
escena.add(pantalla);

// ── El juego, dentro de la mesa ───────────────────────────────────────────
const grupo = new THREE.Group();
grupo.position.y = 0.985;
escena.add(grupo);

/**
 * ⚠️ Y EL LIENZO, QUE FALTABA.
 *
 * Un invitado que quiera escuchar gestos —deslizar para moverse, tocar una casilla—
 * necesita el `<canvas>` sobre el que ocurren, y de invitado no tiene renderizador
 * propio del que sacarlo: lo tiene la sala. `mesa_tablero.mjs` hacía
 * `render.domElement` sin más y de invitada `render` está sin definir, así que las
 * seis mesas de tablero morían aquí en cuanto se les cargó el andamio que les faltaba.
 *
 * Va en el contrato del anfitrión y no se busca con `querySelector('canvas')`: en esta
 * sala hay uno, pero el día que haya dos —un minimapa, una vista de rival— el que
 * aparezca primero no tiene por qué ser el bueno.
 */
window.ALISA_ANFITRION = { grupo, escena, camara, lienzo: render.domElement };

const reglas = await cargarReglas(juego, {});
const hub = new ProtoHub().registrar(juego, reglas);

/**
 * ⚠️ Y TAMBIÉN CON EL NOMBRE QUE USE SU VISUALIZADOR, SI ES OTRO.
 *
 * `chess_visualizer.js` construye su motor con `gameId: 'chess'` y le pregunta al hub
 * por ese nombre; las reglas se llaman `ajedrez`. En su página propia eso lo resuelve
 * el parámetro `idJuego` de montarMesa, que registra las reglas bajo el id que el
 * visualizador espera. Aquí no había nada equivalente, así que el ajedrez de esta
 * sala dibujaba su tablero y se quedaba «SIN CONEXIÓN» y sin piezas: la partida
 * existía, sólo que con otro nombre.
 *
 * ⚠️ Y AQUÍ NO SE ESCRIBE LA LLAMADA DE EJEMPLO ENTERA, aunque se leería mejor.
 * `gen_paginas.mjs` averigua en qué página se juega cada juego con una expresión
 * regular sobre estos ficheros, y una llamada dentro de un comentario le parece
 * exactamente igual que una de verdad: la primera versión de este párrafo la traía,
 * y el generador decidió que el ajedrez se juega en `sala.html`. Lo cazó
 * `prueba_repetidor.mjs` con «sobran [ajedrez], faltan [ajedrez]».
 *
 * Se registra bajo los DOS. No es un alias cosmético: son la misma partida, el mismo
 * objeto de reglas, así que quien pregunte por cualquiera de los dos ve lo mismo.
 */
const { ALIAS_DE_VISUALIZADOR } = await import('./js/visualizadores.js');
const otroId = ALIAS_DE_VISUALIZADOR[juego];
if (otroId && otroId !== juego) hub.registrar(otroId, reglas);

window.ALISA_PROTOHUB = hub;
const semilla = Number(p.get('semilla'));
if (Number.isFinite(semilla) && semilla > 0) {
    hub.reset(juego, { semilla, seed: semilla });
    if (otroId && otroId !== juego) hub.reset(otroId, { semilla, seed: semilla });
}

/**
 * ⚠️ LA ESCALA LA MANDA LA CARTA, NO LA MESA.
 *
 * El primer intento encogía el grupo hasta LLENAR la mesa, que es lo que la Sala
 * del Huevo hace con los tableros — y ahí está bien, porque un tablero de
 * ajedrez ocupa toda la mesa de verdad. Con cartas da un resultado absurdo:
 * medido, salían de 24 × 36 cm. Naipes de juguete gigante.
 *
 * El motivo es que la mesa de la Sala del Huevo mide tres metros, pensada para
 * un mazo decorativo apilado, no para un juego repartido. Llenarla obliga a
 * inflar las cartas.
 *
 * Así que se fija lo único que tiene una medida real —el ancho de una carta— y
 * el juego ocupa lo que ocupe. Si un día no cabe, se encoge; pero primero manda
 * que una carta parezca una carta.
 *
 *   `?carta=15` en centímetros, para ajustarlo a ojo sin tocar el código. Esto
 *   es estética y se decide mirando, no midiendo.
 */
/**
 * De qué está hecho este juego. Se decide ANTES de nada porque manda en dos
 * cosas —con qué se dibuja y cómo se escala— y dejarlo para después obligaría a
 * confiar en el orden en que se ejecutan las líneas de este fichero.
 */
const muestra = hub.sustrato(juego);
const deCartas = !!(muestra?.zonas?.length) && !muestra?.rejilla;

/**
 * Y el tapete verde sólo si se reparte. La Sala del Huevo hace exactamente esto
 * —`if (e.cartas)` pone tapete, y si no, el tablero va directo sobre la tapa—, así
 * que un ajedrez sobre fieltro de casino sería otra diferencia entre las dos mesas.
 */
tapete.visible = deCartas;

const ANCHO_CARTA_MOTOR = 1.2;                       // lo que mide en el arcade
const cm = Number(p.get('carta'));
const ANCHO_CM = (Number.isFinite(cm) && cm > 2) ? cm : 11;   // 8,8 es la real

/**
 * ⚠️ Y EL TABLERO TAMBIÉN SE MIDE EN CENTÍMETROS, POR EL MISMO MOTIVO.
 *
 * Debajo estaba escrito «un tablero llena la mesa» y se llenaba: medido, el
 * ajedrez salía de 2,55 m con piezas de 48 cm, sobre una mesa de 1,5 de radio a
 * la que estás SENTADO. No se ve un ajedrez: se ve el interior de un ajedrez.
 *
 * Lo gracioso es que el motivo ya estaba escrito tres párrafos más arriba, para
 * las cartas: esta mesa mide tres metros porque viene de una sala donde es
 * decorativa, así que llenarla infla lo que le pongas encima. Valía igual para
 * los tableros y no se aplicó — el razonamiento estaba, sólo faltaba usarlo dos
 * veces.
 *
 * 55 cm es un tablero de verdad: un ajedrez de torneo mide 50 y un go 45. Y lo
 * mismo sirve para los que no son juegos de mesa —el laberinto, el rebaño, la
 * flota—, que sobre una mesa son un diorama y un diorama tiene su tamaño.
 *
 * ⚠️ Y AUN ASÍ SE QUEDÓ CORTO, PORQUE ESTA MESA NO ES UNA MESA DE VERDAD.
 *
 * Mide tres metros. Viene de una sala donde es decoración, y ese motivo ya estaba
 * escrito dos veces en este fichero sin que nadie sacara la consecuencia: sobre una
 * tapa de tres metros, un tablero de torneo de 55 cm se ve como un juguete olvidado
 * en una mesa de banquete. Se ve en la captura, no hay que discutirlo.
 *
 * Una mano de cartas repartida ocupa 1,30 en esta misma mesa —medido— y ahí sí
 * parece una partida. Así que un tablero ocupa lo mismo. Deja de ser «un ajedrez de
 * torneo» y pasa a ser «lo que hay encima de ESTA mesa», que es lo que se pedía al
 * decir que las diecisiete se vieran iguales.
 *
 *   `?tablero=55` en centímetros, para volver al tamaño de torneo o probar otro.
 *   Esto es estética y se decide mirando, igual que `?carta=`.
 */
const tcm = Number(p.get('tablero'));
const TABLERO_CM = (Number.isFinite(tcm) && tcm > 5) ? tcm : 130;

/** Lo que cabe en el tapete sin colgar por el borde. Es el TECHO, no el objetivo. */
const CABE_EN = 2.55;

/**
 * ⚠️ `Box3.setFromObject` MIENTE CON LAS MALLAS INSTANCIADAS, Y AQUÍ TODAS LO SON.
 *
 * `crearPintor3d` dibuja el tablero con cuatro `InstancedMesh` —una por tipo de
 * pieza, con una matriz por casilla—, que es lo correcto: así un tablero de 19×19
 * cuesta cuatro objetos y no trescientos sesenta.
 *
 * Pero el three que usamos (r128) NO mira las matrices de instancia al calcular
 * una caja: devuelve la de la geometría BASE, centrada en el origen. Medido:
 * cuatro mallas, todas «en (0,0)», extensión 0 × 0. Un tablero entero informando
 * de que no ocupa nada.
 *
 * Y no fallaba con un error, fallaba con un NÚMERO: la escala se calculaba
 * dividiendo por el tamaño de UNA casilla, así que el tablero salía ocho veces
 * más grande de lo pedido. Nadie lo habría llamado un fallo de medición mirando
 * la pantalla; parecía una decisión estética discutible.
 *
 * Esto recorre las matrices a mano. Es lo que hace three moderno, y aquí lo hace
 * falta porque la versión que servimos es la de entonces.
 */
function cajaReal(raiz) {
    const caja = new THREE.Box3();
    const m = new THREE.Matrix4();
    const b = new THREE.Box3();
    raiz.updateMatrixWorld(true);
    raiz.traverse((o) => {
        if (!o.isMesh || !o.geometry) return;
        if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
        if (o.isInstancedMesh && o.instanceMatrix) {
            for (let i = 0; i < o.count; i++) {
                o.getMatrixAt(i, m);
                m.premultiply(o.matrixWorld);
                b.copy(o.geometry.boundingBox).applyMatrix4(m);
                caja.union(b);
            }
        } else {
            b.copy(o.geometry.boundingBox).applyMatrix4(o.matrixWorld);
            caja.union(b);
        }
    });
    return caja;
}

/**
 * ⚠️ Y UNA VEZ SE SABE QUÉ HAY, HAY QUE PODER VERLO.
 *
 * Con el tamaño arreglado, el ajedrez ocupaba el 12,6 % del ancho de la pantalla:
 * medida correcta, partida injugable. Es lo que pasa al sentarse a una mesa de
 * TRES METROS —copiada así a propósito de la Sala del Huevo— con un tablero de
 * 55 cm en medio: alguien de verdad se inclinaría sobre él.
 *
 * Así que la cámara se acerca por su propio eje hasta que lo repartido llene algo
 * más de la mitad del ancho. Se hace UNA vez, cuando aparece el contenido, y a
 * partir de ahí manda el ratón: un encuadre que se recolocara solo pelearía con
 * quien está orbitando.
 */
let encuadrado = false;
function encuadrar(caja) {
    if (encuadrado) return;
    const t = caja.getSize(new THREE.Vector3());
    /**
     * ⚠️ UNA MESA SE MIRA DESDE LA MISMA DISTANCIA, JUEGUES A LO QUE JUEGUES.
     *
     * Esto encuadraba el JUEGO al 55 % del ancho de pantalla, y como los juegos no
     * miden lo mismo, cada uno acababa a una distancia distinta. Medido: la brisca
     * reparte 1,30 m y deja la cámara a 1,99 de alto —ves tu mesa, los taburetes, la
     * sala—; el ajedrez mide 0,55 y la dejaba a 1,55, o sea a sesenta y siete
     * centímetros del tablero. Con la nariz encima no cabe la mesa en el cuadro, y
     * las seis de tablero parecían flotar en negro mientras las once de cartas
     * parecían una partida.
     *
     * O sea que las dos familias tenían mueble —está medido, la mesa, el pie y los
     * tres taburetes están en la escena en los diecisiete casos— y una de las dos
     * no lo veía.
     *
     * El suelo no es un gusto: es lo que ocupa un juego de cartas repartido en esta
     * misma mesa. Encuadrando por lo menos eso, sentarse a un ajedrez y sentarse a
     * una brisca son el mismo gesto y se ven desde el mismo sitio, que es todo lo
     * que quería decir «estandarizar las mesas».
     *
     * Un tablero más grande que eso manda él, como siempre: esto es un mínimo.
     */
    /**
     * Y el suelo es 2,2 y no 1,3 por una razón que se vio mirando: con 1,3 la mesa
     * entra en cuadro pero SIN BORDE, así que se lee como una mancha blanca detrás
     * del tablero en vez de como una mesa. Lo que convierte una superficie en un
     * mueble es verle el canto. La tapa mide 3,0 de diámetro; encuadrando 2,2 se ve
     * el borde del fondo y parte del de los lados, y ya es una mesa.
     */
    const VER_EL_BORDE = 2.2;
    const mayor = Math.max(t.x, t.z, VER_EL_BORDE);
    if (!(mayor > 0.01)) return;

    const centro = caja.getCenter(new THREE.Vector3());
    controles.target.copy(centro);
    const eje = camara.position.clone().sub(centro);
    const lejos = eje.length();
    if (!(lejos > 0.01)) return;

    // A qué distancia un objeto de `mayor` ocupa la fracción que queremos.
    const tanH = Math.tan((camara.fov * Math.PI) / 360) * camara.aspect;
    const quiero = mayor / (2 * tanH * 0.55);
    /**
     * ⚠️ AQUÍ PONÍA `Math.min(lejos, quiero)`, Y ESO SÓLO SABÍA ACERCARSE.
     *
     * Lo copié del encuadre de `mesa_cartas`, donde tiene sentido: allí la cámara
     * arranca lejos y sólo hay que avanzar. Aquí el encuadre se REHACE al cambiar
     * la pantalla, y entonces la cámara ya está cerca — así que al girar el
     * teléfono necesitaba retroceder a 6,1 m y el `min` se lo impedía. La partida
     * se salía por los lados y la cuenta era correcta: sólo estaba mirando el
     * límite equivocado.
     *
     * Los límites de verdad son los del propio control: si un humano puede
     * alejarse hasta ahí con la rueda, el encuadre también.
     */
    const d = Math.min(controles.maxDistance,
                       Math.max(controles.minDistance, quiero));

    /**
     * ⚠️ Y DESDE ARRIBA, NO DESDE EL BORDE DE LA MESA.
     *
     * La primera versión conservaba el eje original y sólo cambiaba la distancia.
     * Con la brisca —que reparte 1,48 de ancho— eso dejaba la cámara a 1,51 m: a
     * quince centímetros del tapete. Unas cartas planas vistas de canto no se ven,
     * así que la mesa salía VACÍA, con sus jugadas legales perfectamente listadas
     * al lado. Las cuarenta cartas estaban puestas y medidas.
     *
     * Quien se sienta a jugar mira su mesa desde arriba. Así que se conserva la
     * dirección horizontal —de dónde vienes— y se fija la inclinación: 38°, que es
     * mirar tu propia mesa, no asomarte a ella.
     */
    const INCLINACION = 38 * Math.PI / 180;
    const plano = Math.hypot(eje.x, eje.z) || 1;
    camara.position.set(
        centro.x + (eje.x / plano) * d * Math.cos(INCLINACION),
        centro.y + d * Math.sin(INCLINACION),
        centro.z + (eje.z / plano) * d * Math.cos(INCLINACION),
    );
    camara.lookAt(centro);
    controles.update();
    encuadrado = true;
}

function ajustar() {
    if (!grupo.children.length) return;

    /**
     * ⚠️ CADA TIPO DE JUEGO SE ESCALA CON UN CRITERIO DISTINTO, Y NO ES CAPRICHO.
     *
     * UN TABLERO MIDE LO QUE MIDE UN TABLERO — 55 cm, como uno de torneo. Antes
     * llenaba la mesa, que es lo que hace la Sala del Huevo, y allí está bien
     * porque allí la mesa se mira de pie y de lejos. Sentado a ella sale un
     * ajedrez de 2,55 m con piezas de medio metro: no ves un ajedrez, ves su
     * interior.
     *
     * UNAS CARTAS TAMPOCO. Aquí manda el ancho de la carta, porque estas mesas miden
     * tres metros —pensadas para un mazo decorativo apilado, no para un juego
     * repartido— y llenarlas da naipes de 24 cm. Medido antes de decidirlo.
     *
     * Aplicar el criterio del uno al otro se ve enseguida: el ajedrez salió a
     * escala de carta, o sea un tablero de once centímetros en una mesa de tres
     * metros. Nadie lo habría jugado, pero tampoco habría dado error.
     */
    if (!deCartas) {
        grupo.scale.setScalar(1);
        const t = cajaReal(grupo).getSize(new THREE.Vector3());
        const mayor = Math.max(t.x, t.z);
        /**
         * ⚠️ SI NO HAY NADA QUE MEDIR, NO SE ESCALA.
         *
         * Un `Math.max(t.x, t.z, 0.001)` evita dividir por cero, pero produce
         * algo peor que un error: escala 2550. Pasó con cripta cuando su sustrato
         * llegaba vacío —la mesa salía sin nada encima y con las jugadas legales
         * perfectamente listadas al lado—, y ese 2550 no llamaba la atención
         * porque el resultado visible era el mismo que el de una mesa vacía.
         *
         * Un grupo sin tamaño no es un grupo pequeño: es un grupo que todavía no
         * está. Se deja como está y se vuelve a mirar en el siguiente fotograma.
         */
        if (mayor > 0.001) {
            // El tamaño lo manda el tablero; la mesa sólo pone el techo.
            const porTablero = (TABLERO_CM / 100) / mayor;
            grupo.scale.setScalar(Math.min(porTablero, CABE_EN / mayor));
            encuadrar(cajaReal(grupo));
        }
        return;
    }

    const porCarta = (ANCHO_CM / 100) / ANCHO_CARTA_MOTOR;

    // Y si con ese tamaño el juego se sale de la mesa, manda la mesa: una carta
    // creíble en el suelo no le sirve a nadie.
    grupo.scale.setScalar(porCarta);
    const t = cajaReal(grupo).getSize(new THREE.Vector3());
    const mayor = Math.max(t.x, t.z, 0.001);
    if (mayor > CABE_EN) grupo.scale.setScalar(porCarta * (CABE_EN / mayor));
    encuadrar(cajaReal(grupo));
}

/**
 * ⚠️ QUÉ SE PINTA LO DICE EL SUSTRATO, IGUAL QUE EN `montarMesa`.
 *
 * Un juego que publica ZONAS y ninguna REJILLA es de cartas y lo dibuja la mesa
 * de casino. Todo lo demás —tableros, laberintos, flotas, rebaños— tiene rejilla
 * y piezas, y lo dibuja `crearPintor3d`, que ya existía y ya recibía la escena
 * por parámetro: nació invitado.
 *
 * No hay lista de qué juego usa qué. El dato ya está en lo que cada juego
 * publica; sólo había que mirarlo.
 */
/**
 * ⚠️ Y SI EL JUEGO TIENE VISUALIZADOR PROPIO, SE USA EL SUYO.
 *
 * Aquí se montaba siempre la mesa genérica, así que el ajedrez de esta sala salía
 * con discos y hexágonos mientras `chess_visualizer.js` estaba en la misma carpeta
 * sin usar. La lista no se copia: es la de `visualizadores.js`, la misma que lee
 * `montarMesa`. Sentarse a una mesa y abrir la página del juego tienen que dibujar
 * lo mismo, y con dos listas eso dura hasta que alguien toque una.
 *
 * Los visualizadores son scripts clásicos: construyen su motor solos y hablan por
 * globales. Como `window.ALISA_ANFITRION` ya está puesto, los dos motores lo
 * recogen del `window` y entran de invitados sin que haya que decírselo.
 */
const { VISUALIZADOR, SABE_SER_INVITADO } = await import('./js/visualizadores.js');
// Sólo los verificados. Los demás siguen con la mesa genérica, que es lo que hacían
// antes y funcionaba: enchufarlos todos de golpe dejó el póker con un tapete de
// tamaño de sala y el mancala muerto, o sea peor que no haberlos tocado.
const propio = SABE_SER_INVITADO.has(juego) ? VISUALIZADOR[juego] : null;
if (propio) {
    if (deCartas) await import('./js/arcade_mats.js').catch(() => {});
    for (const s of [deCartas ? 'js/SovereignCardEngine.js' : 'js/SovereignBoardEngine.js',
                     `js/${propio}`]) {
        await new Promise((listo, falla) => {
            const e = document.createElement('script');
            e.src = s;
            e.onload = listo;
            e.onerror = () => falla(new Error(`no se pudo cargar ${s}`));
            document.head.appendChild(e);
        });
    }
} else if (deCartas) {
    await import('./js/arcade_mats.js').catch(() => {});
    await new Promise((listo, falla) => {
        const s = document.createElement('script');
        s.src = 'js/SovereignCardEngine.js';
        s.onload = listo; s.onerror = () => falla(new Error('sin motor de cartas'));
        document.head.appendChild(s);
    });
    await import('./js/mesa_cartas.mjs');
} else {
    /**
     * ⚠️ EL PINTOR UNIVERSAL, Y LOS BOTONES QUE YA COMPARTE LA MESA DE CARTAS.
     *
     * `crearPintor3d` dibuja la matriz y las piezas, pero no sabe nada de turnos
     * ni de jugadas: eso lo pone `pintarJugadas`, el mismo módulo que usa la mesa
     * de cartas. Copiar aquí esos botones habría sido copiar su regla de oro —«no
     * se manda nada que no esté en `legal_moves`»— con la posibilidad de que una
     * de las dos copias se la saltara.
     */
    /**
     * ⚠️ ESTO ERAN TREINTA LÍNEAS AQUÍ SUELTAS, Y AHORA SON UNA PIEZA.
     *
     * Montaban el pintor universal, el HUD y los botones. Funcionaba — y era la
     * única forma de ver en 3D once juegos, porque nada más usaba `crearPintor3d`.
     * En cuanto `montarMesa` necesitó lo mismo para darles página propia, había que
     * elegir entre copiarlo o sacarlo, y copiar esto es copiar la regla de oro de
     * `pintarJugadas` con la posibilidad de que una de las dos copias se la salte.
     *
     * `mesa_tablero.mjs` se monta sola y respeta `ALISA_ANFITRION`, así que aquí
     * dibuja DENTRO de esta sala igual que hacía el trozo que sustituye.
     */
    /**
     * ⚠️ Y ANTES, EL ANDAMIO. AQUÍ FALTABA Y SE LLEVABA POR DELANTE SEIS MESAS.
     *
     * `mesa_tablero.mjs` da por hecho que existen `window.ALISA_GESTOS`,
     * `ALISA_ENCUADRE` y compañía, que son scripts clásicos y globales. Esta sala
     * cargaba sólo los tres de vendor, así que ajedrez, go, reversi, damas, xiangqi
     * y mancala salían en negro con un `undefined (reading 'deslizarParaMoverse')`.
     * Las once de cartas iban porque su motor comprueba antes de usarlo.
     *
     * La lista no se copia: se pide a `montarMesa.js`, que es de donde salía la
     * buena. Copiarla habría arreglado hoy y roto el día que le añadan algo.
     * Los de vendor ya están puestos arriba, y `cargar` no repite lo que ya está.
     */
    const { ANDAMIO, cargar, montarThree } = await import('./js/montarMesa.js');
    // ⚠️ Y three ANTES del andamio, que ahora es 0.170 y llega como módulo. Los
    // scripts clásicos del andamio leen `window.THREE`, así que si esto no va
    // primero se encuentran el global vacío. Es la misma lección de esta página:
    // la sala tenía su propia lista más corta y se llevó por delante seis mesas.
    await montarThree();
    for (const s of ANDAMIO) await cargar(s);
    await import('./js/mesa_tablero.mjs');
}

// ── El bucle, que aquí lo llevamos nosotros ───────────────────────────────
function tick(t) {
    requestAnimationFrame(tick);
    if (typeof TWEEN !== 'undefined') TWEEN.update(t);
    ajustar();
    controles.update();
    render.render(escena, camara);
}
tick();

addEventListener('resize', () => {
    if (!(innerWidth > 0 && innerHeight > 0)) return;
    camara.aspect = innerWidth / innerHeight;
    camara.updateProjectionMatrix();
    render.setSize(innerWidth, innerHeight);

    /**
     * ⚠️ Y SE VUELVE A ENCUADRAR, QUE ES LA MITAD QUE FALTABA.
     *
     * Esto sólo cambiaba la proporción de la cámara. El encuadre se había
     * calculado UNA vez, al cargar, con la pantalla que hubiera entonces — así que
     * en un móvil en vertical la partida se salía por los lados y nadie se
     * enteraba desde un escritorio.
     *
     * Medido forzando la proporción sobre una brisca ya repartida: en apaisado
     * ocupa el 70 % del ancho, en cuadrado el 151 % y en vertical de teléfono el
     * 321 %. Tres veces lo que cabe. La mesa no fallaba: estaba encuadrada para
     * otra pantalla.
     *
     * `mesa_cartas` ya hacía esto en su `onResize` desde el primer día. Aquí no,
     * porque el encuadre automático se añadió después y no se miró al lado.
     */
    encuadrado = false;
});
</script>
