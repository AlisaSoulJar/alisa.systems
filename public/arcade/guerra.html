  Una sola zona, de nadie, con las cuarenta cartas. Es el CONTROL del banco
  de pruebas: aquí no se decide nada, así que todos los jugadores deben empatar.
  Una mesa donde no hay decisiones sigue mereciendo verse.

  La mesa es la misma que la de entropy y la brisca: `mesa_cartas.mjs` lee el
  SUSTRATO —zonas, cartas vistas y cuántas hay tapadas— así que no sabe a qué se
  juega ni le hace falta. El porqué de todo esto está escrito en `brisca.html`.

      ?semilla=7              fija el reparto
      ?sala=cocina&yo=oscar   la misma partida que quien abra ese enlace
-->
