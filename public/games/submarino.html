<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- El mapa del motor lo pone `/js/mundo.js`. El título, el estilo, el HUD y
         las cartelas los ponen la ROM y `montarMundo`. -->
    <script src="/js/mundo.js"></script>
</head>
<body>
<script type="module">
import { montarMundo } from '/js/montarMundo.js';
import { PintorMundo } from '/js/pintor_mundo.mjs';
import { SubmarineCore } from '@alisa-engine/src/world/systems/SubmarineCore.js';
import { figurasDeSubmarino, encuadrarSubmarino } from '/js/figuras_submarino.mjs';
import { montarHud, montarPie } from '/js/hud_mundo.mjs';
import { montarCartel } from '/js/cartelas_mundo.mjs';
import { montarTeclado } from '/js/teclado_mundo.mjs';
import { animarGLB } from '/js/figuras_glb.mjs';

/**
 * ⚠️ ESTA PÁGINA NO SABE A QUÉ SE JUEGA, Y ÉSE ES EL PUNTO.
 *
 * Ni reglas, ni estilo, ni HUD, ni cartelas, ni teclas: todo eso lo declara la
 * ROM `SubmarineCore` y lo pintan piezas compartidas. El núcleo es el MISMO que
 * juega el banco, así que la persona y el agente no pueden acabar jugando a dos
 * juegos parecidos.
 *
 * Lo único propio es la PIEL — qué modelo tiene cada bicho — y eso está en
 * `figuras_submarino.mjs`, porque el arte cambia sin que el juego cambie.
 */
const ROM = SubmarineCore.ROM;

const { app: gfx, THREE, arrancar } = await montarMundo({
    ambiente: 'night',
    cielo: false,
    suelo: false,
    nucleo: { clearColor: 0x020a14, fogColor: 0x03121f, fogDensity: 0.006 },
});

let nucleo = null, pintor = null, hud = null, acabado = false;

/** SHIFT avanza y ESPACIO esconde: dos verbos de este cartucho, declarados. */
const mando = montarTeclado(() => nucleo, {
    extra: { shift: 'adelante' },
    accion: () => {},                 // ESPACIO se lee como estado, no como golpe
});

const cartel = montarCartel(ROM.cartel, (ajustes) => {
    nucleo = new SubmarineCore({ seed: ajustes.seed, aguanta: ajustes.aguanta });
    pintor = new PintorMundo(gfx.scene, figurasDeSubmarino(THREE), 1);
    hud = montarHud(ROM.hud);
    montarPie(ROM.hud.mandos);
    encuadrarSubmarino(gfx);
    /** El mundo, publicado, para que un aviso se pueda REPINTAR. */
    window.getSustrato = () => { try { return nucleo?.sustrato() ?? null; } catch { return null; } };
});

/**
 * `esconderse` va por tecla mantenida, no por pulsación: mientras estés dentro de
 * la medusa no te ven, y soltarla te descubre. Es estado, no un golpe.
 */
addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); mando.estado.esconderse = true; } });
addEventListener('keyup', (e) => { if (e.key === ' ') mando.estado.esconderse = false; });

arrancar((dt) => {
    if (!nucleo) return;
    const paso = Math.min(dt, 0.1);
    const hay = Object.values(mando.estado).some(Boolean);
    nucleo.tick(paso, hay ? mando.estado : null);
    pintor.pintar(nucleo.sustrato());
    // El pintor COLOCA; los esqueletos de los GLB los mueve esto. Un modelo con
    // hueso y sin nadie que se lo mueva se queda en la pose que trae.
    animarGLB(paso);
    const info = nucleo.info();
    hud.pintar(info, nucleo);
    if (info.terminado && !acabado) { acabado = true; cartel.final(info); }
});

/** La puerta de los agentes, en la PÁGINA — no dentro del núcleo. */
window.stepSimulation = (accion, dt = 1 / 60) => {
    if (!nucleo) return null;
    nucleo.tick(dt, {
        subir: accion === 1, bajar: accion === 2,
        izquierda: accion === 3, derecha: accion === 4,
        adelante: accion === 5, esconderse: accion === 6,
    });
    return { done: nucleo.terminado(), info: nucleo.info() };
};
window.ALISA_STREAM_SIM_NAME = 'submarino';
</script>

<!-- El botón de «algo se ve raro»: adjunta el mundo entero porque esta página
     publica `window.getSustrato()`. -->
<script type="module" src="/arcade/js/protohub/reportar.js"></script>
</body>
</html>
