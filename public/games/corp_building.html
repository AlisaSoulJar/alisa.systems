<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALISA — Corporate Building (13 Corp Building)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0b0e18; font-family: 'Segoe UI', sans-serif; color: #ccc; }

        /* ─── LAUNCH MODAL ─── */
        #scenarioModal {
            position: fixed; inset: 0; z-index: 200;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.92);
            transition: opacity 0.4s;
        }
        .modal-box {
            background: #12141e; border: 2px solid #ff9500;
            border-radius: 16px; padding: 35px 45px; max-width: 520px; width: 90%;
            box-shadow: 0 0 80px rgba(255,149,0,0.12);
        }
        .modal-box h1 { text-align: center; color: #ff9500; font-size: 26px; margin-bottom: 20px; letter-spacing: 2px; }
        .config-section h4 { color: #aa8844; margin-bottom: 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .slider-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .slider-row label { min-width: 100px; font-size: 13px; color: #bbb; }
        .slider-row input[type=range] { flex: 1; accent-color: #ff9500; }
        .slider-row .val { min-width: 30px; text-align: right; color: #ff9500; font-weight: bold; }
        #btnStart {
            display: block; margin: 25px auto 0; padding: 14px 50px;
            font-size: 18px; font-weight: bold; background: #ff9500; color: #000;
            border: none; border-radius: 8px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(255,149,0,0.3); transition: all 0.2s; letter-spacing: 1px;
        }
        #btnStart:hover { background: #ffaa33; transform: scale(1.04); }

        /* ─── HUD ─── */
        #hud {
            display: none; position: absolute; top: 10px; left: 10px;
            font-family: 'JetBrains Mono', monospace; background: rgba(0,0,0,0.82);
            padding: 12px 16px; border-radius: 8px; border: 1px solid #444;
            pointer-events: none; font-size: 13px; line-height: 1.7; z-index: 10;
        }
        #hud .title { color: #ff9500; font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        #hud .stat { color: #aaa; }
        #hud .val { color: #ff9500; font-weight: bold; }
        
        #hud .stat-mt { margin-top: 8px; }
        #valStatus { color: #8855ff; }

        #mMode { flex: 1; background: #111; color: #0f0; border: 1px solid #333; padding: 4px 6px; }

        #controlsHelp {
            display: none; position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            font-family: monospace; background: rgba(0,0,0,0.7); color: #888;
            padding: 8px 16px; border-radius: 8px; font-size: 11px; z-index: 10; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="scenarioModal">
    <div class="modal-box">
        <h1>🏢 13, CORP BUILDING</h1>
        <div class="config-section">
            <h4>⚙️ Building Config</h4>
            <div class="slider-row">
                <label title="Number of floors">🏗️ Floors</label>
                <input type="range" min="3" max="12" value="6" id="sFloors" title="Number of floors" oninput="this.nextElementSibling.textContent=this.value">
                <span class="val">6</span>
            </div>
            <div class="slider-row">
                <label title="Doors per floor">🚪 Doors/Floor</label>
                <input type="range" min="1" max="6" value="2" id="sDoors" title="Doors per floor" oninput="this.nextElementSibling.textContent=this.value">
                <span class="val">2</span>
            </div>
            <div class="slider-row">
                <label title="Simulation Mode">🎮 Mode</label>
                <select id="mMode">
                    <option value="human">🎮 Human (Manager)</option>
                    <option value="ai" selected>🤖 AI Agent (Gym)</option>
                </select>
                <span class="val"></span>
            </div>
            <div class="slider-row">
                <label title="Simulation Speed">⏩ Speed</label>
                <input type="range" min="1" max="10" value="1" id="mSpeed" title="Sim Speed" oninput="this.nextElementSibling.textContent=this.value+'x'">
                <span class="val">1x</span>
            </div>
        </div>
        <button id="btnStart" onclick="startSimulation()">▶ ENTER BUILDING</button>
    </div>
</div>

<div id="hud">
    <div class="title" id="hudTitle">🏢 Corporate Building</div>
    <div class="stat">Floor: <span id="valFloor" class="val">1</span> / <span id="valTotalFloors" class="val">6</span></div>
    <div class="stat">Mode: <span id="valMode" class="val">Walking</span></div>
    <div class="stat stat-mt">Searches: <span id="valSearches" class="val">0</span></div>
    <div class="stat">Status: <span id="valStatus" class="val">Hunting</span></div>
    <div class="stat stat-mt" id="aiPhaseRow" style="display:none">🧠 AI: <span id="valAIPhase" class="val">PICK_FLOOR</span></div>
    <div class="stat" id="aiBeliefsRow" style="display:none;font-size:11px;letter-spacing:1px;">
        <span id="valBeliefs" style="color:#666"></span>
    </div>
</div>

<div id="controlsHelp">
    A/D: Walk · W/S: Use Stairs Up/Down · E: Elevator · SPACE: Enter/Exit Elev · F: Flashlight · ENTER: Search Door · 1-9: Select Floor
</div>

<!-- ⚠️ Esto pedía three 0.160 con `examples/js/`, y three BORRÓ esa carpeta en
     r148: solo queda `examples/jsm/` (módulos). Los dos scripts daban 404, así

     entero — dejando `let totalFloors` (línea 161) sin inicializar para

     r128 es la que usa el resto del arcade y sí trae `examples/js/`. -->
<script src="/vendor/three-r128/three.min.js"></script>

<script>
// ═══════════════════════════════════════════════════════════
//  13, CORP BUILDING — Cross-Section Diorama Building
//
//  Camera: fixed orthographic side view, all floors visible.
//  Each floor = corridor with doors, stair-portal, elevator.
//  Movement: left/right on corridor, portals for vertical.
// ═══════════════════════════════════════════════════════════

// ─── Scene Setup ───
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e18);

// Perspective camera for the 3D Aquarium Diorama
const cam = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
cam.position.set(0, 15, 55);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(cam, renderer.domElement);
controls.target.set(0, 15, -10);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 + 0.1; // allow slight under-view

// Lighting for the diorama
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffeedd, 0.7);
dirLight.position.set(20, 40, 50);
scene.add(dirLight);

const clock = new THREE.Clock();
window.addEventListener('resize', () => {
    cam.aspect = innerWidth / innerHeight;
    cam.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
});

// ═══════════════════════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════════════════════
let totalFloors = 6;
let doorsPerFloor = 2;
let simulationRunning = false;
let simTime = 0;
let autoPlaying = false;
let autoInterval = null;
let simSpeedMultiplier = 1.0;
let episodeDataset = [];
window.alisaDataset = window.alisaDataset || []; // Global export


// ─── GAME STATE (Hide & Seek / Cabinet Logic) ───
let targetFloor = -1;
let targetDoor = -1;
let searches = 0;
let gameStatus = 'Hunting'; // 'Hunting', 'Found'
let doorChecks = []; // Array of tracking data for SDK

// ─── CÓRTEX TIBURÓN — Intelligent Seeker AI (ported from H&S + Chopper) ───
let seekerAI = {
    phase: 'PICK_FLOOR',        // FSM: PICK_FLOOR → TRAVEL → EXPLORE → PICK_FLOOR
    aiTargetFloor: -1,          // Which floor the AI wants to visit next
    exploredFloors: new Set(),  // Spatial memory: floors fully swept
    beliefs: [],                // Bayesian posterior P(raccoon on floor i)
    sweepIndex: 0,              // Current door/spot index being targeted
    stuckTimer: 0,              // Anti-stuck watchdog (seconds)
    lastX: 0, lastFloor: 0,    // Previous position for stuck detection
    travelMode: 'elevator',    // 'elevator' or 'stairs'
    baseSpeed: 12.0,
};


const FL_H = 5.0;       // floor height
const CORRIDOR_W = 28;  // corridor width (visible slice)
const CORRIDOR_DEPTH = 5.0; // The depth of the 3D Aquarium
const BUILDING_DEPTH = 30.0; // Total volume (corridor + hidden empty room space)
const WALL_D = 0.5;     // wall depth (structural thickness)

// Palette: warm interior colors per floor
const FLOOR_COLORS = [
    0xd4a574, 0xb8c4a0, 0xa8b8d0, 0xd0b8a8, 0xc4d0b8, 0xb0a8c4,
    0xd0c4a0, 0xa8c4b8, 0xc4a8b0, 0xd0b0a8, 0xb8d0c4, 0xa8b0d0
];
const DOOR_COLORS = [0x885522, 0x664411, 0x553311, 0x774422, 0x886633, 0x665533];

// ═══════════════════════════════════════════════════════════
//  BUILDING DATA
// ═══════════════════════════════════════════════════════════
let buildingGroup = null;
let floors = []; // Array of floor data

// Elevator state
let elevator = {
    cabin: null,
    currentFloor: 0,
    targetFloor: -1,
    y: 0,
    moving: false,
    speed: 12.0,
    indicator: null
};

// Cinematic State
let gamePhase = 'cinematic'; // 'cinematic' | 'seeking'
let cinematicPhase = 'walking_to_elevator'; 
let cinematicTimer = 0;
let cinematicTargetDoor = -1;
let flashLightOn = true;
let flashLight = null;
let volumetricBeam = null;

// Raccoon (Hiding Target)
let rabbit = {
    mesh: null,
    visualModel: null,
    floor: 0,
    x: -18,
    z: 0,
    speed: 6.0,
    mode: 'walking',
    inElevator: false,
    animPhase: 0
};

// Seeker
let seeker = {
    mesh: null,
    visualModel: null,
    floor: 0,
    x: 0,            // horizontal position on corridor
    z: 0,            // depth position in aquarium
    speed: 12.0,
    mode: 'walking',  // walking | elevator
    animPhase: 0,
    inElevator: false
};

// ─── MODEL LOADING STATE ───
let modelsLoaded = 0;
const loader = new THREE.GLTFLoader();

let rabbitModel = null;
let rabbitMixer = null, rabbitAnimMap = {}, rabbitCurAnim = '';

let seekerModel = null;
let seekerMixer = null, seekerAnimMap = {}, seekerCurAnim = '';

function mapAnimations(gltf, mixer) {
    const animMap = {};
    if (!gltf.animations || gltf.animations.length === 0) return animMap;
    gltf.animations.forEach((clip, idx) => {
        const name = clip.name.toLowerCase();
        const action = mixer.clipAction(clip);
        if (name.includes('idle') || name.includes('stand')) animMap.idle = action;
        else if (name.includes('run') || name.includes('sprint') || name.includes('walk')) animMap.run = action;
        animMap['anim_' + idx] = action;
    });
    if (!animMap.idle) animMap.idle = animMap.anim_0 || animMap.run;
    if (!animMap.run)  animMap.run  = animMap.anim_0 || animMap.idle;
    return animMap;
}

function playCharAnim(mixer, animMap, curAnimRef, stateName) {
    if (!mixer || !animMap) return curAnimRef;
    if (curAnimRef === stateName) return curAnimRef;
    if (curAnimRef && animMap[curAnimRef]) animMap[curAnimRef].fadeOut(0.3);
    if (animMap[stateName]) { 
        animMap[stateName].reset().fadeIn(0.3).play(); 
        return stateName; 
    }
    if (animMap['anim_0']) {
        animMap['anim_0'].reset().fadeIn(0.3).play();
        return 'anim_0';
    }
    return curAnimRef;
}

function loadModels(callback) {
    modelsLoaded = 0;
    // Raccoon
    loader.load('../props/models/Raccoon.glb', (gltf) => {
        rabbitModel = gltf.scene;
        rabbitModel.scale.set(0.2, 0.2, 0.2); // 1/3 size
        rabbitModel.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        if (gltf.animations && gltf.animations.length > 0) {
            rabbitMixer = new THREE.AnimationMixer(rabbitModel);
            rabbitAnimMap = mapAnimations(gltf, rabbitMixer);
            playCharAnim(rabbitMixer, rabbitAnimMap, '', 'idle');
            rabbitCurAnim = 'idle';
        }
        modelsLoaded++;
        if (modelsLoaded >= 2 && callback) callback();
    }, undefined, () => {
        const geo = new THREE.SphereGeometry(0.3);
        const mat = new THREE.MeshStandardMaterial({ color: 0x999999 });
        rabbitModel = new THREE.Mesh(geo, mat);
        modelsLoaded++;
        if (modelsLoaded >= 2 && callback) callback();
    });

    // Seeker
    loader.load('../props/models/Generic Male.glb', (gltf) => {
        seekerModel = gltf.scene;
        const targetScale = 1.815; // 0.605 * 3 as requested
        seekerModel.scale.set(targetScale, targetScale, targetScale);
        seekerModel.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
        if (gltf.animations && gltf.animations.length > 0) {
            seekerMixer = new THREE.AnimationMixer(seekerModel);
            seekerAnimMap = mapAnimations(gltf, seekerMixer);
            playCharAnim(seekerMixer, seekerAnimMap, '', 'idle');
            seekerCurAnim = 'idle';
        }
        modelsLoaded++;
        if (modelsLoaded >= 2 && callback) callback();
    }, undefined, () => {
        loader.load('../props/models/Crypto Bro.glb', (gltf2) => {
            seekerModel = gltf2.scene;
            seekerModel.scale.set(0.45, 0.45, 0.45);
            seekerModel.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
            modelsLoaded++;
            if (modelsLoaded >= 2 && callback) callback();
        }, undefined, () => {
             const geo = new THREE.BoxGeometry(0.5, 1.0, 0.5);
             const mat = new THREE.MeshStandardMaterial({ color: 0xff8844 });
             seekerModel = new THREE.Mesh(geo, mat);
             modelsLoaded++;
             if (modelsLoaded >= 2 && callback) callback();
        });
    });
}

// ═══════════════════════════════════════════════════════════
//  MODAL
// ═══════════════════════════════════════════════════════════
function startSimulation() {
    const modal = document.getElementById('scenarioModal');
    modal.style.opacity = '0';
    setTimeout(() => {
        modal.style.display = 'none';
        document.getElementById('hud').style.display = 'block';
        document.getElementById('controlsHelp').style.display = 'block';
        document.getElementById('hudTitle').innerText = '🏢 LOADING...';
    }, 400);

    totalFloors = parseInt(document.getElementById('sFloors').value || '6');
    doorsPerFloor = parseInt(document.getElementById('sDoors').value || '4');
    document.getElementById('valTotalFloors').textContent = totalFloors;
    
    loadModels(() => {
        document.getElementById('hudTitle').innerText = '🏢 Corporate Building';
        autoPlaying = document.getElementById('mMode').value === 'ai';
        simSpeedMultiplier = parseFloat(document.getElementById('mSpeed').value || '1.0');

        buildBuilding();
        resetEpisode();
        simulationRunning = true;

        if (autoPlaying && !autoInterval) {
            document.getElementById('valMode').innerHTML = '<span style="color:#00ffcc">🤖 AI Auto</span>';
            autoInterval = setInterval(autoAgentStep, 300); // Base decision interval
        }
    });
}
window.startSimulation = startSimulation;

function resetEpisode() {
    // All floors are valid targets — doors OR hidingSpots
    let possibleFloors = [];
    for (let i = 0; i < floors.length; i++) {
        if (floors[i].doors.length > 0 || (floors[i].hidingSpots && floors[i].hidingSpots.length > 0)) {
            possibleFloors.push(i);
        }
    }
    if (possibleFloors.length === 0) possibleFloors = [1]; // fallback

    let fMatch = possibleFloors[Math.floor(Math.random() * possibleFloors.length)];
    let fd = floors[fMatch];
    
    if (fd.doors.length > 0) {
        targetDoor = Math.floor(Math.random() * fd.doors.length);
    } else {
        // Hiding on a special floor — targetDoor indexes into hidingSpots
        targetDoor = Math.floor(Math.random() * fd.hidingSpots.length);
    }
    
    targetFloor = fMatch;
    searches = 0;
    gameStatus = 'Hunting';
    doorChecks = [];
    episodeDataset = []; // fresh trajectory
    
    // Reset seeker to Planta Baja (floor 1)
    if (seeker.mesh) {
        seeker.floor = 1;
        seeker.x = 0;
        seeker.mode = 'walking';
        seeker.inElevator = false;
    }
}

// window.onload is intentionally removed so the modal demands ENTER BUILDING always

// ═══════════════════════════════════════════════════════════
//  BUILD THE DIORAMA
// ═══════════════════════════════════════════════════════════
function buildBuilding() {
    if (buildingGroup) scene.remove(buildingGroup);
    buildingGroup = new THREE.Group();
    floors = [];

    const totalH = totalFloors * FL_H;
    // Center building vertically
    buildingGroup.position.y = -totalH / 2 + FL_H / 2;

    const halfW = CORRIDOR_W / 2;
    const STAIR_DOOR_W = 2.2; // width of each stair door
    const STAIR_GAP = 0.6;    // gap between the two stair doors
    const STAIR_TOTAL = STAIR_DOOR_W * 2 + STAIR_GAP + 1.5; // total stair zone
    const ELEV_ZONE = 3.0;  // width of elevator zone on right
    const DOOR_ZONE_START = -halfW + STAIR_TOTAL + 0.5;
    const DOOR_ZONE_END = halfW - ELEV_ZONE - 1.5;
    const DOOR_ZONE_W = DOOR_ZONE_END - DOOR_ZONE_START;

    // ─── Exterior shell (back wall + sides) ───
    const shellMat = new THREE.MeshStandardMaterial({ color: 0x222233, roughness: 0.9, transparent: true, opacity: 0.85 });

    // Total building volume center Z
    const bCenterZ = -BUILDING_DEPTH/2 + CORRIDOR_DEPTH/2; // for BUILDING=30, CORRIDOR=5: CenterZ is -12.5

    // Left exterior wall (side of the aquarium)
    const leftWall = new THREE.Mesh(
        new THREE.BoxGeometry(WALL_D, totalH + FL_H, BUILDING_DEPTH + WALL_D),
        shellMat
    );
    leftWall.position.set(-halfW - WALL_D/2, totalH/2, bCenterZ);
    buildingGroup.add(leftWall);

    // Right exterior wall
    const rightWall = new THREE.Mesh(
        new THREE.BoxGeometry(WALL_D, totalH + FL_H, BUILDING_DEPTH + WALL_D),
        shellMat
    );
    rightWall.position.set(halfW + WALL_D/2, totalH/2, bCenterZ);
    buildingGroup.add(rightWall);

    // Back wall (behind everything, the far end of the rooms)
    const backWall = new THREE.Mesh(
        new THREE.BoxGeometry(CORRIDOR_W + WALL_D * 2, totalH + FL_H, WALL_D),
        shellMat
    );
    backWall.position.set(0, totalH/2, -BUILDING_DEPTH + CORRIDOR_DEPTH/2 - WALL_D/2);
    buildingGroup.add(backWall);

    // Roof
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.8 });
    const roof = new THREE.Mesh(
        new THREE.BoxGeometry(CORRIDOR_W + WALL_D * 4, WALL_D * 2, BUILDING_DEPTH + WALL_D*2),
        roofMat
    );
    roof.position.set(0, totalH + WALL_D, bCenterZ);
    buildingGroup.add(roof);

    // ─── ELEVATOR SHAFT (GLOBAL BOX) ───
    const ELEV_X = halfW - ELEV_ZONE / 2;
    const shaftMat = new THREE.MeshStandardMaterial({ color: 0x2a2a35, roughness: 0.7 });
    
    // Front shaft wall (continuous vertical slice)
    const shaftFront = new THREE.Mesh(new THREE.BoxGeometry(ELEV_ZONE, totalH + FL_H, 0.4), shaftMat);
    shaftFront.position.set(ELEV_X, totalH/2, CORRIDOR_DEPTH/2 - 0.2); 
    buildingGroup.add(shaftFront);

    // Back shaft wall (continuous vertical slice)
    const shaftBack = new THREE.Mesh(new THREE.BoxGeometry(ELEV_ZONE, totalH + FL_H, 0.4), shaftMat);
    shaftBack.position.set(ELEV_X, totalH/2, -CORRIDOR_DEPTH/2 - 0.05);
    buildingGroup.add(shaftBack);

    // ─── Per-floor construction (Hide & Seek Procedural Stack) ───
    for (let f = 0; f < totalFloors; f++) {
        const baseY = f * FL_H;
        // Deterministic coloring per floor
        const rngSeed = f * 1337 + 42;
        const floorHsl = `hsl(${(rngSeed * 37) % 360}, ${20 + (rngSeed % 10)}%, ${40 + (rngSeed % 20)}%)`;
        const wallHsl = `hsl(${(rngSeed * 11) % 360}, ${15 + (rngSeed % 15)}%, ${65 + (rngSeed % 20)}%)`;
        
        const floorGroup = new THREE.Group();

        // 1. Thick Floor Slab (Concrete base) spanning entire depth
        const slabMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.9 });
        const slab = new THREE.Mesh(new THREE.BoxGeometry(CORRIDOR_W, 0.3, BUILDING_DEPTH), slabMat);
        slab.position.set(0, baseY - 0.15, bCenterZ); // flush under the base line
        floorGroup.add(slab);

        const carpetMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(floorHsl), roughness: 0.95 });
        const carpet = new THREE.Mesh(new THREE.BoxGeometry(CORRIDOR_W - 0.1, 0.1, BUILDING_DEPTH - 0.2), carpetMat);
        carpet.position.set(0, baseY + 0.05, bCenterZ);
        carpet.receiveShadow = true;
        floorGroup.add(carpet);

        // Ceiling of this floor
        if (f < totalFloors) {
            const ceilMat = new THREE.MeshStandardMaterial({ color: 0xdddddf, roughness: 1.0 });
            const ceiling = new THREE.Mesh(new THREE.BoxGeometry(CORRIDOR_W, 0.1, BUILDING_DEPTH), ceilMat);
            ceiling.position.set(0, baseY + FL_H - 0.05, bCenterZ);
            floorGroup.add(ceiling);
        }

        // 2. Back Corridor Wall (Inner boundary - partitioned dynamically in door loop)
        const innerWallMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(wallHsl), roughness: 0.8 });

        // 3. Skirting boards (Zócalos) and Cornice (Cornisa)
        const woodMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
        const skirting = new THREE.Mesh(new THREE.BoxGeometry(CORRIDOR_W, 0.15, 0.1), woodMat);
        skirting.position.set(0, baseY + 0.1 + 0.075, -CORRIDOR_DEPTH/2 + 0.15); // right above carpet
        floorGroup.add(skirting);

        const cornice = new THREE.Mesh(new THREE.BoxGeometry(CORRIDOR_W, 0.12, 0.08), woodMat);
        cornice.position.set(0, baseY + FL_H - 0.1 - 0.06, -CORRIDOR_DEPTH/2 + 0.15);
        floorGroup.add(cornice);

        // Floor interior light (warm yellow)
        const fLight = new THREE.PointLight(0xffddaa, 0.4, FL_H * 3.5);
        fLight.position.set(0, baseY + FL_H - 0.4, 1.5);
        fLight.castShadow = true;
        floorGroup.add(fLight);

        // Floor number label (on back wall)
        const labelCanvas = document.createElement('canvas');
        labelCanvas.width = 64; labelCanvas.height = 32;
        const lctx = labelCanvas.getContext('2d');
        lctx.fillStyle = '#111'; lctx.fillRect(0, 0, 64, 32);
        lctx.fillStyle = '#ff9500'; lctx.font = 'bold 22px monospace';
        lctx.textAlign = 'center'; lctx.textBaseline = 'middle';
        
        let floorName = String(f);
        if (f === 0) floorName = "S";      // Sótano
        if (f === 1) floorName = "PB";     // Planta Baja
        if (f === totalFloors - 1) floorName = "AZ"; // Azotea
        lctx.fillText(floorName, 32, 16);

        const labelTex = new THREE.CanvasTexture(labelCanvas);
        const label = new THREE.Mesh(
            new THREE.PlaneGeometry(1.5, 0.8),
            new THREE.MeshBasicMaterial({ map: labelTex })
        );
        label.position.set(-halfW + 1.2, baseY + FL_H - 0.8, -CORRIDOR_DEPTH/2 + 0.14);
        floorGroup.add(label);

        // ─── DOORS (Hide&Seek Style Frames) ───
        const doorData = [];
        const frameColor = 0xc0c0c8; // standard metallic/white frame
        const frameMat = new THREE.MeshStandardMaterial({ color: frameColor, roughness: 0.6, metalness: 0.2 });

        // halfW already defined in outer scope (line 406)
        const STAIR_DOOR_W = 1.6 * 1.5;
        const STAIR_GAP = 1.2;
        
        let stairUpX = null;
        let stairDownX = null;
        let doorX = null;
        let doorW = 1.6 * 1.5;
        const fThickness = 0.15; const fDepth = 0.15;
        const fBaseZ = -CORRIDOR_DEPTH/2 + 0.1 + fDepth/2;
        const frameMatInst = new THREE.MeshStandardMaterial({ color: 0x332211, roughness: 0.8 });
        
        const holes = [];

        if (f === 0) { // Sótano
            stairUpX = -halfW + 1.0 + STAIR_DOOR_W / 2;
            holes.push({ x: stairUpX, w: STAIR_DOOR_W, type: 'up' });
        } else if (f === 1) { // Planta Baja
            stairUpX = -halfW + 1.0 + STAIR_DOOR_W / 2;
            stairDownX = stairUpX + STAIR_DOOR_W + 0.4;
            const boilerX = stairDownX + STAIR_DOOR_W + 0.4;
            
            holes.push({ x: stairUpX, w: STAIR_DOOR_W, type: 'up' });
            holes.push({ x: stairDownX, w: STAIR_DOOR_W, type: 'down_basement' });
            holes.push({ x: boilerX, w: STAIR_DOOR_W, type: 'boiler_hall' });
        } else if (f === totalFloors - 1) { // Azotea
            stairDownX = -halfW + 1.0 + STAIR_DOOR_W / 2;
            const roofX = stairDownX + STAIR_DOOR_W + 0.4;
            const chuteX = DOOR_ZONE_START + 0.5 * DOOR_ZONE_W;
            
            holes.push({ x: stairDownX, w: STAIR_DOOR_W, type: 'down' });
            holes.push({ x: roofX, w: STAIR_DOOR_W, type: 'roof' });
            holes.push({ x: chuteX, w: STAIR_DOOR_W, type: 'chute' });
        } else { // Normal floors
            stairUpX = -halfW + 1.0 + STAIR_DOOR_W / 2;
            stairDownX = -halfW + 1.0 + STAIR_DOOR_W * 1.5 + STAIR_GAP;
            doorX = DOOR_ZONE_START + 0.5 * DOOR_ZONE_W;
            
            holes.push({ x: stairUpX, w: STAIR_DOOR_W, type: 'up' });
            holes.push({ x: stairDownX, w: STAIR_DOOR_W, type: 'down' });
            holes.push({ x: doorX, w: doorW, type: 'door' });
        }

        holes.sort((a,b) => a.x - b.x);
        let currentX = -CORRIDOR_W / 2;

        holes.forEach(hole => {
            const isDoor = (hole.type === 'door');
            const holeH = isDoor ? (FL_H * 0.7) : (FL_H * 0.65);
            
            // Wall segment before the hole
            const spanW = (hole.x - hole.w/2) - currentX;
            if (spanW > 0.01) {
                const w = new THREE.Mesh(new THREE.BoxGeometry(spanW, FL_H, 0.4), innerWallMat);
                w.position.set(currentX + spanW/2, baseY + FL_H/2, -CORRIDOR_DEPTH/2 - 0.1);
                w.receiveShadow = true; floorGroup.add(w);
            }
            
            // Wall piece above the hole
            const topH = FL_H - holeH;
            const wTop = new THREE.Mesh(new THREE.BoxGeometry(hole.w, topH, 0.4), innerWallMat);
            wTop.position.set(hole.x, baseY + holeH + topH/2, -CORRIDOR_DEPTH/2 - 0.1);
            wTop.receiveShadow = true; floorGroup.add(wTop);

            // Room behind the hole
            let roomW = isDoor ? 3.6 : hole.w + 0.4;
            let roomD = isDoor ? 4.0 : 2.5; 
            let roomCenterX = hole.x;
            
            if (hole.type === 'boiler_hall') {
                const startX = hole.x - hole.w/2;
                roomW = halfW - startX - 2.0; // Extend to the right end
                roomD = 3.5;
                roomCenterX = startX + roomW/2;
            }

            let roomColor = 0x334455;
            if (hole.type === 'up' || hole.type === 'roof') roomColor = 0x224433;
            if (hole.type === 'down' || hole.type === 'down_basement' || hole.type === 'chute') roomColor = 0x442222;
            if (hole.type === 'boiler_hall') roomColor = 0x111111; // Very dark

            const aqMat = new THREE.MeshStandardMaterial({ color: roomColor, side: THREE.BackSide, roughness: 0.9 });
            const aquarium = new THREE.Mesh(new THREE.BoxGeometry(roomW, FL_H, roomD), aqMat);
            aquarium.position.set(roomCenterX, baseY + FL_H/2, -CORRIDOR_DEPTH/2 - 0.1 - roomD/2);
            floorGroup.add(aquarium);
            
            // Light inside Aquarium
            const aqLight = new THREE.PointLight(hole.type === 'boiler_hall' ? 0xff4422 : 0xaaccff, isDoor ? 0.6 : 1.0, hole.type === 'boiler_hall' ? 4.0 : 7.0);
            aqLight.position.set(hole.x, baseY + FL_H - 1.0, -CORRIDOR_DEPTH/2 - 0.1 - roomD/2);
            floorGroup.add(aqLight);

            // Boiler hall inner light far along the corridor
            if (hole.type === 'boiler_hall') {
                const boilerEndLight = new THREE.PointLight(0xffaa55, 0.5, 6.0);
                boilerEndLight.position.set(roomCenterX + roomW/4, baseY + FL_H - 1.0, -CORRIDOR_DEPTH/2 - 0.1 - roomD/2);
                floorGroup.add(boilerEndLight);
            }

            // Frame for the hole
            const fTopMesh = new THREE.Mesh(new THREE.BoxGeometry(hole.w + 0.1, fThickness, fDepth + 0.05), frameMatInst);
            fTopMesh.position.set(hole.x, baseY + holeH + fThickness/2 + 0.05, fBaseZ);
            fTopMesh.castShadow = true; floorGroup.add(fTopMesh);

            // Hide&Seek arrow for stairs inside the room
            if (!isDoor && hole.type !== 'boiler_hall') {
                const arrowCanvas = document.createElement('canvas'); arrowCanvas.width = 64; arrowCanvas.height = 64;
                const actx = arrowCanvas.getContext('2d'); actx.fillStyle = 'transparent'; actx.fillRect(0,0,64,64);
                
                let textColor = '#fff';
                let sym = '';
                if (hole.type === 'up') { textColor = '#44cc88'; sym = '▲'; }
                if (hole.type === 'down' || hole.type === 'down_basement') { textColor = '#cc7722'; sym = '▼'; }
                if (hole.type === 'roof') { textColor = '#88aabb'; sym = '##'; }
                if (hole.type === 'chute') { textColor = '#ff2222'; sym = '!!'; }

                actx.fillStyle = textColor;
                actx.font = 'bold 40px monospace'; actx.textAlign='center'; actx.textBaseline='middle';
                actx.fillText(sym, 32, 32);
                const arrowTex = new THREE.CanvasTexture(arrowCanvas);
                const arrowMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.8), new THREE.MeshBasicMaterial({map: arrowTex, transparent:true}));
                arrowMesh.position.set(hole.x, baseY + holeH + 0.7, -CORRIDOR_DEPTH/2 - 0.12);
                floorGroup.add(arrowMesh);
            }

            // Standard door mesh for the main door only
            if (isDoor) {
                const doorColor = DOOR_COLORS[(f * doorsPerFloor) % DOOR_COLORS.length];
                const doorMat = new THREE.MeshStandardMaterial({ color: 0x995533, roughness: 0.6, metalness: 0.1 });
                const dMesh = new THREE.Mesh(new THREE.BoxGeometry(doorW - 0.1, holeH - 0.1, 0.08), doorMat);
                dMesh.position.set(hole.x, baseY + holeH/2 - 0.05, -CORRIDOR_DEPTH/2 + 0.12);
                dMesh.castShadow = true; floorGroup.add(dMesh);

                const numCanvas = document.createElement('canvas'); numCanvas.width = 32; numCanvas.height = 32;
                const nctx = numCanvas.getContext('2d'); nctx.fillStyle = doorColor > 0x777777 ? '#222' : '#ddd';
                nctx.font = 'bold 20px serif'; nctx.textAlign = 'center'; nctx.textBaseline = 'middle';
                nctx.fillText(String(f) + "A", 16, 16);
                const numTex = new THREE.CanvasTexture(numCanvas);
                const numPlate = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), new THREE.MeshBasicMaterial({ map: numTex, transparent: true }));
                numPlate.position.set(hole.x, baseY + holeH + 0.4, -CORRIDOR_DEPTH/2 + 0.18);
                floorGroup.add(numPlate);

                const logicalFrameGroup = new THREE.Group(); logicalFrameGroup.add(fTopMesh);
                doorData.push({ x: hole.x, mesh: dMesh, frame: logicalFrameGroup });
            }

            currentX = hole.x + hole.w/2;
        });

        // Wall segment after the last hole
        const endW = (CORRIDOR_W / 2) - currentX;
        if (endW > 0.01) {
            const wEnd = new THREE.Mesh(new THREE.BoxGeometry(endW, FL_H, 0.4), innerWallMat);
            wEnd.position.set(currentX + endW/2, baseY + FL_H/2, -CORRIDOR_DEPTH/2 - 0.1);
            wEnd.receiveShadow = true; floorGroup.add(wEnd);
        }

        let elevX = halfW - ELEV_ZONE / 2;
        let elevDoorX = halfW - ELEV_ZONE;
        let edoorL = null;
        let edoorR = null;
        let edoorW = 1.6;
        let ind = null;

        if (f > 0) {
            // ─── ELEVATOR SHAFT DOORS & SEPARATOR (right side) ───
            elevX = halfW - ELEV_ZONE / 2;
            elevDoorX = halfW - ELEV_ZONE; // Left wall of the shaft where doors are at

            // Separator wall (faces the corridor) -> This is where the door goes!
            const sepMat = new THREE.MeshStandardMaterial({ color: 0x444450, roughness: 0.8 });
        
            // Split the separator wall into two pieces to leave a hole for the doors
            edoorW = 1.6; // Width of the doors
        
        // Wall left (front of doors)
            const sepW1 = (CORRIDOR_DEPTH - edoorW) / 2;
            const sepFront = new THREE.Mesh(new THREE.BoxGeometry(0.4, FL_H, sepW1), sepMat);
            sepFront.position.set(elevDoorX, baseY + FL_H/2, CORRIDOR_DEPTH/2 - sepW1/2);
        
            // Wall right (back of doors)
            const sepBack = new THREE.Mesh(new THREE.BoxGeometry(0.4, FL_H, sepW1), sepMat);
            sepBack.position.set(elevDoorX, baseY + FL_H/2, -CORRIDOR_DEPTH/2 + sepW1/2);
            floorGroup.add(sepFront, sepBack);

            // Elevator doors (two panels that slide open along the Z axis!)
            const edoorH = FL_H * 0.75;
            const edoorMat = new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.3, metalness: 0.7 });

            // Left door (front)
            edoorL = new THREE.Mesh(new THREE.BoxGeometry(0.1, edoorH, edoorW/2), edoorMat);
            edoorL.position.set(elevDoorX - 0.05, baseY + edoorH/2 + 0.15, edoorW/4);
            floorGroup.add(edoorL);

            // Right door (back)
            edoorR = new THREE.Mesh(new THREE.BoxGeometry(0.1, edoorH, edoorW/2), edoorMat);
            edoorR.position.set(elevDoorX - 0.05, baseY + edoorH/2 + 0.15, -edoorW/4);
            floorGroup.add(edoorR);

            // Indicator light (above doors, on the separator wall)
            const indMat = new THREE.MeshBasicMaterial({ color: 0x002244 });
            ind = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.35, 0.8), indMat);
            ind.position.set(elevDoorX - 0.06, baseY + edoorH + 0.6, 0); // At Z=0
            floorGroup.add(ind);

        }
        buildingGroup.add(floorGroup);

        // Compute hiding spots for special floors
        let hidingSpots = [];
        if (f === 0) {
            // Sótano: hide near the stair cubicle
            hidingSpots.push({ x: stairUpX, label: 'Stair Cubicle' });
        } else if (f === totalFloors - 1) {
            // Azotea: hide near roof access or chute
            const roofX = stairDownX + STAIR_DOOR_W + 0.4;
            const chuteX = DOOR_ZONE_START + 0.5 * DOOR_ZONE_W;
            hidingSpots.push({ x: roofX, label: 'Roof Access' });
            hidingSpots.push({ x: chuteX, label: 'Chute' });
        }

        floors.push({
            group: floorGroup,
            baseY: baseY,
            doors: doorData,
            hidingSpots: hidingSpots,
            stairUpX: stairUpX,
            stairDownX: stairDownX,
            elevX: elevX,
            elevDoorX: elevDoorX,
            edoorL: edoorL,
            edoorR: edoorR,
            edoorW: edoorW,
            indicator: ind
        });
    }

    // ─── Elevator cabin (moves through the shaft) ───
    const cabinH = FL_H * 0.7;
    const cabinW = ELEV_ZONE - 0.8;
    const cabinD = CORRIDOR_DEPTH - 0.8;
    const cabinMat = new THREE.MeshStandardMaterial({
        color: 0x556677, roughness: 0.3, metalness: 0.6,
        transparent: true, opacity: 0.9
    });
    elevator.cabin = new THREE.Mesh(
        new THREE.BoxGeometry(cabinW, cabinH, cabinD),
        cabinMat
    );
    elevator.cabin.position.set(floors[1].elevX, cabinH/2 + 0.15, 0);
    buildingGroup.add(elevator.cabin);

    // Cabin interior light
    const cabLight = new THREE.PointLight(0xffeecc, 0.4, 6);
    cabLight.position.set(0, cabinH/2 - 0.3, 0.3);
    elevator.cabin.add(cabLight);

    elevator.y = 0;
    elevator.currentFloor = 0;

    // ─── Seeker character ───
    seeker.mesh = new THREE.Group();
    if (seekerModel) {
        seeker.mesh.add(seekerModel);
        seeker.visualModel = seekerModel;
        seekerModel.rotation.y = Math.PI; // Face outwards
    }
    
    // Flashlight Setup
    flashLight = new THREE.SpotLight(0xffeedd, 1.2, 15, Math.PI / 10, 0.6, 1.2);
    flashLight.position.set(0, 8.1, 0.0); // Exact head height proportionally

    const targetObj = new THREE.Object3D();
    targetObj.position.set(0, 7.5, 5); // Angle slightly down from head
    seeker.mesh.add(targetObj);
    flashLight.target = targetObj;
    seeker.mesh.add(flashLight);
    
    // Volumetric Beam
    const bGeo = new THREE.CylinderGeometry(0.05, 2.5, 15, 16, 1, true);
    bGeo.translate(0, 7.5, 0); 
    bGeo.rotateX(Math.PI / 2); 
    const bMat = new THREE.MeshBasicMaterial({
        color: 0xffffff, transparent: true, opacity: 0.08, blending: THREE.AdditiveBlending, depthWrite: false
    });
    volumetricBeam = new THREE.Mesh(bGeo, bMat);
    volumetricBeam.position.set(0, 8.1, 0.0); // Emit precisely from head
    seeker.mesh.add(volumetricBeam);

    seeker.floor = 1; seeker.x = 0; seeker.z = 0;
    seeker.mesh.position.set(0, floors[1].baseY + 0.12, seeker.z);
    buildingGroup.add(seeker.mesh);
    
    // ─── Rabbit character (Raccoon) ───
    rabbit.mesh = new THREE.Group();
    if (rabbitModel) {
        rabbit.mesh.add(rabbitModel);
        rabbit.visualModel = rabbitModel;
    }
    rabbit.floor = 0; rabbit.x = -exteriorDistance(); rabbit.z = 0; 
    rabbit.mesh.position.set(rabbit.x, 0.12, rabbit.z);
    buildingGroup.add(rabbit.mesh);
    
    scene.add(buildingGroup);

    // Initial State override
    gamePhase = 'cinematic';
    cinematicPhase = 'walking_to_elevator';
    cinematicTimer = 0;

    // Pick a cinematic target floor that has doors (normal floors only for cinematic)
    let cinematicFloors = [];
    for (let i = 0; i < floors.length; i++) {
        if (floors[i].doors.length > 0) cinematicFloors.push(i);
    }
    if (cinematicFloors.length === 0) cinematicFloors = [1];
    let cFloor = cinematicFloors[Math.floor(Math.random() * cinematicFloors.length)];
    targetFloor = cFloor;
    targetDoor = Math.floor(Math.random() * Math.max(1, floors[cFloor].doors.length));
    seeker.mesh.visible = false; // Hide seeker during cinematic

    // ─── Reset Córtex Tiburón AI ───
    seekerAI.phase = 'PICK_FLOOR';
    seekerAI.aiTargetFloor = -1;
    seekerAI.exploredFloors.clear();
    seekerAI.sweepIndex = 0;
    seekerAI.stuckTimer = 0;
    seekerAI.lastX = 0;
    seekerAI.lastFloor = 0;
    seekerAI.travelMode = 'elevator';
    // Initialize uniform Bayesian beliefs
    seekerAI.beliefs = [];
    for (let i = 0; i < floors.length; i++) {
        const hasSearchables = floors[i].doors.length > 0 || (floors[i].hidingSpots && floors[i].hidingSpots.length > 0);
        seekerAI.beliefs.push(hasSearchables ? 1.0 : 0.0);
    }
    // Normalize
    const beliefSum = seekerAI.beliefs.reduce((a, b) => a + b, 0);
    if (beliefSum > 0) seekerAI.beliefs = seekerAI.beliefs.map(b => b / beliefSum);

    // Center camera on the building
    const bldgCenterY = totalFloors * FL_H / 2;
    cam.position.set(0, 0, 60);
    cam.lookAt(0, 0, 0);
    buildingGroup.position.y = -bldgCenterY + FL_H * 0.3;
}

function exteriorDistance() {
    return CORRIDOR_W / 2 + 5; 
}

// Arrow indicator helper
function _makeArrow(char, color) {
    const c = document.createElement('canvas');
    c.width = 32; c.height = 32;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
    ctx.font = 'bold 26px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(char, 16, 16);
    const tex = new THREE.CanvasTexture(c);
    return new THREE.Mesh(
        new THREE.PlaneGeometry(1.0, 1.0),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true })
    );
}

//  INPUT
// ═══════════════════════════════════════════════════════════
const keys = {};
const keysJustPressed = {};
document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'f' && gamePhase !== 'cinematic') {
        flashLightOn = !flashLightOn;
        if (flashLight) flashLight.intensity = flashLightOn ? 1.2 : 0;
        if (volumetricBeam) volumetricBeam.visible = flashLightOn;
    }
    if (!keys[k]) keysJustPressed[k] = true;
    keys[k] = true;
});
document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function consumeKey(k) {
    if (keysJustPressed[k]) { keysJustPressed[k] = false; return true; }
    return false;
}

// ═══════════════════════════════════════════════════════════
//  DOOR SEARCH LOGIC
// ═══════════════════════════════════════════════════════════
function checkDoor(doorIndex, fd) {
    if (gameStatus === 'Found') return;

    const doorData = fd.doors[doorIndex];
    searches++;

    let distFloor = Math.abs(seeker.floor - targetFloor);
    let distDoor = Math.abs(doorIndex - targetDoor);
    let totalDist = distFloor * 2 + distDoor; // Floor diff is higher weight

    let result = '';
    let flashColor = 0xffffff;

    if (distFloor === 0 && distDoor === 0) {
        result = 'FOUND!';
        flashColor = 0x00ff44;
        gameStatus = 'Found';
    } else if (distFloor === 0 && distDoor <= 1) {
        result = 'HOT';
        flashColor = 0xff3300;
    } else if (distFloor === 0) {
        result = 'WARM';
        flashColor = 0xffaa00;
    } else {
        result = 'COLD';
        flashColor = 0x4488ff;
    }

    _flashDoor(doorData.mesh, flashColor, doorData.frame);
    gameStatus = (gameStatus === 'Found') ? 'FOUND!' : result;

    doorChecks.push({
        floor: seeker.floor + 1,
        door: String.fromCharCode(65 + doorIndex),
        x: doorData.x,
        result: result,
        distance: totalDist
    });

    episodeDataset.push({ action: 'check_door', door: doorIndex, floor: seeker.floor, result: result, status: gameStatus });

    if (gameStatus === 'FOUND!') {
        // Save dataset
        window.alisaDataset.push({
            floors: totalFloors, doors: doorsPerFloor,
            target_floor: targetFloor, target_door: targetDoor,
            searches: searches,
            trajectory: [...episodeDataset]
        });
        
        // Auto-restart if in AI mode
        if (autoPlaying) {
            setTimeout(() => {
                // Curriculum Learning: Incrementar plantas para aumentar la dificultad
                if (totalFloors < 12) {
                    totalFloors++;
                    document.getElementById('sFloors').value = totalFloors;
                    document.getElementById('sFloors').nextElementSibling.textContent = totalFloors;
                    document.getElementById('valTotalFloors').textContent = totalFloors;
                    buildBuilding();
                }

                resetEpisode();
                // Move seeker mesh immediately to start
                const baseFloorY = floors[0].baseY;
                seeker.mesh.position.set(0, baseFloorY + 0.12, seeker.z);
            }, 1500 / simSpeedMultiplier); // Acelerar el timeout de reinicio si estamos acelerados
        }
    }
}

function _flashDoor(mesh, colorHex, frameGroup = null) {
    const originalColor = mesh.material.color.getHex();
    mesh.material.color.setHex(colorHex);
    mesh.material.emissive.setHex(colorHex);
    mesh.material.emissiveIntensity = 0.8;
    
    // Also flash the frame lightly
    if (frameGroup) {
        frameGroup.children.forEach(c => {
            if (c.material) {
                c.material.emissive.setHex(colorHex);
                c.material.emissiveIntensity = 0.3;
            }
        });
    }

    setTimeout(() => {
        mesh.material.color.setHex(originalColor);
        mesh.material.emissive.setHex(0x000000);
        mesh.material.emissiveIntensity = 0.0;
        
        if (frameGroup) {
            frameGroup.children.forEach(c => c.material.emissiveIntensity = 0.0);
        }
    }, 800);
}

// ═══════════════════════════════════════════════════════════
//  HIDING SPOT SEARCH (for doorless floors)
// ═══════════════════════════════════════════════════════════
function checkHidingSpot(spotIndex, fd) {
    if (gameStatus === 'Found') return;
    searches++;

    let distFloor = Math.abs(seeker.floor - targetFloor);
    let result = '';
    let flashColor = 0xffffff;

    if (distFloor === 0 && spotIndex === targetDoor) {
        result = 'FOUND!';
        flashColor = 0x00ff44;
        gameStatus = 'Found';
    } else if (distFloor === 0) {
        result = 'HOT';  // right floor, wrong spot
        flashColor = 0xff3300;
    } else {
        result = 'COLD';
        flashColor = 0x4488ff;
    }

    _flashSeeker(flashColor);
    gameStatus = (gameStatus === 'Found') ? 'FOUND!' : result;

    const spotLabel = fd.hidingSpots[spotIndex] ? fd.hidingSpots[spotIndex].label : 'Spot';
    doorChecks.push({
        floor: seeker.floor + 1,
        door: spotLabel,
        x: fd.hidingSpots[spotIndex] ? fd.hidingSpots[spotIndex].x : 0,
        result: result,
        distance: distFloor
    });

    episodeDataset.push({ action: 'check_spot', spot: spotIndex, floor: seeker.floor, result: result, status: gameStatus });

    if (gameStatus === 'FOUND!') {
        window.alisaDataset.push({
            floors: totalFloors, doors: doorsPerFloor,
            target_floor: targetFloor, target_door: targetDoor,
            searches: searches,
            trajectory: [...episodeDataset]
        });
        
        if (autoPlaying) {
            setTimeout(() => {
                if (totalFloors < 12) {
                    totalFloors++;
                    document.getElementById('sFloors').value = totalFloors;
                    document.getElementById('sFloors').nextElementSibling.textContent = totalFloors;
                    document.getElementById('valTotalFloors').textContent = totalFloors;
                    buildBuilding();
                }
                resetEpisode();
                const baseFloorY = floors[1].baseY;
                seeker.mesh.position.set(0, baseFloorY + 0.12, seeker.z);
            }, 1500 / simSpeedMultiplier);
        }
    }
}

// ═══════════════════════════════════════════════════════════
//  SEEKER UPDATE
// ═══════════════════════════════════════════════════════════
function updateSeeker(dt) {
    if (gamePhase === 'cinematic') return;

    if (seeker.mode === 'stairs_up' || seeker.mode === 'stairs_down' || seeker.mode === 'chute' || seeker.mode === 'roof') {
        const fd = floors[seeker.floor];
        seeker.z -= dt * seeker.speed * (seeker.mode === 'chute' ? 1.0 : 0.5); // Walk into the room
        
        if (seeker.mode === 'stairs_up' || seeker.mode === 'roof') seeker.mesh.position.y += dt;
        if (seeker.mode === 'stairs_down' || seeker.mode === 'chute') seeker.mesh.position.y -= dt;
        
        const currentScale = seeker.visualModel ? seeker.visualModel.scale.x : 1.815;
        const speedMultiplier = (seeker.mode === 'chute') ? 6.0 : 2.5; // Chute is an express drop
        const newScale = Math.max(0.01, currentScale - dt * speedMultiplier);
        if (seeker.visualModel) seeker.visualModel.scale.set(newScale, newScale, newScale);
        
        if (newScale <= 0.01) {
            if (seeker.mode === 'stairs_up') seeker.floor++;
            else if (seeker.mode === 'stairs_down') seeker.floor--;
            else if (seeker.mode === 'chute') seeker.floor = 1; // 1 is Planta Baja (f=1)!
            else if (seeker.mode === 'roof') {
                gameStatus = 'ROOF EXPLORATION';
                // stay in mode 'roof' holding the map empty?
                seeker.mode = 'walking'; // For now just return to normal
                return;
            }

            const nfd = floors[seeker.floor];
            if (seeker.mode === 'chute') {
                seeker.x = DOOR_ZONE_START + 0.5 * DOOR_ZONE_W; // Approximate door center
            } else {
                seeker.x = (seeker.mode === 'stairs_up') ? nfd.stairUpX : nfd.stairDownX;
            }
            seeker.z = -CORRIDOR_DEPTH/2 + 0.2; 
            
            if (seeker.visualModel) seeker.visualModel.scale.set(1.815, 1.815, 1.815);
            seeker.mesh.position.y = nfd.baseY + 0.12;
            seeker.mode = 'walking';
        }
        return; 
    }

    if (!seeker.mesh || seeker.inElevator) return;

    let prevX = seeker.x; // store before modifying
    let prevZ = seeker.z;

    const fd = floors[seeker.floor];
    if (!fd) return;
    
    // Limits of the Aquarium Tank
    const halfW = CORRIDOR_W / 2 - 0.8;
    const halfD = CORRIDOR_DEPTH / 2 - 0.4;
    
    // Aquarium Omnidirectional Movement (WASD)
    let moved = false;
    let dx = 0, dz = 0;

    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (keys['w'] || keys['arrowup']) dz -= 1; // into screen (back wall)
    if (keys['s'] || keys['arrowdown']) dz += 1; // towards glass

    // Normalize diagonal movement
    if (dx !== 0 || dz !== 0) {
        const len = Math.hypot(dx, dz);
        dx /= len; dz /= len;
        
        seeker.x += dx * seeker.speed * dt;
        seeker.z += dz * seeker.speed * dt;
        moved = true;
    }

    // Clamp inside Aquarium Glass
    // If we are on f=1 and go past stairDownX, we can enter the boiler corridor
    let inBoiler = false;
    
    if (seeker.floor === 1) {
        const boilerDoorX = fd.stairDownX + 1.6*1.5 + 0.4;
        if (seeker.x > boilerDoorX - 1.0 && seeker.z < -halfD) {
            inBoiler = true;
        }
    }

    if (inBoiler) {
        seeker.x = Math.max(-halfW, Math.min(halfW, seeker.x));
        seeker.z = Math.max(-CORRIDOR_DEPTH/2 - 3.5, Math.min(halfD, seeker.z));
    } else {
        seeker.x = Math.max(-halfW, Math.min(halfW, seeker.x));
        seeker.z = Math.max(-halfD, Math.min(halfD, seeker.z));
    }

    // Dynamic rotation handling
    if (moved) {
        // Rotate 3D model toward movement vector
        if (seeker.visualModel) {
            const targetRot = Math.atan2(dx, dz);
            seeker.visualModel.rotation.y = targetRot + Math.PI; // Raccoon facing adjustment
        }

        if (seeker.mixer) {
            seeker.mixer.update(dt * 2.0); // Animate walk cycle
        } else if (seeker.mesh.children[0]) {
            seeker.animPhase += dt * 10;
            seeker.mesh.children[0].rotation.z = Math.sin(seeker.animPhase) * 0.1; // simple body sway fallback
        }
    }

    // ─── PROXIMITY INTERACTIONS ───
    const backWallZ = -CORRIDOR_DEPTH/2 + 0.2; // roughly where doors/stairs trigger
    
    // ─── STAIR UP DOOR (Space key) ───
    if (fd.stairUpX !== null) {
        const upDist = Math.hypot(seeker.x - fd.stairUpX, seeker.z - backWallZ);
        if (upDist < 1.0 && consumeKey(' ')) {
            seeker.mode = 'stairs_up';
            _flashSeeker(0x44cc88);
            return;
        }
    }

    // ─── STAIR DOWN DOOR (Space key) ───
    if (fd.stairDownX !== null) {
        const dnDist = Math.hypot(seeker.x - fd.stairDownX, seeker.z - backWallZ);
        if (dnDist < 1.0 && consumeKey(' ')) {
            seeker.mode = 'stairs_down';
            _flashSeeker(0xcc7722);
            return;
        }
    }

    // ─── CHUTE (Space key on Top Floor) ───
    if (seeker.floor === totalFloors - 1) {
        // Find chute hole X
        const chuteX = DOOR_ZONE_START + 0.5 * DOOR_ZONE_W;
        if (Math.hypot(seeker.x - chuteX, seeker.z - backWallZ) < 1.5 && consumeKey(' ')) {
            seeker.mode = 'chute';
            _flashSeeker(0xff2222);
            return;
        }
        
        const roofX = fd.stairDownX + 1.2 + 0.4 + 1.2; // roughly
        if (Math.hypot(seeker.x - roofX, seeker.z - backWallZ) < 1.5 && consumeKey(' ')) {
            seeker.mode = 'roof';
            _flashSeeker(0x88aabb);
            return;
        }
    }

    // ─── SEARCH DOOR (Enter key) ───
    if (consumeKey('enter') && gamePhase === 'seeking') {
        let nearestDoor = -1;
        let minDist = 1.2; // strict proximity radius to use the door
        for (let i = 0; i < fd.doors.length; i++) {
            let dist = Math.hypot(seeker.x - fd.doors[i].x, seeker.z - backWallZ);
            if (dist < minDist) {
                minDist = dist;
                nearestDoor = i;
            }
        }
        if (nearestDoor !== -1) {
            // Re-orient model mathematically towards the door
            if (seeker.visualModel) seeker.visualModel.rotation.y = Math.PI; 
            checkDoor(nearestDoor, fd);
        } else if (fd.hidingSpots && fd.hidingSpots.length > 0) {
            // Search hiding spots on special floors (Sótano, Azotea)
            let nearestSpot = -1;
            let minSpotDist = 1.8; // slightly wider radius for cubicles
            for (let i = 0; i < fd.hidingSpots.length; i++) {
                let dist = Math.hypot(seeker.x - fd.hidingSpots[i].x, seeker.z - backWallZ);
                if (dist < minSpotDist) {
                    minSpotDist = dist;
                    nearestSpot = i;
                }
            }
            if (nearestSpot !== -1) {
                if (seeker.visualModel) seeker.visualModel.rotation.y = Math.PI;
                checkHidingSpot(nearestSpot, fd);
            }
        }
    }
    // ─── ELEVATOR ───
    const elevDist = Math.hypot(seeker.x - fd.elevDoorX, seeker.z - 0); // proximity to doors facing the corridor

    // E = call elevator to this floor
    if (consumeKey('e')) {
        if (!elevator.moving) {
            elevator.targetFloor = seeker.floor;
            elevator.moving = true;
        }
    }

    // SPACE = enter elevator (if it's here and doors are open)
    if (consumeKey(' ')) {
        if (elevator.currentFloor === seeker.floor && !elevator.moving && elevDist < 2.0) {
            seeker.inElevator = true;
            seeker.mode = 'elevator';
            seeker.x = fd.elevX;
            _flashSeeker(0x4488ff);
        }
    }

    // Update position
    const floorBaseY = floors[seeker.floor].baseY;
    seeker.mesh.position.set(seeker.x, floorBaseY + 0.12, 0.3);
}

// ─── ELEVATOR UPDATE ───

function updateSeekerInElevator(dt) {
    if (!seeker.inElevator) return;

    // Number keys select floor
    for (let n = 1; n <= 9; n++) {
        if (consumeKey(String(n)) && n <= totalFloors) {
            elevator.targetFloor = n - 1;
            elevator.moving = true;
        }
    }

    // SPACE = exit elevator
    if (consumeKey(' ') && !elevator.moving) {
        seeker.inElevator = false;
        seeker.floor = elevator.currentFloor;
        seeker.mode = 'walking';
        seeker.x = floors[seeker.floor].elevDoorX - 1.2; // step out to the left
        seeker.z = 0;
    }

    // Ride with elevator
    seeker.mesh.position.x = floors[1].elevX;
    seeker.mesh.position.y = elevator.y + 0.12;
    seeker.mesh.position.z = 0;
}

function _flashSeeker(color) {
    if (!seeker.visualModel) return;
    seeker.visualModel.traverse(c => {
        if (c.isMesh && c.material) {
            if (!c.userData.origEmissive) c.userData.origEmissive = c.material.emissive.clone();
            c.material.emissive.setHex(color);
            c.material.emissiveIntensity = 0.8;
        }
    });
    setTimeout(() => {
        if (seeker.visualModel) {
            seeker.visualModel.traverse(c => {
                if (c.isMesh && c.material && c.userData.origEmissive) {
                    c.material.emissive.copy(c.userData.origEmissive);
                    c.material.emissiveIntensity = 0.0;
                }
            });
        }
    }, 300);
}

// ═══════════════════════════════════════════════════════════
//  ELEVATOR UPDATE
// ═══════════════════════════════════════════════════════════
function updateElevator(dt) {
    if (!elevator.cabin) return;

    if (elevator.moving && elevator.targetFloor >= 0) {
        const targetY = elevator.targetFloor * FL_H;
        const diff = targetY - elevator.y;
        if (Math.abs(diff) > 0.1) {
            elevator.y += Math.sign(diff) * elevator.speed * dt;
        } else {
            elevator.y = targetY;
            elevator.currentFloor = elevator.targetFloor;
            elevator.moving = false;
        }
    }

    elevator.cabin.position.y = elevator.y + FL_H * 0.38 + 0.15;

    // Door animation: open on current floor when stopped
    floors.forEach((fd, i) => {
        if (!fd.edoorL || !fd.edoorR || !fd.indicator) return; // Skip floors without elevator (e.g. Sótano)
        const shouldOpen = (elevator.currentFloor === i && !elevator.moving);
        const amt = fd.edoorL.userData.openAmt || 0;
        const target = shouldOpen ? fd.edoorW * 0.55 : 0;
        const newAmt = THREE.MathUtils.lerp(amt, target, dt * 5);
        fd.edoorL.userData.openAmt = newAmt;

        fd.edoorL.position.z = fd.edoorW/4 + newAmt;
        fd.edoorR.position.z = -fd.edoorW/4 - newAmt;

        // Indicator: green if cabin here, blue default
        fd.indicator.material.color.setHex(shouldOpen ? 0x00ff44 : 0x002244);
    });
}

// ═══════════════════════════════════════════════════════════
//  CÓRTEX TIBURÓN — Intelligent Seeker AI
//  Ported from Hide & Seek (room exploration, spatial memory)
//  + Chopper Search (vertical navigation, temperature narrowing)
// ═══════════════════════════════════════════════════════════

// ─── Bayesian Belief Update (from Chopper temperature system) ───
function updateBeliefs(checkedFloor, result) {
    const n = seekerAI.beliefs.length;
    for (let i = 0; i < n; i++) {
        if (result === 'FOUND!') {
            seekerAI.beliefs[i] = (i === checkedFloor) ? 1.0 : 0.0;
            return;
        }
        const dist = Math.abs(i - checkedFloor);
        let likelihood = 1.0;
        if (result === 'COLD') {
            // COLD = raccoon is far. Suppress nearby floors, boost distant ones.
            if (dist <= 1) likelihood = 0.0;       // Eliminate this region
            else if (dist <= 2) likelihood = 0.15;  // Unlikely neighbor
            else likelihood = 1.2;                  // Boost distant floors
        } else if (result === 'HOT') {
            // HOT = right floor, wrong door. Massively boost this floor.
            if (dist === 0) likelihood = 5.0;
            else if (dist <= 1) likelihood = 1.5;
            else likelihood = 0.3;
        } else if (result === 'WARM') {
            // WARM = right floor, further door. Boost floor region.
            if (dist === 0) likelihood = 3.0;
            else if (dist <= 2) likelihood = 1.2;
            else likelihood = 0.5;
        }
        seekerAI.beliefs[i] *= likelihood;
    }
    // Zero out explored floors
    seekerAI.exploredFloors.forEach(ef => { seekerAI.beliefs[ef] = 0; });
    // Normalize
    const sum = seekerAI.beliefs.reduce((a, b) => a + b, 0);
    if (sum > 0) seekerAI.beliefs = seekerAI.beliefs.map(b => b / sum);
}

// ─── Pick best floor by posterior (Chopper's intelligent floor selection) ───
function pickBestFloor() {
    let bestFloor = -1, bestP = -1;
    for (let i = 0; i < seekerAI.beliefs.length; i++) {
        if (seekerAI.exploredFloors.has(i)) continue;
        const hasSearchables = floors[i] && (floors[i].doors.length > 0 || (floors[i].hidingSpots && floors[i].hidingSpots.length > 0));
        if (!hasSearchables) continue;
        if (seekerAI.beliefs[i] > bestP) {
            bestP = seekerAI.beliefs[i];
            bestFloor = i;
        }
    }
    return bestFloor;
}

// ─── Has this floor been fully swept? ───
function isFloorFullyChecked(floorIdx) {
    const fd = floors[floorIdx];
    if (!fd) return true;
    if (fd.doors.length > 0) {
        for (let i = 0; i < fd.doors.length; i++) {
            const checked = doorChecks.some(c => c.floor === floorIdx + 1 && c.door === String.fromCharCode(65 + i));
            if (!checked) return false;
        }
        return true;
    } else if (fd.hidingSpots && fd.hidingSpots.length > 0) {
        for (let i = 0; i < fd.hidingSpots.length; i++) {
            const checked = doorChecks.some(c => c.floor === floorIdx + 1 && c.door === fd.hidingSpots[i].label);
            if (!checked) return false;
        }
        return true;
    }
    return true; // No searchables = nothing to do
}

// ─── Main AI Loop (Córtex Tiburón FSM) ───
// Local action dispatcher — mirrors the ALISA_SDK adapter logic
// (SDK.executeAction is internal to the adapter, not on the public ALISA_SDK object)
function _aiAction(intent) {
    intent = intent.toLowerCase().trim();
    if (intent === 'move_left')  { keys['a'] = true; setTimeout(() => keys['a']=false, 150); }
    else if (intent === 'move_right') { keys['d'] = true; setTimeout(() => keys['d']=false, 150); }
    else if (intent === 'move_in')    { keys['w'] = true; setTimeout(() => keys['w']=false, 150); }
    else if (intent === 'move_out')   { keys['s'] = true; setTimeout(() => keys['s']=false, 150); }
    else if (intent === 'stairs_up' || intent === 'stairs_down') { keysJustPressed[' '] = true; }
    else if (intent === 'call_elevator') { keysJustPressed['e'] = true; }
    else if (intent === 'enter_elevator' || intent === 'exit_elevator') { keysJustPressed[' '] = true; }
    else if (intent === 'search_door') { keysJustPressed['enter'] = true; }
    else if (intent.startsWith('goto_floor_')) {
        const n = parseInt(intent.split('_')[2]);
        if (n && n <= totalFloors) keysJustPressed[String(n)] = true;
    }
}

function autoAgentStep() {
    if (!simulationRunning || gameStatus === 'FOUND!' || !floors[seeker.floor]) return;
    // Skip during cinematic phase and non-walking transitions
    if (gamePhase !== 'seeking') return;
    if (seeker.mode !== 'walking' && seeker.mode !== 'elevator') return;

    const fd = floors[seeker.floor];
    const targetZ = -CORRIDOR_DEPTH / 2 + 0.2;

    // ─── Urgency Speed Gradient (from H&S + Chopper) ───
    const urgency = Math.min(2.0, 1.0 + searches * 0.08);
    seeker.speed = seekerAI.baseSpeed * urgency;

    // Helper to move towards 3D coordinate
    function moveTowards3D(tx, tz) {
        if (seeker.x < tx - 0.2) _aiAction('move_right');
        if (seeker.x > tx + 0.2) _aiAction('move_left');
        if (seeker.z > tz + 0.2) _aiAction('move_in');
        if (seeker.z < tz - 0.2) _aiAction('move_out');
    }

    // ─── Anti-Stuck Watchdog (from H&S wander reset) ───
    if (Math.abs(seeker.x - seekerAI.lastX) < 0.1 && seeker.floor === seekerAI.lastFloor) {
        seekerAI.stuckTimer += 0.15; // ~150ms per tick at AI interval
    } else {
        seekerAI.stuckTimer = 0;
    }
    seekerAI.lastX = seeker.x;
    seekerAI.lastFloor = seeker.floor;
    if (seekerAI.stuckTimer > 3.0) {
        // Stuck! Force phase reset
        seekerAI.phase = 'PICK_FLOOR';
        seekerAI.stuckTimer = 0;
        if (seeker.inElevator) {
            _aiAction('exit_elevator');
        }
    }

    // ════════════════════════════════════════════
    //  PHASE 1: PICK_FLOOR (Bayesian selection)
    // ════════════════════════════════════════════
    if (seekerAI.phase === 'PICK_FLOOR') {
        // Mark current floor as explored if fully checked
        if (isFloorFullyChecked(seeker.floor)) {
            seekerAI.exploredFloors.add(seeker.floor);
            seekerAI.beliefs[seeker.floor] = 0;
            // Renormalize
            const sum = seekerAI.beliefs.reduce((a, b) => a + b, 0);
            if (sum > 0) seekerAI.beliefs = seekerAI.beliefs.map(b => b / sum);
        }

        const best = pickBestFloor();
        if (best === -1) return; // All explored (shouldn't happen if raccoon exists)

        seekerAI.aiTargetFloor = best;
        seekerAI.sweepIndex = 0;

        // Choose transport (from Chopper vertical navigation logic):
        // Adjacent floor → stairs (faster, no wait)
        // Distant floor → elevator
        const dist = Math.abs(seeker.floor - best);
        if (dist === 1) {
            // Check if stairs exist in the right direction
            const goUp = best > seeker.floor;
            const stairX = goUp ? fd.stairUpX : fd.stairDownX;
            if (stairX !== null && stairX !== undefined) {
                seekerAI.travelMode = 'stairs';
            } else {
                seekerAI.travelMode = 'elevator';
            }
        } else {
            seekerAI.travelMode = 'elevator';
        }

        // If already on target floor, skip to EXPLORE
        if (seeker.floor === best) {
            seekerAI.phase = 'EXPLORE';
        } else {
            seekerAI.phase = 'TRAVEL';
        }
        return;
    }

    // ════════════════════════════════════════════
    //  PHASE 2: TRAVEL (navigate to target floor)
    // ════════════════════════════════════════════
    if (seekerAI.phase === 'TRAVEL') {
        // Arrived?
        if (seeker.floor === seekerAI.aiTargetFloor) {
            seekerAI.phase = 'EXPLORE';
            seekerAI.sweepIndex = 0;
            return;
        }

        if (seekerAI.travelMode === 'stairs') {
            // ─── Stairs navigation (Chopper adjacent-floor hop) ───
            const goUp = seekerAI.aiTargetFloor > seeker.floor;
            const stairX = goUp ? fd.stairUpX : fd.stairDownX;
            if (stairX !== null && stairX !== undefined) {
                if (Math.hypot(seeker.x - stairX, seeker.z - targetZ) > 0.8) {
                    moveTowards3D(stairX, targetZ);
                } else {
                    _aiAction(goUp ? 'stairs_up' : 'stairs_down');
                }
            } else {
                // Fallback to elevator if stairs don't exist
                seekerAI.travelMode = 'elevator';
            }
        } else {
            // ─── Elevator navigation (Chopper floor jump) ───
            if (!seeker.inElevator) {
                if (fd.elevDoorX !== undefined) {
                    if (Math.hypot(seeker.x - fd.elevDoorX, seeker.z - 0) > 1.2) {
                        moveTowards3D(fd.elevDoorX, 0);
                    } else {
                        _aiAction('call_elevator');
                        setTimeout(() => _aiAction('enter_elevator'), 800);
                    }
                } else {
                    // Floor has no elevator — force stairs
                    seekerAI.travelMode = 'stairs';
                }
            } else {
                // Inside elevator → go to target floor
                _aiAction('goto_floor_' + (seekerAI.aiTargetFloor + 1));
                setTimeout(() => _aiAction('exit_elevator'), 1500);
            }
        }
        return;
    }

    // ════════════════════════════════════════════
    //  PHASE 3: EXPLORE (Sonar Sweep — from H&S)
    //  Systematically search all doors/spots L→R
    // ════════════════════════════════════════════
    if (seekerAI.phase === 'EXPLORE') {
        // Floor changed unexpectedly? Re-pick
        if (seeker.floor !== seekerAI.aiTargetFloor) {
            seekerAI.phase = 'PICK_FLOOR';
            return;
        }

        if (fd.doors.length > 0) {
            // ─── Normal floor: sweep doors ───
            let unsearchedDoor = -1;
            for (let i = seekerAI.sweepIndex; i < fd.doors.length; i++) {
                const checked = doorChecks.some(c => c.floor === seeker.floor + 1 && c.door === String.fromCharCode(65 + i));
                if (!checked) { unsearchedDoor = i; break; }
            }

            if (unsearchedDoor !== -1) {
                seekerAI.sweepIndex = unsearchedDoor;
                const tx = fd.doors[unsearchedDoor].x;
                if (Math.hypot(seeker.x - tx, seeker.z - targetZ) > 0.8) {
                    moveTowards3D(tx, targetZ);
                } else {
                    _aiAction('search_door');
                    seekerAI.sweepIndex = unsearchedDoor + 1;
                    // Update beliefs with result from last doorCheck
                    if (doorChecks.length > 0) {
                        const lastCheck = doorChecks[doorChecks.length - 1];
                        updateBeliefs(seeker.floor, lastCheck.result);
                    }
                }
            } else {
                // All doors on this floor checked — mark explored, re-pick
                seekerAI.exploredFloors.add(seeker.floor);
                seekerAI.beliefs[seeker.floor] = 0;
                const sum = seekerAI.beliefs.reduce((a, b) => a + b, 0);
                if (sum > 0) seekerAI.beliefs = seekerAI.beliefs.map(b => b / sum);
                seekerAI.phase = 'PICK_FLOOR';
            }
        } else if (fd.hidingSpots && fd.hidingSpots.length > 0) {
            // ─── Special floor: sweep hiding spots (Sótano/Azotea) ───
            let unsearchedSpot = -1;
            for (let i = seekerAI.sweepIndex; i < fd.hidingSpots.length; i++) {
                const checked = doorChecks.some(c => c.floor === seeker.floor + 1 && c.door === fd.hidingSpots[i].label);
                if (!checked) { unsearchedSpot = i; break; }
            }

            if (unsearchedSpot !== -1) {
                seekerAI.sweepIndex = unsearchedSpot;
                const tx = fd.hidingSpots[unsearchedSpot].x;
                if (Math.hypot(seeker.x - tx, seeker.z - targetZ) > 0.8) {
                    moveTowards3D(tx, targetZ);
                } else {
                    _aiAction('search_door');
                    seekerAI.sweepIndex = unsearchedSpot + 1;
                    if (doorChecks.length > 0) {
                        const lastCheck = doorChecks[doorChecks.length - 1];
                        updateBeliefs(seeker.floor, lastCheck.result);
                    }
                }
            } else {
                // All spots checked — mark explored, re-pick
                seekerAI.exploredFloors.add(seeker.floor);
                seekerAI.beliefs[seeker.floor] = 0;
                const sum = seekerAI.beliefs.reduce((a, b) => a + b, 0);
                if (sum > 0) seekerAI.beliefs = seekerAI.beliefs.map(b => b / sum);
                seekerAI.phase = 'PICK_FLOOR';
            }
        } else {
            // Floor has nothing to search — skip
            seekerAI.exploredFloors.add(seeker.floor);
            seekerAI.phase = 'PICK_FLOOR';
        }
    }
}

// ═══════════════════════════════════════════════════════════
//  CINEMATIC LOGIC
// ═══════════════════════════════════════════════════════════
function updateCinematic(dt) {
    if (gamePhase !== 'cinematic' || !rabbit.mesh) return;
    
    // Raccoon entry cinematic sequence
    const fd = floors[rabbit.floor];
    if (!fd) return;
    
    if (cinematicPhase === 'walking_to_elevator') {
        rabbitCurAnim = playCharAnim(rabbitMixer, rabbitAnimMap, rabbitCurAnim, 'run');
        if (rabbit.visualModel) rabbit.visualModel.rotation.y = Math.PI / 2; // Face right
        
        if (rabbit.x < fd.elevDoorX - 1.0) {
            rabbit.x += rabbit.speed * 0.8 * dt; // walk right
        } else {
            // Reached elevator, call it
            rabbitCurAnim = playCharAnim(rabbitMixer, rabbitAnimMap, rabbitCurAnim, 'idle');
            if (rabbit.visualModel) rabbit.visualModel.rotation.y = Math.PI; // Look at player
            if (!elevator.moving && elevator.targetFloor !== rabbit.floor) {
                 elevator.targetFloor = rabbit.floor;
                 elevator.moving = true;
            }
            if (elevator.currentFloor === rabbit.floor && !elevator.moving) {
                // Wait for doors
                cinematicTimer += dt;
                if (cinematicTimer > 1.5) {
                    cinematicPhase = 'riding_elevator';
                    rabbit.inElevator = true;
                    rabbit.x = fd.elevX;
                    rabbit.mesh.position.set(rabbit.x, elevator.y + 0.12, 0);
                    // Raccoon chooses random target door/floor
                    elevator.targetFloor = targetFloor;
                    elevator.moving = true;
                }
            }
        }
    } else if (cinematicPhase === 'riding_elevator') {
        rabbitCurAnim = playCharAnim(rabbitMixer, rabbitAnimMap, rabbitCurAnim, 'idle');
        rabbit.mesh.position.y = elevator.y + 0.12;
        if (elevator.currentFloor === targetFloor && !elevator.moving) {
            rabbit.floor = targetFloor;
            rabbit.inElevator = false;
            rabbit.x = floors[targetFloor].elevDoorX - 0.5; // step out
            rabbit.mesh.position.set(rabbit.x, floors[targetFloor].baseY + 0.12, 0);
            cinematicPhase = 'walking_to_door';
            cinematicTimer = 0;
        }
    } else if (cinematicPhase === 'walking_to_door') {
        rabbitCurAnim = playCharAnim(rabbitMixer, rabbitAnimMap, rabbitCurAnim, 'run');
        const tFd = floors[targetFloor];
        
        // Determine target X: use door if available, else hiding spot
        let targetX;
        if (tFd.doors.length > 0 && targetDoor < tFd.doors.length) {
            targetX = tFd.doors[targetDoor].x;
        } else if (tFd.hidingSpots && tFd.hidingSpots.length > 0) {
            const spotIdx = Math.min(targetDoor, tFd.hidingSpots.length - 1);
            targetX = tFd.hidingSpots[spotIdx].x;
        } else {
            targetX = 0; // fallback center
        }
        
        if (rabbit.x > targetX + 0.2) {
            rabbit.x -= rabbit.speed * 0.8 * dt; // walk left
            if (rabbit.visualModel) rabbit.visualModel.rotation.y = -Math.PI / 2;
        } else if (rabbit.x < targetX - 0.2) {
            rabbit.x += rabbit.speed * 0.8 * dt; // walk right
            if (rabbit.visualModel) rabbit.visualModel.rotation.y = Math.PI / 2;
        } else {
            // Reached door/spot
            rabbitCurAnim = playCharAnim(rabbitMixer, rabbitAnimMap, rabbitCurAnim, 'idle');
            if (rabbit.visualModel) rabbit.visualModel.rotation.y = Math.PI; // Face outwards
            cinematicTimer += dt;
            if (cinematicTimer > 1.5) {
                // Disappear through door
                rabbit.mesh.visible = false;
                gamePhase = 'seeking';
                document.getElementById('hudTitle').innerText = '🏢 Corporate Building';
                if (seeker.mesh) {
                    seeker.mesh.visible = true; // Reveal player!
                    _flashSeeker(0xffeedd);
                }
            }
        }
    }
    
    if (!rabbit.inElevator && floors[rabbit.floor]) {
        rabbit.mesh.position.set(rabbit.x, floors[rabbit.floor].baseY + 0.12, rabbit.z);
    }
}

// ═══════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════
function animate() {
    requestAnimationFrame(animate);
    let dt = Math.min(clock.getDelta(), 0.1);
    dt *= simSpeedMultiplier;

    if (rabbitMixer) rabbitMixer.update(dt);
    if (seekerMixer) seekerMixer.update(dt);

    if (simulationRunning) {
        simTime += dt;
        updateCinematic(dt);
        updateSeeker(dt);
        updateSeekerInElevator(dt);
        updateElevator(dt);
        updateHUD();
    }

    controls.update();

    renderer.render(scene, cam);

    // Clear just-pressed keys at end of frame
    for (const k in keysJustPressed) keysJustPressed[k] = false;
}

animate();

// ═══════════════════════════════════════════════════════════
//  ALISA SDK
// ═══════════════════════════════════════════════════════════
ALISA_SDK.register({
    sim: 'corporate_building',
    getSemanticState: () => ({
        status: simulationRunning ? 'running' : 'menu',
        time: +simTime.toFixed(1),
        game_status: gameStatus,
        searches_made: searches,
        seeker_floor: seeker.floor + 1,
        seeker_x: +seeker.x.toFixed(1),
        seeker_mode: seeker.mode,
        seeker_in_elevator: seeker.inElevator,
        elevator_floor: elevator.currentFloor + 1,
        elevator_moving: elevator.moving,
        total_floors: totalFloors,
        doors_per_floor: doorsPerFloor,
        recent_checks: doorChecks.slice(-3) // return last 3 feedbacks
    }),
    getAvailableActions: () => {
        if (!simulationRunning) return ['wait'];
        if (gameStatus === 'Found' || gameStatus === 'FOUND!') return ['wait'];

        const acts = ['move_left', 'move_right', 'move_in', 'move_out', 'wait'];
        if (!seeker.inElevator) {
            acts.push('stairs_up', 'stairs_down', 'call_elevator', 'enter_elevator');
            
            // Allow search if near any door
            const fd = floors[seeker.floor];
            if (fd) {
                let nearDoor = false;
                for (let i = 0; i < fd.doors.length; i++) {
                    if (Math.hypot(seeker.x - fd.doors[i].x, seeker.z - (-CORRIDOR_DEPTH/2 + 0.2)) < 1.2) nearDoor = true;
                }
                if (nearDoor) acts.push('search_door');
            }
        } else {
            for (let i = 1; i <= totalFloors; i++) acts.push('goto_floor_' + i);
            acts.push('exit_elevator');
        }
        return acts;
    },
    executeAction: (intentStr) => {
        const intent = intentStr.toLowerCase().trim();
        if (intent === 'move_left') { keys['a'] = true; setTimeout(() => keys['a']=false, 150); }
        else if (intent === 'move_right') { keys['d'] = true; setTimeout(() => keys['d']=false, 150); }
        else if (intent === 'move_in') { keys['w'] = true; setTimeout(() => keys['w']=false, 150); }
        else if (intent === 'move_out') { keys['s'] = true; setTimeout(() => keys['s']=false, 150); }
        else if (intent === 'stairs_up' || intent === 'stairs_down') { keysJustPressed[' '] = true; }
        else if (intent === 'call_elevator') { keysJustPressed['e'] = true; }
        else if (intent === 'enter_elevator' || intent === 'exit_elevator') { keysJustPressed[' '] = true; }
        else if (intent === 'search_door') { keysJustPressed['enter'] = true; }
        else if (intent.startsWith('goto_floor_')) {
            const n = parseInt(intent.split('_')[2]);
            if (n && n <= totalFloors) keysJustPressed[String(n)] = true;
        }
        return {success: true, msg: 'Dispatched: ' + intent};
    },
    getScore: () => ({
        score: (gameStatus === 'Found' || gameStatus === 'FOUND!') ? Math.max(100 - searches*5, 10) : 0,
        searches: searches,
        time: simTime,
        found: gameStatus === 'Found' || gameStatus === 'FOUND!'
    })
});

</script>
