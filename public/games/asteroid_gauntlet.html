<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- El mapa del motor lo pone `/js/mundo.js`. El título y el estilo, la ROM
         y `montarMundo` — esta página ya no declara ninguno de los dos. -->
    <script src="/js/mundo.js"></script>
</head>
<body>
<script type="module">
import { montarMundo } from '/js/montarMundo.js';
import { PintorMundo } from '/js/pintor_mundo.mjs';
import { AsteroidsSystem } from '@alisa-engine/src/world/systems/AsteroidsSystem.js';
import { figurasDePedrisco, encuadrarPedrisco, seguirPedrisco } from '/js/figuras_pedrisco.mjs';
import { montarHud, montarPie } from '/js/hud_mundo.mjs';
import { montarCartel } from '/js/cartelas_mundo.mjs';
import { montarTeclado } from '/js/teclado_mundo.mjs';

/**
 * ⚠️ ESTA PÁGINA ERAN 897 LÍNEAS Y NO IMPORTABA NADA.
 * ═══════════════════════════════════════════════════════════════════════════
 *
 * Era el último monolito vivo de la casa: el juego entero escrito dentro —bucle,
 * física, oleadas, colisiones y arte— con veinticuatro funciones propias. Y al
 * lado, `AsteroidsSystem`: 669 líneas, headless, con sustrato, que es lo que el
 * banco mide como `alisa/Pedrisco-v0`.
 *
 * ⚠️ LO QUE ENSEÑÓ, QUE ES DISTINTO DE LOS OTROS TRES CASOS.
 *
 * Al compararlos rasgo a rasgo y número a número, resultó que **son el mismo
 * juego**: `BASIC hp 20`, `FAST 10`, `GOLD 50`, `MONO 999999`, densidad 15, los
 * mismos `SHIP_GAUGES`, el mismo `gaugeIndex = -1`. El núcleo se hizo copiando
 * esta página y poniéndole `this.` delante.
 *
 * O sea que aquí no había dos juegos separados —como en ¡Busca! 3 o ¡Busca! 6—
 * sino una COPIA FIEL que todavía no se ha separado. Y eso explica por qué la
 * avería se repite: la forma en que nace un núcleo headless en esta casa es
 * copiando la página, y luego nadie borra el original.
 *
 * Éste era el mejor momento para juntarlos: no había nada que reconciliar.
 */
const ROM = AsteroidsSystem.ROM;

const { app: gfx, THREE, arrancar } = await montarMundo({
    ambiente: 'night',
    cielo: false,
    suelo: false,
    nucleo: { clearColor: 0x020210, fogColor: 0x020210, fogDensity: 0.012 },
});

let nucleo = null, pintor = null, hud = null, acabado = false;

/**
 * El mando. `A/D` a los lados, `W/S` altura, ESPACIO dispara — y se traduce a lo
 * MISMO que usa el agente: `ship.tx`, `ship.ty` y `wantFire`, con
 * `externalControl` puesto. Si la persona y el agente empujaran por dos caminos
 * distintos, volveríamos a tener dos juegos con el mismo nombre.
 */
const mando = montarTeclado(() => nucleo, { accion: (n) => { if (n.ship) n.ship.wantFire = true; } });

const cartel = montarCartel(ROM.cartel, (ajustes) => {
    nucleo = new AsteroidsSystem({ seed: ajustes.seed });
    nucleo.externalControl = true;
    nucleo.start({
        stage: ROM.mundo.etapa,
        shipClass: ROM.mundo.nave,
        asteroidDensity: ajustes.densidad,
        scrollSpeed: ROM.mundo.velocidad,
    });
    pintor = new PintorMundo(gfx.scene, figurasDePedrisco(THREE), 1);
    hud = montarHud(ROM.hud);
    montarPie(ROM.hud.mandos);
    encuadrarPedrisco(gfx, nucleo.sustrato());
    /** El mundo, publicado, para que un aviso se pueda REPINTAR. */
    window.getSustrato = () => { try { return nucleo?.sustrato() ?? null; } catch { return null; } };
});

arrancar((dt) => {
    if (!nucleo) return;
    const paso = Math.min(dt, 0.1);
    const s = nucleo.ship;
    if (s && !s.dead) {
        // Las teclas mueven el objetivo, no la nave: el núcleo la lleva hasta él
        // con su propia inercia, igual que hace con el agente.
        const v = 42 * paso;
        if (mando.estado.izquierda) s.tx -= v;
        if (mando.estado.derecha) s.tx += v;
        if (mando.estado.subir) s.ty += v;
        if (mando.estado.bajar) s.ty -= v;
        s.tx = Math.max(-nucleo.ARENA_W / 2, Math.min(nucleo.ARENA_W / 2, s.tx));
        s.ty = Math.max(-nucleo.ARENA_H / 2, Math.min(nucleo.ARENA_H / 2, s.ty));
    }
    nucleo.tick(paso);
    if (s) s.wantFire = false;

    const sus = nucleo.sustrato();
    pintor.pintar(sus);
    seguirPedrisco(gfx, sus);
    const info = nucleo.info();
    hud.pintar(info, nucleo);
    if (info.terminado && !acabado) { acabado = true; cartel.final(info); }
});

/** La puerta de los agentes, en la PÁGINA — la misma acción que el gimnasio. */
window.stepSimulation = (accion, dt = 1 / 60) => {
    if (!nucleo) return null;
    const s = nucleo.ship;
    if (s && !s.dead) {
        const a = Array.isArray(accion) ? accion : [accion?.tx ?? 0, accion?.ty ?? 0, accion?.fire ?? 0];
        s.tx = Math.max(-1, Math.min(1, a[0])) * (nucleo.ARENA_W / 2);
        s.ty = Math.max(-1, Math.min(1, a[1])) * (nucleo.ARENA_H / 2);
        s.wantFire = a[2] > 0.5;
    }
    nucleo.tick(dt);
    return { done: nucleo.info().terminado, info: nucleo.info() };
};
window.ALISA_STREAM_SIM_NAME = 'asteroid_gauntlet';
</script>

<!-- El botón de «algo se ve raro»: adjunta el mundo entero porque esta página
     publica `window.getSustrato()`. -->
<script type="module" src="/arcade/js/protohub/reportar.js"></script>
</body>
</html>
