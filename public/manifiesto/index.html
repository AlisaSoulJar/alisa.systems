    <style>
        body { 
            margin: 0; 
            background: #ffffff; 
            overflow: hidden; 
            font-family: 'Courier New', Courier, monospace; 
            color: #111;
        }
        canvas { display: block; }
        
        #hud { 
            position: fixed; top: 0; left: 0; width: 100%; z-index: 10;
            pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }
        
        .top-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid #ddd;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        
        .title {
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }
        
        .stats {
            display: flex;
            gap: 40px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #555;
        }
        
        .val { color: #000; font-weight: bold; }
        
        .progress-container {
            width: 50%;
            max-width: 600px;
            height: 4px;
            background: #eee;
            margin-top: 40px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            width: 100%;
            background: #000;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: width 1s linear;
        }
        
        .status-text {
            margin-top: 10px;
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #777;
        }
        
        .pulse { animation: pulsing 2s infinite; }
        
        @keyframes pulsing {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        
        #overlay-instruction {
            position: fixed; bottom: 30px; width: 100%; text-align: center;
            font-size: 11px; letter-spacing: 2px; color: #888;
        }
        
        #crosshair {
            position: fixed; top: 50%; left: 50%;
            width: 4px; height: 4px; background: white;
            border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 100; pointer-events: none; mix-blend-mode: difference;
        }
        #target-label {
            position: fixed; top: 55%; left: 50%;
            transform: translateX(-50%);
            color: #818cf8; font-family: monospace; font-size: 16px;
            z-index: 100; pointer-events: none; text-shadow: 0 0 5px #0b0b14;
            text-align: center; white-space: pre-wrap;
        }
