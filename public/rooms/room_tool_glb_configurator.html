<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALISA - Sovereign Screen Configurator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { margin: 0; overflow: hidden; background: #e0e5ec; font-family: 'Inter', sans-serif; user-select: none; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; padding: 30px; z-index: 10;
        }

        .hud-panel {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border: 1px solid rgba(0,0,0,0.1); border-radius: 12px;
            padding: 20px; pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); color: #1a1a2e; width: 380px;
        }

        h1 { font-size: 21px; font-weight: 900; letter-spacing: -0.5px; margin-bottom: 5px; color: #673AB7; }
        .subtitle { font-size: 11px; color: #666; font-family: 'JetBrains Mono', monospace; }

        .select-style {
            width: 100%; pointer-events:auto; background: rgba(103, 58, 183, 0.05); 
            color: #673AB7; border: 1px solid #673AB7; padding: 8px; 
            border-radius: 4px; font-family: 'JetBrains Mono', monospace; 
            font-size: 12px; outline:none; cursor:pointer; margin-bottom:10px;
        }

        .select-style:disabled {
            background: #eee; border-color: #ccc; color: #999;
        }

        .btn-action {
            width: 100%; border: 1px solid #1976D2; background: rgba(33, 150, 243, 0.1);
            color: #1976D2; cursor:pointer; padding: 10px; margin-top: 10px;
            font-family: 'JetBrains Mono', monospace; border-radius: 4px; font-weight: bold;
            transition: all 0.2s;
        }
        .btn-action:hover { background: rgba(33, 150, 243, 0.2); }
        
        .btn-export {
            width: 100%; border: 1px solid #4CAF50; background: rgba(76, 175, 80, 0.1);
            color: #4CAF50; cursor:pointer; padding: 10px; margin-top: 15px;
            font-family: 'JetBrains Mono', monospace; border-radius: 4px; font-weight: bold;
        }

    </style>
<link rel="stylesheet" href="/vendor/fonts/fuentes.css">
</head>
<body>

    <div id="ui-layer">
        <div class="hud-panel">
            <h1>📐 SCREEN CONFIGURATOR</h1>
            <div class="subtitle">Universal Mesh Targeting & Projection Mapping</div>
            
            <div style="margin-top: 20px;">
                <span style="font-size:12px;font-weight:bold;color:#333;">STEP 1: ROOT GLB PROP</span>
                <select id="propSelect" class="select-style" onchange="loadProp(this.value)">
                    <option value="none" selected>-- Select a physical prop --</option>
                    <option value="Alien Computer.glb">Alien Computer</option>
                    <option value="Computer.glb">Computer</option>
                    <option value="Gaming Computer.glb">Gaming Computer</option>
                    <option value="Monitor.glb">Monitor</option>
                    <option value="Simple Computer Monitor.glb">Simple Computer Monitor</option>
                    <option value="Radio.glb">Radio</option>
                    <option value="iFruit Vintage Computer.glb">iFruit Vintage Computer</option>
                    <option value="Arcade Machine.glb">Retro Arcade Cabinet</option>
                </select>
            </div>

            <div>
                <span style="font-size:12px;font-weight:bold;color:#333;">STEP 2: TARGET MESH</span>
                <select id="meshSelect" class="select-style" onchange="targetMesh(this.value)" disabled>
                    <option value="none">-- Pending Load --</option>
                </select>
            </div>

            <!-- DYNAMIC CALIBRATION UI -->
            <div id="calibration-tool" style="display:none; margin-top:10px; padding: 15px; background: rgba(0,0,0,0.03); border: 1px dashed #ccc; border-radius:6px; font-size:11px; font-family:'JetBrains Mono', monospace;">
                <strong style="color:#E91E63">DIAL SPATIAL MATRIX</strong><br><br>
                
                <div style="display:flex; justify-content:space-between; margin-top:5px;"><span>YAW Y:</span> <span id="valRotY">0°</span></div>
                <input type="range" id="calibRotY" min="-180" max="180" value="0" style="width:100%" oninput="applyCalibration()">

                <div style="display:flex; justify-content:space-between; margin-top:10px;"><span>PITCH X:</span> <span id="valRotX">0°</span></div>
                <input type="range" id="calibRotX" min="-90" max="90" value="0" style="width:100%" oninput="applyCalibration()">
                
                <div style="display:flex; justify-content:space-between; margin-top:10px;"><span>DEPTH Z:</span> <span id="valZ">2 cm</span></div>
                <input type="range" id="calibZ" min="-500" max="500" value="2" style="width:100%" oninput="applyCalibration()">
                
                <div style="display:flex; justify-content:space-between; margin-top:10px;"><span>HEIGHT Y:</span> <span id="valY">0 cm</span></div>
                <input type="range" id="calibY" min="-500" max="500" value="0" style="width:100%" oninput="applyCalibration()">
                
                <div style="display:flex; justify-content:space-between; margin-top:10px;"><span>OFFSET X:</span> <span id="valX">0 cm</span></div>
                <input type="range" id="calibX" min="-500" max="500" value="0" style="width:100%" oninput="applyCalibration()">
                
                <div style="display:flex; justify-content:space-between; margin-top:10px;"><span>SCALE W:</span> <span id="valScW">1.00</span></div>
                <input type="range" id="calibScW" min="1" max="2000" value="100" style="width:100%" oninput="applyCalibration()">
                
                <div style="display:flex; justify-content:space-between; margin-top:10px;"><span>SCALE H:</span> <span id="valScH">1.00</span></div>
                <input type="range" id="calibScH" min="1" max="2000" value="100" style="width:100%" oninput="applyCalibration()">
                
                <button class="btn-export" onclick="exportJSON()">💾 EXPORT RAW JSON</button>
            </div>

            <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 20px 0;">
            
            <div id="status" style="color:#666; font-size:11px; font-family:'JetBrains Mono', monospace;">
                Awaiting prop payload...
            </div>

            <a href="../lab.html" class="btn-action" style="display:block; text-align:center; text-decoration:none; margin-top:20px; border-color:#999; color:#666; background:#fff">⮌ EXIT TO OVERWORLD</a>
            <button class="btn-action" style="border-color:#0ed; color:#0ed; background:rgba(0, 238, 221, 0.1);" onclick="toggleXRay()">🩻 TOGGLE X-RAY</button>
        </div>
    </div>

    <!-- Import map mapped to alisa-engine -->
    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three-0.160.0/build/three.module.js",
            "three/addons/": "/vendor/three-0.160.0/examples/jsm/",
            "@alisa-engine/": "../js/alisa-engine/"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { AssetManager } from '@alisa-engine/src/soma/AssetManager.js';

        // Expose to window for inline logic access
        window.THREE = Object.assign({}, THREE);
        window.THREE.OrbitControls = OrbitControls;

        import { AlisaRenderCore } from '@alisa-engine/src/soma/AlisaRenderCore.js';

        const gfx = new AlisaRenderCore({
            clearColor: 0xf0f2f5,
            fogColor: 0xf0f2f5,
            fogDensity: 0.03,
            useShadows: true,
            cameraPosition: new THREE.Vector3(2, 1.5, 3)
        });
        const scene = gfx.scene;
        const camera = gfx.camera;
        const renderer = gfx.renderer;
        const controls = gfx.controls;
        controls.target.set(0, 0.5, 0);

        window.scene = scene;
        window.camera = camera;
        window.renderer = renderer;
        window.controls = controls;

        // Lights & Environment
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xcadcfa, 0.8); scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 8, 5); dirLight.castShadow = true; scene.add(dirLight);
        const grid = new THREE.GridHelper(20, 20, 0x000000, 0x000000); grid.material.opacity = 0.08; grid.material.transparent = true; scene.add(grid);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({ opacity: 0.15 }));
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

        // X-RAY Logic
        let isXRay = false;
        let currentPropMesh = null;
        window.toggleXRay = function() {
            if (!currentPropMesh) return;
            isXRay = !isXRay;
            currentPropMesh.traverse((child) => {
                if (child.isMesh && child.material) {
                    child.material.transparent = isXRay;
                    child.material.opacity = isXRay ? 0.3 : 1.0;
                    child.material.needsUpdate = true;
                    // Never make the debug screen ghosted
                    if(currentDebugScreen && child.uuid === currentDebugScreen.uuid) {
                        child.material.transparent = false; child.material.opacity = 1.0;
                    }
                }
            });
        };

        // DOM Logic
        let meshDictionary = {};
        let currentDebugScreen = null;
        let currentPropGroup = new THREE.Group();
        scene.add(currentPropGroup);

        function clearProp() {
            while(currentPropGroup.children.length > 0) currentPropGroup.remove(currentPropGroup.children[0]);
            if(currentDebugScreen) { scene.remove(currentDebugScreen); currentDebugScreen = null; }
            document.getElementById('calibration-tool').style.display = 'none';
            document.getElementById('meshSelect').disabled = true;
            document.getElementById('meshSelect').innerHTML = '<option value="none">-- Pending Load --</option>';
        }

        window.loadProp = function(filename) {
            if(filename === 'none') return clearProp();
            clearProp();
            document.getElementById('status').innerText = 'Loading geometry...';

            AssetManager.loadModelAsync('../props/models/' + filename).then(gltf => {
                currentPropMesh = gltf.scene;
                
                // Normalizamos tamaño universal para facilidad visual (Max axis = 1.5m)
                const bbox = new THREE.Box3().setFromObject(currentPropMesh);
                const size = bbox.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleF = 1.5 / (maxDim || 1);
                currentPropMesh.scale.set(scaleF, scaleF, scaleF);
                
                // Asentar en el suelo
                const adjustedBbox = new THREE.Box3().setFromObject(currentPropMesh);
                currentPropMesh.position.y = -adjustedBbox.min.y;
                
                // Extracción Forense de Mallas (Mesh Discovery Process)
                meshDictionary = {};
                const meshSelect = document.getElementById('meshSelect');
                meshSelect.innerHTML = '<option value="none">-- 2. Select Target Mesh --</option>';
                meshSelect.innerHTML += '<option value="FREE_PLACEMENT">-- 🔮 FREE PLACEMENT (NO SNAP) --</option>';
                
                currentPropMesh.traverse((child) => {
                    if(child.isMesh) {
                        child.castShadow = true; 
                        child.receiveShadow = true;
                        meshDictionary[child.name] = child;
                        const opt = document.createElement('option');
                        opt.value = child.name;
                        opt.innerText = child.name;
                        meshSelect.appendChild(opt);
                    }
                });
                
                currentPropGroup.add(currentPropMesh);
                meshSelect.disabled = false;
                document.getElementById('status').innerText = `[✓] ${Object.keys(meshDictionary).length} child meshes localized. Awaiting target...`;
            }).catch(e => {
                document.getElementById('status').innerText = `[X] Error loading model`;
                console.error("AssetManager load error:", e);
            });
        };

        window.targetMesh = function(meshName) {
            if(meshName === 'none') {
                if(currentDebugScreen) scene.remove(currentDebugScreen);
                document.getElementById('calibration-tool').style.display = 'none';
                return;
            }

            if(currentDebugScreen) scene.remove(currentDebugScreen);
            
            // Reset Sliders UI
            ['calibRotY', 'calibRotX', 'calibZ', 'calibY', 'calibX'].forEach(id => document.getElementById(id).value = 0);
            ['calibScW', 'calibScH'].forEach(id => document.getElementById(id).value = 100);
            
            let geomHeight = 0.75;
            let geomWidth = 1.0;
            let trueCenter = new THREE.Vector3(0, 0.5, 0);

            if (meshName !== 'FREE_PLACEMENT') {
                const screenMesh = meshDictionary[meshName];
                const screenBox = new THREE.Box3().setFromObject(screenMesh);
                const size = new THREE.Vector3();
                screenBox.getSize(size);
                geomHeight = size.y || 0.5;
                geomWidth = Math.sqrt(size.x*size.x + size.z*size.z); 
                screenBox.getCenter(trueCenter);
                window.activeScreenMesh = screenMesh;
            } else {
                window.activeScreenMesh = 'FREE_PLACEMENT';
            }
            window.activeCenter = trueCenter;

            // Create Canvas Native Generator
            const canvas = document.createElement('canvas');
            canvas.width = 800; canvas.height = 600;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#111'; ctx.fillRect(0,0,800,600);
            ctx.strokeStyle = '#0ed'; ctx.globalAlpha = 0.3;
            for(let i=0; i<800; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,600); ctx.stroke(); }
            for(let i=0; i<600; i+=50) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(800,i); ctx.stroke(); }
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = '#0ed'; ctx.font = '50px "JetBrains Mono", monospace'; ctx.textAlign='center';
            ctx.fillText("PROJECTION", 400, 300);
            ctx.font = '20px monospace'; ctx.fillStyle='#E91E63';
            ctx.fillText(meshName, 400, 350);
            
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping; tex.repeat.x = -1; // Native mirror correction
            
            const geo = new THREE.PlaneGeometry(geomWidth, geomHeight);
            const mat = new THREE.MeshBasicMaterial({map: tex, side: THREE.DoubleSide});
            currentDebugScreen = new THREE.Mesh(geo, mat);
            scene.add(currentDebugScreen);
            
            document.getElementById('calibration-tool').style.display = 'block';
            document.getElementById('status').innerText = `[✓] Injecting matrix into ${meshName}. Tweak sliders below to flush alignment.`;
            
            applyCalibration();
        };

        window.applyCalibration = function() {
            if(!currentDebugScreen || !window.activeScreenMesh || !window.activeCenter) return;
            
            const trueCenter = window.activeCenter;

            const ryRaw = parseInt(document.getElementById('calibRotY').value);
            const rxRaw = parseInt(document.getElementById('calibRotX').value);
            const zCm = parseInt(document.getElementById('calibZ').value);
            const yCm = parseInt(document.getElementById('calibY').value);
            const xCm = parseInt(document.getElementById('calibX').value);
            const scW = parseInt(document.getElementById('calibScW').value) / 100;
            const scH = parseInt(document.getElementById('calibScH').value) / 100;
            
            document.getElementById('valRotY').innerText = ryRaw + '°';
            document.getElementById('valRotX').innerText = rxRaw + '°';
            document.getElementById('valZ').innerText = zCm + ' cm';
            document.getElementById('valY').innerText = yCm + ' cm';
            document.getElementById('valX').innerText = xCm + ' cm';
            document.getElementById('valScW').innerText = scW.toFixed(2);
            document.getElementById('valScH').innerText = scH.toFixed(2);

            currentDebugScreen.position.copy(trueCenter);
            currentDebugScreen.rotation.set(0,0,0);
            currentDebugScreen.scale.set(scW, scH, 1);
            
            // Yaw Rotation (Front Facing Native usually needs + or - 90 / 180 adaptation depending on the GLTF's original facing point)
            currentDebugScreen.rotation.y = ryRaw * (Math.PI/180);
            
            // Global Height Tuning
            currentDebugScreen.position.y += (yCm / 100);

            // Pitch Screen Backwards or Forwards
            currentDebugScreen.rotateX(rxRaw * (Math.PI/180));
            
            // Plunge Depth and Horizontal Offset
            currentDebugScreen.translateX(xCm / 100);
            currentDebugScreen.translateZ(zCm / 100);
        };

        window.exportJSON = function() {
            const obj = {
                prop_file: document.getElementById('propSelect').value,
                screen_mesh: document.getElementById('meshSelect').value,
                calibration: {
                    yaw_y: parseInt(document.getElementById('calibRotY').value),
                    pitch_x: parseInt(document.getElementById('calibRotX').value),
                    depth_z: parseInt(document.getElementById('calibZ').value) / 100,
                    height_y: parseInt(document.getElementById('calibY').value) / 100,
                    offset_x: parseInt(document.getElementById('calibX').value) / 100,
                    scale_w: parseFloat((parseInt(document.getElementById('calibScW').value) / 100).toFixed(2)),
                    scale_h: parseFloat((parseInt(document.getElementById('calibScH').value) / 100).toFixed(2))
                }
            };
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(obj, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = 'screen_calib_' + obj.prop_file.replace('.glb', '') + '.json';
            a.click();
        };

        gfx.startLoop();
    </script>
</body>
</html>
