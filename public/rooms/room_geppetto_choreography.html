<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALISA - Geppetto Choreography Stage</title>

    <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three-0.160.0/build/three.module.js",
            "three/addons/": "/vendor/three-0.160.0/examples/jsm/",
            "@alisa-engine/": "../js/alisa-engine/"
        }
    }
    </script>

    <style>
        @import url('/vendor/fonts/fuentes.css');
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #05050a; font-family: 'JetBrains Mono', 'Courier New', monospace; }

        #hud-top {
            position: absolute; top: 20px; left: 20px; color: #00ffff;
            text-shadow: 0 0 10px rgba(0,255,255,0.5), 0 0 30px rgba(0,255,255,0.2); pointer-events: none; z-index: 100;
        }
        h1 { font-size: 22px; margin: 0; font-weight: 700; letter-spacing: 3px; }
        .subtitle { font-size: 10px; opacity: 0.6; letter-spacing: 5px; margin-top: 6px; font-weight: 300; }

        #log-panel {
            position: absolute; bottom: 20px; left: 20px;
            width: 420px; height: 170px; overflow-y: auto;
            color: #0a0; font-size: 11px;
            background: rgba(0, 8, 0, 0.8); border: 1px solid rgba(0,255,0,0.4);
            padding: 12px; border-left: 3px solid #0f0;
            box-shadow: 0 0 20px rgba(0,255,0,0.1), inset 0 0 30px rgba(0,20,0,0.5); z-index: 100;
            backdrop-filter: blur(4px);
        }
        #log-panel p { margin: 2px 0; line-height: 1.4; }
        .log-highlight { color: #00ffff; font-weight: 700; text-shadow: 0 0 6px rgba(0,255,255,0.4); }

        #status-panel {
            position: absolute; top: 20px; right: 20px;
            width: 300px;
            background: rgba(0, 8, 15, 0.88); border: 1px solid rgba(0,255,255,0.4);
            padding: 16px; color: #fff;
            box-shadow: 0 0 30px rgba(0,255,255,0.12), inset 0 0 40px rgba(0,20,40,0.4);
            border-right: 3px solid #00ffff; z-index: 100;
            backdrop-filter: blur(4px);
        }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 5px; }
        .stat-val { color: #00ffcc; font-weight: 700; text-shadow: 0 0 4px rgba(0,255,255,0.3); }

        #progress-bar {
            width: 100%; height: 4px; background: rgba(255,255,255,0.08); margin-top: 12px; border-radius: 2px; overflow: hidden;
        }
        #progress-fill {
            width: 0%; height: 100%; background: linear-gradient(90deg, #00ffff, #00ff88); transition: width 0.3s ease;
            box-shadow: 0 0 8px rgba(0,255,255,0.5);
        }

        .btn {
            position: absolute; bottom: 20px; right: 20px;
            background: rgba(0,255,0,0.05); color: #0f0; border: 1px solid rgba(0,255,0,0.5);
            padding: 14px 28px; font-family: 'JetBrains Mono', monospace; font-size: 13px;
            cursor: pointer; text-transform: uppercase; letter-spacing: 3px;
            transition: all 0.3s; z-index: 100;
            box-shadow: 0 0 15px rgba(0,255,0,0.1);
        }
        .btn:hover { background: rgba(0,255,0,0.9); color: #000; box-shadow: 0 0 30px rgba(0,255,0,0.5); }

        .impact-flash {
            position: absolute; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(ellipse at center, rgba(0,255,200,0.2) 0%, transparent 60%); pointer-events: none;
            opacity: 0; transition: opacity 0.1s; z-index: 50;
        }
    </style>
</head>
<body>

    <div class="impact-flash" id="impact-flash"></div>

    <div id="hud-top">
        <h1>🏭 GEPPETTO KINEMATICS STAGE</h1>
        <div class="subtitle">NEUROMOTOR KINEMATICS · PHASE 3</div>
    </div>

    <div id="status-panel">
        <div class="stat-row"><span>SYSTEM_STATE:</span> <span class="stat-val" id="ui-state">IDLE</span></div>
        <div class="stat-row"><span>GEPPETTO.FSM:</span> <span class="stat-val" id="ui-fsm" style="color:#ffaa00">BOOTING</span></div>
        <div class="stat-row"><span>TARGET_ASSET:</span> <span class="stat-val" id="ui-asset">—</span></div>
        <div class="stat-row"><span>KATAMARI_TIER:</span> <span class="stat-val" id="ui-tier">—</span></div>
        <div class="stat-row"><span>SOCKET_NODES:</span> <span class="stat-val" id="ui-nodes">0</span></div>
        <div class="stat-row"><span>PROCESSED:</span> <span class="stat-val" id="ui-count">0</span></div>
        <div id="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div id="log-panel"></div>

    <button class="btn" onclick="startFactory()" id="btn-start">⚡ Boot Gigafactory</button>

    <script type="module">
        import * as THREE from 'three';
        import { AlisaRenderCore } from '@alisa-engine/soma/AlisaRenderCore.js';
        import { GeppettoEnvironmentFactory } from '@alisa-engine/extensions/avatar-pipeline/GeppettoEnvironmentFactory.js';
        import { GeppettoKinematics } from '@alisa-engine/extensions/avatar-pipeline/GeppettoKinematics.js';
        import { GeppettoChoreographySystem } from '@alisa-engine/extensions/avatar-pipeline/GeppettoChoreographySystem.js';

        const engine = new AlisaRenderCore({
            clearColor: 0x05050a,
            fogColor: 0x050810,
            fogDensity: 0.018,
            cameraPosition: new THREE.Vector3(14, 10, 14)
        });
        engine.controls.target.set(0, 4, 0);

        const envFactory = new GeppettoEnvironmentFactory(engine.scene, engine);
        envFactory.setupLighting();
        envFactory.setupRoom();
        envFactory.setupTank();
        envFactory.setupServerRack();
        envFactory.setupCables();
        envFactory.setupDust();

        const kinematics = new GeppettoKinematics();

        const uiConfig = {
            logElement: document.getElementById('log-panel'),
            stateElement: document.getElementById('ui-state'),
            fsmElement: document.getElementById('ui-fsm'),
            assetElement: document.getElementById('ui-asset'),
            tierElement: document.getElementById('ui-tier'),
            nodesElement: document.getElementById('ui-nodes'),
            progressElement: document.getElementById('progress-fill'),
            impactElement: document.getElementById('impact-flash')
        };

        const choreoSystem = new GeppettoChoreographySystem(engine, envFactory, kinematics, uiConfig);
        
        window.geppettoBrain = choreoSystem.brain;
        window.startFactory = function () { /* no-op, cycle manages itself */ };
        
        choreoSystem.runCycle();

        let elapsed = 0;
        engine.startLoop((dt) => {
            elapsed += dt;
            choreoSystem.onUpdate(dt, elapsed);
        });
    </script>
</body>
</html>
