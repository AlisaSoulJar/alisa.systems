<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALISA — Akasha Vector Core</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000008; font-family: monospace; color: #fff; user-select: none; }
        #hud {
            position: absolute; top: 10px; left: 10px;
            font-family: monospace; background: rgba(5, 10, 15, 0.85);
            padding: 14px 18px; border-radius: 10px; border: 1px solid #44eebb;
            pointer-events: auto; font-size: 13px; line-height: 1.8; z-index: 10;
            box-shadow: 0 0 20px rgba(68, 238, 187, 0.2);
            backdrop-filter: blur(4px);
        }
        #hud .title { color: #44eebb; font-size: 15px; font-weight: bold; margin-bottom: 6px; letter-spacing: 2px; }
        .stat { color: #88ddbb; }
        .v-cyan { color: #88ccff; font-weight: bold; }
        .v-magenta { color: #ff55ff; font-weight: bold; }
        #messages { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: bold; letter-spacing: 1px; color: #44eebb; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 6px; z-index: 30; opacity: 0; transition: opacity 0.3s; pointer-events: none; border: 1px solid #22cc88; }
        .mode-badge { position: fixed; top: 10px; right: 10px; padding: 4px 10px; border-radius: 4px; font-size: 10px; font-weight: bold; background: #002211; color: #22cc88; border: 1px solid #22cc88; z-index: 20; letter-spacing: 1px; }
        #loader { position: fixed; inset: 0; background: #000; display: flex; align-items: center; justify-content: center; z-index: 100; color: #44eebb; font-size: 24px; letter-spacing: 4px; transition: opacity 1s; }
    </style>
    <script type="importmap">
    { 
        "imports": { 
            "three": "/vendor/three-0.160.0/build/three.module.js",
            "three/addons/": "/vendor/three-0.160.0/examples/jsm/",
            "@alisa-engine/": "../js/alisa-engine/" 
        } 
    }
    </script>
</head>
<body>

<div id="loader">INITIALIZING AKASHA CORE...</div>

<div id="hud">
    <div class="title">💠 AKASHA VECTOR CORE</div>
    <span class="stat">VECTORS:</span> <span id="hVectors" class="v-cyan">4096</span><br>
    <span class="stat">DIMENSIONS:</span> <span id="hDim" class="v-cyan">768</span><br>
    <span class="stat">STATUS:</span> <span id="hStatus" class="v-magenta">SYNTHESIZING</span><br>
    <hr style="border:0; border-top:1px solid #113322; margin: 8px 0;">
    <div style="font-size: 10px; color:#558877;">DRAG = Orbit | SCROLL = Zoom</div>
</div>

<div id="messages"></div>
<div class="mode-badge">SOVEREIGN MEMORY</div>

<script type="module">
import * as THREE from 'three';
import { AlisaRenderCore } from '@alisa-engine/src/soma/AlisaRenderCore.js';

const gfx = new AlisaRenderCore({
    clearColor: 0x010204,
    cameraPosition: new THREE.Vector3(0, 10, 30)
});
const scene = gfx.scene;
const camera = gfx.camera;
const controls = gfx.controls;

controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.maxDistance = 100;
controls.minDistance = 2;

// Lighting setup for the neural core
const ambientLight = new THREE.AmbientLight(0x111122, 1.0);
scene.add(ambientLight);

const coreLight = new THREE.PointLight(0x44eebb, 3.0, 50);
coreLight.position.set(0, 0, 0);
scene.add(coreLight);

// --- The Akasha Geometry ---
const VECTORS_COUNT = 4096;
const clusterGeometry = new THREE.IcosahedronGeometry(0.1, 1);

// We use InstancedMesh for hyper-performance
const material = new THREE.MeshPhysicalMaterial({
    color: 0x22cc88,
    emissive: 0x116644,
    emissiveIntensity: 0.8,
    transparent: true,
    opacity: 0.9,
    roughness: 0.2,
    metalness: 0.8
});

const instancedMesh = new THREE.InstancedMesh(clusterGeometry, material, VECTORS_COUNT);
instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(instancedMesh);

const dummy = new THREE.Object3D();
const positions = new Float32Array(VECTORS_COUNT * 3);
const phases = new Float32Array(VECTORS_COUNT);

// Distribute vectors in a galaxy/brain-like sphere with tendrils
for (let i = 0; i < VECTORS_COUNT; i++) {
    // Spherical distribution with clustering
    const u = Math.random();
    const v = Math.random();
    const theta = u * 2.0 * Math.PI;
    const phi = Math.acos(2.0 * v - 1.0);
    
    // Create distinct arms or clusters based on modulo
    const arm = i % 5;
    let radius = Math.cbrt(Math.random()) * 20; 
    if (arm === 0) radius *= 0.3; // Dense core
    
    // Add noise to twist the arms
    const x = radius * Math.sin(phi) * Math.cos(theta + arm * 0.5);
    const y = (radius * 0.5) * Math.cos(phi); // Flatten Y slightly
    const z = radius * Math.sin(phi) * Math.sin(theta + arm * 0.5);

    positions[i * 3] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
    
    phases[i] = Math.random() * Math.PI * 2;

    dummy.position.set(x, y, z);
    const scale = Math.random() * 0.8 + 0.2;
    dummy.scale.set(scale, scale, scale);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(i, dummy.matrix);
}

// Color coding for different semantic zones
const colors = [
    new THREE.Color(0x44eebb), // Cyan/Mint
    new THREE.Color(0x2288ff), // Deep Blue
    new THREE.Color(0xff44ff), // Magenta
    new THREE.Color(0x00ff88)  // Bright Green
];

for (let i = 0; i < VECTORS_COUNT; i++) {
    const cIdx = Math.floor(Math.random() * colors.length);
    instancedMesh.setColorAt(i, colors[cIdx]);
}

instancedMesh.instanceMatrix.needsUpdate = true;
instancedMesh.instanceColor.needsUpdate = true;

// --- Central Core Singularity ---
const singularityGeo = new THREE.SphereGeometry(1.5, 32, 32);
const singularityMat = new THREE.MeshStandardMaterial({
    color: 0x000000,
    emissive: 0xffffff,
    emissiveIntensity: 0.1,
    wireframe: true,
    transparent: true,
    opacity: 0.8
});
const singularity = new THREE.Mesh(singularityGeo, singularityMat);
scene.add(singularity);

// Connections (Lines)
const points = [];
for (let i = 0; i < 200; i++) {
    points.push(new THREE.Vector3(positions[i*3], positions[i*3+1], positions[i*3+2]));
}
const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
const lineMat = new THREE.LineBasicMaterial({ color: 0x2288ff, transparent: true, opacity: 0.15 });
const lines = new THREE.LineSegments(lineGeo, lineMat);
scene.add(lines);

// --- Particle Dust ---
const dustGeo = new THREE.BufferGeometry();
const dustPos = [];
for (let i = 0; i < 5000; i++) {
    dustPos.push((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 60);
}
dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustPos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.05, transparent: true, opacity: 0.3 });
const dust = new THREE.Points(dustGeo, dustMat);
scene.add(dust);

// UI Logic
setTimeout(() => {
    const loader = document.getElementById('loader');
    loader.style.opacity = '0';
    setTimeout(() => loader.remove(), 1000);
    document.getElementById('hStatus').textContent = 'COGNITIVE RESONANCE OK';
    document.getElementById('hStatus').style.color = '#34c759';
}, 1500);

let clockTime = 0;

gfx.startLoop((dt) => {
    clockTime += dt;
    
    // Rotate the entire mesh slowly
    instancedMesh.rotation.y = clockTime * 0.05;
    instancedMesh.rotation.z = Math.sin(clockTime * 0.02) * 0.1;
    
    // Pulse the singularity
    const pulse = 1.0 + Math.sin(clockTime * 2.0) * 0.05;
    singularity.scale.set(pulse, pulse, pulse);
    singularity.rotation.y -= dt * 0.5;
    singularity.rotation.x += dt * 0.3;
    
    // Update a subset of vectors for breathing effect
    for (let i = 0; i < 500; i++) {
        // Find position and apply a slight orbit
        const idx = i;
        const x = positions[idx * 3];
        const y = positions[idx * 3 + 1];
        const z = positions[idx * 3 + 2];
        
        const floatY = y + Math.sin(clockTime * 2.0 + phases[idx]) * 0.5;
        
        dummy.position.set(x, floatY, z);
        dummy.updateMatrix();
        instancedMesh.setMatrixAt(idx, dummy.matrix);
    }
    instancedMesh.instanceMatrix.needsUpdate = true;
    
    // Rotate dust
    dust.rotation.y = clockTime * -0.02;
    lines.rotation.y = clockTime * 0.05;
});

// Interactive Raycasting for Vector Extraction
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('pointerdown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
    
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    
    // InstancedMesh intersection
    const intersects = raycaster.intersectObject(instancedMesh);
    if (intersects.length > 0) {
        const instanceId = intersects[0].instanceId;
        
        // Highlight logic (Change color temporarily)
        const oldColor = new THREE.Color();
        instancedMesh.getColorAt(instanceId, oldColor);
        instancedMesh.setColorAt(instanceId, new THREE.Color(0xffffff));
        instancedMesh.instanceColor.needsUpdate = true;
        
        const msgBox = document.getElementById('messages');
        msgBox.innerHTML = `V[${instanceId}] HASH: ${Math.random().toString(36).substring(2, 10).toUpperCase()}`;
        msgBox.style.opacity = '1';
        
        setTimeout(() => {
            instancedMesh.setColorAt(instanceId, oldColor);
            instancedMesh.instanceColor.needsUpdate = true;
            msgBox.style.opacity = '0';
        }, 1500);
    }
});

</script>
</body>
</html>
