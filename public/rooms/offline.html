<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALISA - OFFLINE</title>
    <style>
        body {
            background-color: #000;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            text-transform: uppercase;
        }
        .container {
            border: 2px solid #ff3333;
            padding: 40px;
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.4);
            animation: pulse 2s infinite;
        }
        h1 {
            font-size: 48px;
            letter-spacing: 10px;
            margin-bottom: 20px;
        }
        p {
            font-size: 24px;
            color: #888;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 20px rgba(255, 51, 51, 0.4); }
            50% { box-shadow: 0 0 40px rgba(255, 51, 51, 0.8); }
            100% { box-shadow: 0 0 20px rgba(255, 51, 51, 0.4); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NODE OFFLINE</h1>
        <p>AWAITING COLONIAL ASSIGNMENT</p>
    </div>
</body>
</html>
