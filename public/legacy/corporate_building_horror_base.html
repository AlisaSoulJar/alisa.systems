        const phaseIcons = {
            PICK_FLOOR: '🎯 PICKING',
            TRAVEL: '🚀 TRAVEL→F' + (seekerAI.aiTargetFloor + 1),
            EXPLORE: '🔍 SWEEP F' + (seekerAI.aiTargetFloor + 1),
        };
        const aiPhaseElem = document.getElementById('valAIPhase');
        if (aiPhaseElem) {
            aiPhaseElem.textContent = phaseIcons[seekerAI.phase] || seekerAI.phase;
            aiPhaseElem.style.color = seekerAI.phase === 'EXPLORE' ? '#ff9500' : seekerAI.phase === 'TRAVEL' ? '#00aaff' : '#aaddff';
        }
        // Posterior beliefs bar: [■■□□□□] per floor
        const belElem = document.getElementById('valBeliefs');
        if (belElem && seekerAI.beliefs.length > 0) {
            const maxB = Math.max(...seekerAI.beliefs);
            let bar = '';
            for (let i = 0; i < seekerAI.beliefs.length; i++) {
                const b = seekerAI.beliefs[i];
                const isExplored = seekerAI.exploredFloors.has(i);
                const isCurrent = (i === seeker.floor);
                if (isExplored) bar += '<span style="color:#333">✗</span>';
                else if (b >= maxB * 0.9 && b > 0) bar += '<span style="color:#ff3300">■</span>';
                else if (b > 0.01) bar += '<span style="color:#ffaa00">□</span>';
                else bar += '<span style="color:#333">·</span>';
                if (isCurrent) bar += '<span style="color:#fff">▲</span>';
            }
            belElem.innerHTML = bar;
        }
    }
}

// ═══════════════════════════════════════════════════════════
//  CÓRTEX TIBURÓN — Intelligent Seeker AI
//  Ported from Hide & Seek (room exploration, spatial memory)
//  + Chopper Search (vertical navigation, temperature narrowing)
// ═══════════════════════════════════════════════════════════

// ─── Bayesian Belief Update (from Chopper temperature system) ───
function updateBeliefs(checkedFloor, result) {
    const n = seekerAI.beliefs.length;
    for (let i = 0; i < n; i++) {
        if (result === 'FOUND!') {
            seekerAI.beliefs[i] = (i === checkedFloor) ? 1.0 : 0.0;
            return;
        }
        const dist = Math.abs(i - checkedFloor);
        let likelihood = 1.0;
        if (result === 'COLD') {
            if (dist <= 1) likelihood = 0.0;
            else if (dist <= 2) likelihood = 0.15;
            else likelihood = 1.2;
        } else if (result === 'HOT') {
            if (dist === 0) likelihood = 5.0;
            else if (dist <= 1) likelihood = 1.5;
            else likelihood = 0.3;
        } else if (result === 'WARM') {
            if (dist === 0) likelihood = 3.0;
            else if (dist <= 2) likelihood = 1.2;
            else likelihood = 0.5;
        }
        seekerAI.beliefs[i] *= likelihood;
    }
    seekerAI.exploredFloors.forEach(ef => { seekerAI.beliefs[ef] = 0; });
    const sum = seekerAI.beliefs.reduce((a, b) => a + b, 0);
    if (sum > 0) seekerAI.beliefs = seekerAI.beliefs.map(b => b / sum);
}

// ─── Pick best floor by posterior (Chopper's intelligent floor selection) ───
function pickBestFloor() {
    let bestFloor = -1, bestP = -1;
    for (let i = 0; i < seekerAI.beliefs.length; i++) {
        if (seekerAI.exploredFloors.has(i)) continue;
        const hasSearchables = floors[i] && (floors[i].doors.length > 0 || (floors[i].hidingSpots && floors[i].hidingSpots.length > 0));
        if (!hasSearchables) continue;
        if (seekerAI.beliefs[i] > bestP) {
            bestP = seekerAI.beliefs[i];
            bestFloor = i;
        }
    }
    return bestFloor;
}

// ─── Has this floor been fully swept? ───
function isFloorFullyChecked(floorIdx) {
    const fd = floors[floorIdx];
    if (!fd) return true;
    if (fd.doors.length > 0) {
        for (let i = 0; i < fd.doors.length; i++) {
            const checked = doorChecks.some(c => c.floor === floorIdx + 1 && c.door === String.fromCharCode(65 + i));
            if (!checked) return false;
        }
        return true;
    } else if (fd.hidingSpots && fd.hidingSpots.length > 0) {
        for (let i = 0; i < fd.hidingSpots.length; i++) {
            const checked = doorChecks.some(c => c.floor === floorIdx + 1 && c.door === fd.hidingSpots[i].label);
            if (!checked) return false;
        }
        return true;
    }
    return true;
}

// ─── Main AI Loop (Córtex Tiburón FSM) ───
// Split into BRAIN (autoAgentStep, setInterval 300ms) and BODY (aiMovement, every frame)
// Mirrors H&S pattern: aiTick() picks targets → moveSeeker() walks smoothly per-frame

// Action dispatcher for non-movement actions (stairs, elevator, search)
function _aiAction(intent) {
    intent = intent.toLowerCase().trim();
    if (intent === 'stairs_up') { keysJustPressed[' '] = true; }
    else if (intent === 'stairs_down') { keysJustPressed['s'] = true; }
    else if (intent === 'call_elevator') { keysJustPressed['e'] = true; }
    else if (intent === 'enter_elevator' || intent === 'exit_elevator') { keysJustPressed[' '] = true; }
    else if (intent === 'search_door') { keysJustPressed['enter'] = true; }
    else if (intent === 'toggle_minutero') { toggleMinutero(seeker.floor); }
    else if (intent.startsWith('goto_floor_')) {
        const n = parseInt(intent.split('_')[2]);
        if (n && n <= totalFloors) keysJustPressed[String(n)] = true;
    }
}

// ═══════════════════════════════════════════════════════════
//  AI BODY — Smooth continuous movement (called every frame from animate)
//  Ported from H&S moveSeeker + animateSeeker pattern
// ═══════════════════════════════════════════════════════════
function aiMovement(dt) {
    if (!autoPlaying || gamePhase !== 'seeking') return;
    if (seeker.mode !== 'walking' || seeker.inElevator) return;
    if (!seekerAI.moveTarget) return;

    const tx = seekerAI.moveTarget.x;
    const tz = seekerAI.moveTarget.z;
    const dx = tx - seeker.x;
    const dz = tz - seeker.z;
    const dist = Math.hypot(dx, dz);

    const arriveR = seekerAI.arrivalRadius;

    if (dist > arriveR) {
        // ─── Smooth walk toward target (H&S moveSeeker pattern) ───
        const nx = dx / dist;
        const nz = dz / dist;

        seeker.x += nx * seeker.speed * dt;
        seeker.z += nz * seeker.speed * dt;

        // ─── Smooth rotation interpolation ───
        let targetRotModel = Math.atan2(nx, nz);
        let targetRotLight = Math.atan2(nx, nz);
        
        if (seeker.visualModel) {
            let diff = targetRotModel - seeker.visualModel.rotation.y;
            while (diff > Math.PI) diff -= Math.PI * 2;
            while (diff < -Math.PI) diff += Math.PI * 2;
            seeker.visualModel.rotation.y += diff * 8 * dt;
        }
        
        if (seeker.flashLightGroup) {
            let diff2 = targetRotLight - seeker.flashLightGroup.rotation.y;
            while (diff2 > Math.PI) diff2 -= Math.PI * 2;
            while (diff2 < -Math.PI) diff2 += Math.PI * 2;
            seeker.flashLightGroup.rotation.y += diff2 * 12 * dt;
        }

        // ─── Walk animation ───
        seekerCurAnim = playCharAnim(seekerMixer, seekerAnimMap, seekerCurAnim, 'run');
        if (!seekerMixer && seeker.mesh && seeker.mesh.children[0]) {
            seeker.animPhase += dt * 10;
            seeker.mesh.children[0].rotation.z = Math.sin(seeker.animPhase) * 0.1;
        }

        // ─── Clamp inside corridor ───
        const fd = floors[seeker.floor];
        if (!fd) return;
        const halfW = CORRIDOR_W / 2 - 0.8;
        const halfD = CORRIDOR_DEPTH / 2 - 0.4;

        // Boiler corridor extension on floor 1
        let inBoiler = false;
        if (seeker.floor === 1) {
            const boilerDoorX = fd.stairDownX + 1.6*1.5 + 0.4;
            if (seeker.x > boilerDoorX - 1.0 && seeker.z < -halfD) {
                inBoiler = true;
            }
        }
        if (seeker.floor === totalFloors) {
            const rHalfW = CORRIDOR_W/2 + WALL_D*2 - 0.5;
            const rHalfD = (BUILDING_DEPTH + WALL_D*2)/2 - 0.5;
            const bCZ = -BUILDING_DEPTH/2 + CORRIDOR_DEPTH/2;
            seeker.x = Math.max(-rHalfW, Math.min(rHalfW, seeker.x));
            seeker.z = Math.max(bCZ - rHalfD, Math.min(bCZ + rHalfD, seeker.z));
        } else if (inBoiler) {
            seeker.x = Math.max(-halfW, Math.min(halfW, seeker.x));
            seeker.z = Math.max(-CORRIDOR_DEPTH/2 - 3.5, Math.min(halfD, seeker.z));
        } else {
            seeker.x = Math.max(-halfW, Math.min(halfW, seeker.x));
            seeker.z = Math.max(-halfD, Math.min(halfD, seeker.z));
        }

        // ─── Update mesh position ───
        if (seeker.mesh) {
            seeker.mesh.position.x = seeker.x;
            seeker.mesh.position.z = seeker.z;
        }
    } else {
        // ─── Arrived at target — fire pendingAction ───
        if (seekerAI.pendingAction) {
            _aiAction(seekerAI.pendingAction);
            seekerAI.pendingAction = null;
        }
        seekerAI.moveTarget = null;
        
        // Stop animation when arrived
        seekerCurAnim = playCharAnim(seekerMixer, seekerAnimMap, seekerCurAnim, 'idle');
    }
}

// ═══════════════════════════════════════════════════════════
//  AI BRAIN — Decision logic (called via setInterval 300ms)
//  Sets seekerAI.moveTarget + pendingAction for the BODY
// ═══════════════════════════════════════════════════════════
function autoAgentStep() {
    if (!simulationRunning || gameStatus === 'FOUND!' || !floors[seeker.floor]) return;
    if (gamePhase !== 'seeking') return;
    if (seeker.mode !== 'walking' && seeker.mode !== 'elevator') return;

    const fd = floors[seeker.floor];
    const targetZ = -CORRIDOR_DEPTH / 2 + 0.2;

    // ─── Survive the darkness! Let the AI turn on the minutero ───
    if (isLightsOut && floorLightTimers[seeker.floor] <= 0 && seeker.mode === 'walking') {
        _aiAction('toggle_minutero');
        return; // wait a tick
    }

    // ─── Urgency Speed Gradient (from H&S + Chopper) ───
    const urgency = Math.min(2.0, 1.0 + searches * 0.08);
    seeker.speed = seekerAI.baseSpeed * urgency;

    // Helper: set walk target (body will smoothly walk there)
    function walkTo(x, z, action) {
        seekerAI.moveTarget = { x: x, z: z };
        seekerAI.pendingAction = action || null;
    }

    // ─── Anti-Stuck Watchdog (from H&S wander reset) ───
    if (Math.abs(seeker.x - seekerAI.lastX) < 0.1 && seeker.floor === seekerAI.lastFloor) {
        seekerAI.stuckTimer += 0.3; // AI ticks every 300ms
    } else {
        seekerAI.stuckTimer = 0;
    }
    seekerAI.lastX = seeker.x;
    seekerAI.lastFloor = seeker.floor;

    if (seekerAI.stuckTimer > 3.0) {
        seekerAI.phase = 'PICK_FLOOR';
        seekerAI.stuckTimer = 0;
        seekerAI.moveTarget = null;
        if (seeker.inElevator) _aiAction('exit_elevator');
    }

    // Don't override a walk-in-progress (let the body finish walking)
    if (seekerAI.moveTarget) return;

    // ════════════════════════════════════════════
    //  PHASE 1: PICK_FLOOR (Bayesian selection)
    // ════════════════════════════════════════════
    if (seekerAI.phase === 'PICK_FLOOR') {
        if (isFloorFullyChecked(seeker.floor)) {
            seekerAI.exploredFloors.add(seeker.floor);
            seekerAI.beliefs[seeker.floor] = 0;
            const sum = seekerAI.beliefs.reduce((a, b) => a + b, 0);
            if (sum > 0) seekerAI.beliefs = seekerAI.beliefs.map(b => b / sum);
        }

        const best = pickBestFloor();
        if (best === -1) return;

        seekerAI.aiTargetFloor = best;
        seekerAI.sweepIndex = 0;

        const dist = Math.abs(seeker.floor - best);
        if (dist === 1) {
            seekerAI.travelMode = (fd.stairX !== null && fd.stairX !== undefined) ? 'stairs' : 'elevator';
        } else {
            seekerAI.travelMode = 'elevator';
        }

        seekerAI.phase = (seeker.floor === best) ? 'EXPLORE' : 'TRAVEL';
        seekerAI.switchToggled = (seeker.floor === best); // If already on floor, assume handled
        return;
    }

    // ════════════════════════════════════════════
    //  PHASE 2: TRAVEL (navigate to target floor)
    // ════════════════════════════════════════════
    if (seekerAI.phase === 'TRAVEL') {
        if (seeker.floor === seekerAI.aiTargetFloor) {
            if (!seekerAI.switchToggled) {
                const sx = floors[seeker.floor].switchX;
                walkTo(sx, targetZ, 'toggle_minutero');
                seekerAI.switchToggled = true;
            } else {
                seekerAI.phase = 'EXPLORE';
                seekerAI.sweepIndex = 0;
            }
            return;
        }
        seekerAI.switchToggled = false;

        // --- Dynamic pathfinding hop for floors without elevator
        if (seeker.floor === 1 && seekerAI.aiTargetFloor === 0) seekerAI.travelMode = 'stairs';
        if (seeker.floor === totalFloors - 1 && seekerAI.aiTargetFloor === totalFloors) seekerAI.travelMode = 'stairs';

        if (seekerAI.travelMode === 'stairs') {
            const goUp = seekerAI.aiTargetFloor > seeker.floor;
            if (fd.stairX !== null && fd.stairX !== undefined) {
                walkTo(fd.stairX, targetZ, goUp ? 'stairs_up' : 'stairs_down');
            } else {
                seekerAI.travelMode = 'elevator';
            }
        } else {
            if (!seeker.inElevator) {
                if (fd.elevDoorX !== undefined) {
                    const distToElev = Math.hypot(seeker.x - fd.elevDoorX, seeker.z - 0);
                    if (distToElev > 1.2) {
                        walkTo(fd.elevDoorX, 0, null);
                    } else {
                        if (elevator.currentFloor !== seeker.floor || elevator.moving) {
                            _aiAction('call_elevator');
                        } else {
                            _aiAction('enter_elevator');
                        }
                    }
                } else {
                    seekerAI.travelMode = 'stairs';
                }
            } else {
                let elevTargetFloor = seekerAI.aiTargetFloor;
                if (elevTargetFloor === 0) elevTargetFloor = 1;
                if (elevTargetFloor === totalFloors) elevTargetFloor = totalFloors - 1;

                if (elevator.currentFloor === elevTargetFloor) {
                    if (!elevator.moving) _aiAction('exit_elevator');
                } else if (!elevator.moving && elevator.currentFloor !== elevTargetFloor) {
                    _aiAction('goto_floor_' + elevTargetFloor);
                }
            }
        }
        return;
    }

    // ════════════════════════════════════════════
    //  PHASE 3: EXPLORE (Sonar Sweep — from H&S)
    // ════════════════════════════════════════════
    if (seekerAI.phase === 'EXPLORE') {
        if (seeker.floor !== seekerAI.aiTargetFloor) {
            seekerAI.phase = 'PICK_FLOOR';
            return;
        }

        if (fd.doors.length > 0) {
            let unsearchedDoor = -1;
            for (let i = seekerAI.sweepIndex; i < fd.doors.length; i++) {
                const checked = doorChecks.some(c => c.floor === seeker.floor + 1 && c.door === String.fromCharCode(65 + i));
                if (!checked) { unsearchedDoor = i; break; }
            }

            if (unsearchedDoor !== -1) {
                seekerAI.sweepIndex = unsearchedDoor;
                const tx = fd.doors[unsearchedDoor].x;
                walkTo(tx, targetZ, 'search_door');
            } else {
                seekerAI.exploredFloors.add(seeker.floor);
                seekerAI.beliefs[seeker.floor] = 0;
                const sum = seekerAI.beliefs.reduce((a, b) => a + b, 0);
                if (sum > 0) seekerAI.beliefs = seekerAI.beliefs.map(b => b / sum);
                seekerAI.phase = 'PICK_FLOOR';
            }
        } else if (fd.hidingSpots && fd.hidingSpots.length > 0) {
            let unsearchedSpot = -1;
            for (let i = seekerAI.sweepIndex; i < fd.hidingSpots.length; i++) {
                const checked = doorChecks.some(c => c.floor === seeker.floor + 1 && c.door === fd.hidingSpots[i].label);
                if (!checked) { unsearchedSpot = i; break; }
            }

            if (unsearchedSpot !== -1) {
                seekerAI.sweepIndex = unsearchedSpot;
                const tx = fd.hidingSpots[unsearchedSpot].x;
                walkTo(tx, targetZ, 'search_door');
            } else {
                seekerAI.exploredFloors.add(seeker.floor);
                seekerAI.beliefs[seeker.floor] = 0;
                const sum = seekerAI.beliefs.reduce((a, b) => a + b, 0);
                if (sum > 0) seekerAI.beliefs = seekerAI.beliefs.map(b => b / sum);
                seekerAI.phase = 'PICK_FLOOR';
            }
        } else {
            seekerAI.exploredFloors.add(seeker.floor);
            seekerAI.phase = 'PICK_FLOOR';
        }
    }
}

// ═══════════════════════════════════════════════════════════
//  CINEMATIC LOGIC
// ═══════════════════════════════════════════════════════════
function updateCinematic(dt) {
    if (gamePhase !== 'cinematic' || !rabbit.mesh) return;
    
    // Raccoon entry cinematic sequence
    const fd = floors[rabbit.floor];
    if (!fd) return;
    
    if (cinematicPhase === 'walking_to_elevator') {
        rabbitCurAnim = playCharAnim(rabbitMixer, rabbitAnimMap, rabbitCurAnim, 'run');
        if (rabbit.visualModel) rabbit.visualModel.rotation.y = Math.PI / 2; // Face right
        
        let tx = fd.stairX || 0;

        if (targetFloor === 1) {
            // Target is on this floor! Skip stairs entirely.
            cinematicPhase = 'walking_to_door';
            return;
        }

        if (rabbit.x < tx - 0.2) {
            rabbit.x += rabbit.speed * 0.8 * dt; // walk right
        } else if (rabbit.x > tx + 0.2) {
            rabbit.x -= rabbit.speed * 0.8 * dt; // walk left
            if (rabbit.visualModel) rabbit.visualModel.rotation.y = -Math.PI / 2;
        } else {
            // Arrived at stairs
            rabbit.mesh.visible = false;
            cinematicPhase = 'riding_elevator'; // repurpose this phase for stair traversal
            cinematicTimer = 0;
        }
    } else if (cinematicPhase === 'riding_elevator') {
        cinematicTimer += dt;
        if (cinematicTimer > 1.0) {
            rabbit.floor = targetFloor;
            const tFd = floors[targetFloor];
            // Azotea (totalFloors-1) uses stairDownX, Sotano uses stairUpX
            let tx = 0;
            if (targetFloor === totalFloors - 1) tx = tFd.stairDownX || 0;
            else if (targetFloor === 0) tx = tFd.stairUpX || 0;
            
            rabbit.x = tx;
            rabbit.mesh.position.set(rabbit.x, tFd.baseY + 0.12, 0);
            rabbit.mesh.visible = true;
            cinematicPhase = 'walking_to_door';
            cinematicTimer = 0;
        }
    } else if (cinematicPhase === 'walking_to_door') {
        rabbitCurAnim = playCharAnim(rabbitMixer, rabbitAnimMap, rabbitCurAnim, 'run');
        const tFd = floors[targetFloor];
        
        // Determine target X: use door if available, else hiding spot
        let targetX;
        if (tFd.doors.length > 0 && targetDoor < tFd.doors.length) {
            targetX = tFd.doors[targetDoor].x;
        } else if (tFd.hidingSpots && tFd.hidingSpots.length > 0) {
            const spotIdx = Math.min(targetDoor, tFd.hidingSpots.length - 1);
            targetX = tFd.hidingSpots[spotIdx].x;
        } else {
            targetX = 0; // fallback center
        }
        
        if (rabbit.x > targetX + 0.2) {
            rabbit.x -= rabbit.speed * 0.8 * dt; // walk left
            if (rabbit.visualModel) rabbit.visualModel.rotation.y = -Math.PI / 2;
        } else if (rabbit.x < targetX - 0.2) {
            rabbit.x += rabbit.speed * 0.8 * dt; // walk right
            if (rabbit.visualModel) rabbit.visualModel.rotation.y = Math.PI / 2;
        } else {
            // Reached door/spot -> walk IN to hide (like portal mechanic)
            rabbitCurAnim = playCharAnim(rabbitMixer, rabbitAnimMap, rabbitCurAnim, 'run');
            let targetRotWalkIn = Math.atan2(0, -1);
            if (rabbit.visualModel) rabbit.visualModel.rotation.y = targetRotWalkIn; // Face backwards (-Z)
            
            rabbit.z -= rabbit.speed * 0.5 * dt; // Walk into the volume
            
            if (rabbit.z <= -4.5) {
                // Disappear deep inside
                rabbit.mesh.visible = false;
                gamePhase = 'seeking';
                document.getElementById('hudTitle').innerText = '🏢 Corporate Building';
                document.getElementById('camcorder').style.display = 'flex';
                if (seeker.mesh) {
                    seeker.mesh.visible = true; // Reveal player!
                    _flashSeeker(0xffeedd);
                }
            }
        }
    }
    
    if (!rabbit.inElevator && floors[rabbit.floor]) {
        let yHop = 0;
        if (cinematicPhase.includes('walking')) {
            const time = performance.now() * 0.015;
            yHop = Math.abs(Math.sin(time)) * 0.25;
        }
        rabbit.mesh.position.set(rabbit.x, floors[rabbit.floor].baseY + 0.12 + yHop, rabbit.z);
    }
}

// ═══════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════

window.RLMode = false;
window.setRLMode = function(enabled) {
    window.RLMode = enabled;
    const modeBadge = document.getElementById('aiBadgeMode');
    if (modeBadge) {
        modeBadge.innerText = enabled ? '🤖 ML Training' : '🧍 User Mode';
        modeBadge.classList.toggle('minigame-badge', !enabled);
        modeBadge.classList.toggle('training-badge', enabled);
    }
    if (enabled && !simulationRunning) {
        const sm = document.getElementById('startModal');
        if (sm) sm.style.display = 'none';
        else {
            const im = document.getElementById('introModal');
            if (im) im.style.display = 'none';
        }
        if (typeof startSimulation === 'function') startSimulation();
    }
};

window.getObservationVector = function() {
    let s=0, r=0, rx=0, rz=0;
    if (typeof seeker !== 'undefined' && seeker) s = (seeker.floor||0) / (typeof totalFloors !== 'undefined' ? totalFloors : 10);
    if (typeof rabbit !== 'undefined' && rabbit) {
        r = (rabbit.floor||0) / (typeof totalFloors !== 'undefined' ? totalFloors : 10);
        rx = rabbit.x / 100;
        rz = rabbit.z / 100;
    }
    return {
        obs: [
            s,
            (typeof seeker !== 'undefined' && seeker ? seeker.x / 100 : 0),
            (typeof seeker !== 'undefined' && seeker ? seeker.z / 100 : 0),
            (typeof hudEnergy !== 'undefined' ? hudEnergy / 100 : 0),
            (typeof rabbit !== 'undefined' && rabbit && rabbit.mesh && rabbit.mesh.visible ? 1.0 : 0.0),
            r, rx, rz
        ],
        meta: { phase: (typeof gamePhase !== 'undefined' ? gamePhase : ''), energy: (typeof hudEnergy !== 'undefined' ? hudEnergy : 0) }
    };
};

window.resetEpisode = function(seed) { 
    if(seed !== undefined && typeof Math !== 'undefined' && typeof Math.seedrandom === 'function') Math.seedrandom(seed);
    if(typeof startSimulation === 'function') startSimulation();
    return window.getObservationVector(); 
};

window.stepSimulation = function(actionIdx, dt) {
    if(typeof simulationRunning !== 'undefined' && !simulationRunning) return { obs: window.getObservationVector(), reward: 0, done: true };
    if(typeof gamePhase !== 'undefined' && (gamePhase === 'gameover' || gamePhase === 'victory')) {
        return { obs: window.getObservationVector(), reward: 0, done: true };
    }
    
    // RL Action Mapping to targetWalkSpot for simple WASD ML overriding
    if(typeof seeker !== 'undefined') {
        if (actionIdx === 1) targetWalkSpot = { x: seeker.x, z: seeker.z - 4 }; // North
        if (actionIdx === 2) targetWalkSpot = { x: seeker.x, z: seeker.z + 4 }; // South
        if (actionIdx === 3) targetWalkSpot = { x: seeker.x - 4, z: seeker.z }; // West
        if (actionIdx === 4) targetWalkSpot = { x: seeker.x + 4, z: seeker.z }; // East
    }
    
    if(typeof executeLogicTick === 'function') executeLogicTick(dt);
    
    let reward = -0.01;
    if (typeof gamePhase !== 'undefined') {
        if (gamePhase === 'victory') reward += 10.0;
        if (gamePhase === 'gameover') reward -= 5.0;
    }
    return {  obs: window.getObservationVector(), reward: reward, done: typeof gamePhase !== 'undefined' && (gamePhase === 'gameover' || gamePhase === 'victory') };
};

let aiTickTimer = 0;
function executeLogicTick(dt) {
    if (!simulationRunning) return;
    
    simTime += dt;
    updateCinematic(dt);
    
    // Synchronous AI Tick replaces setInterval(300ms)
    aiTickTimer += dt;
    if (aiTickTimer >= 0.3) {
        autoAgentStep();
        aiTickTimer = 0;
    }
    
    aiMovement(dt);
    updateSeeker(dt);
    updateSeekerInElevator(dt);
    updateElevator(dt);
    updateHUD();
    if(typeof updatePhantomDeath === 'function') updatePhantomDeath(dt);
}

gfx.startLoop((engineDt) => {
    let dt = Math.min(engineDt, 0.1);
    dt *= simSpeedMultiplier;

    if (rabbitMixer) rabbitMixer.update(dt);
    if (seekerMixer) seekerMixer.update(dt * (seekerCurAnim === 'run' ? 1.5 : 1.0));

    // Battery Logic
    if (simulationRunning && gamePhase === 'seeking') {
        if (flashLightOn) {
            hudEnergy -= dt * 1.5; // Consume battery at 1.5 units per second
            if (hudEnergy < 0) {
                hudEnergy = 0;
                flashLightOn = false;
                document.getElementById('cam-flash').innerText = '🔦 DEAD';
            }
        }
        
        let visualIntensity = flashLightOn ? 1.2 : 0.0;
        let isLowBatt = (hudEnergy < 20 && hudEnergy > 0);
        
        if (flashLightOn && isLowBatt) {
            if (Math.random() < 0.2) visualIntensity *= (Math.random() * 0.5 + 0.2); // Flickering
            document.getElementById('cam-batt').classList.add('low-batt');
        } else {
            document.getElementById('cam-batt').classList.remove('low-batt');
        }
        
        if (flashLight) flashLight.intensity = visualIntensity;
        if (volumetricBeam) volumetricBeam.material.opacity = flashLightOn ? (visualIntensity / 1.2) * 1.0 : 0;
        
        let chunks = Math.ceil(hudEnergy / 25);
        let bar = '[' + '■'.repeat(chunks) + '□'.repeat(4 - chunks) + ']';
        document.getElementById('cam-batt').innerText = bar;

        // --- Minuteros Logic ---
        if (isLightsOut) {
            for (let f = 0; f < floorLightTimers.length; f++) {
                if (floorLightTimers[f] > 0 && floorLightTimers[f] < 9999) {
                    floorLightTimers[f] -= dt;
                    if (floorLightTimers[f] < 0) floorLightTimers[f] = 0;
                }
                
                if (floorLights[f]) {
                    // Start dimming strongly when under 2 seconds, otherwise bright warm yellow
                    let t = floorLightTimers[f];
                    if (t >= 9999) floorLights[f].intensity = 0.4;
                    else if (t > 2.0) floorLights[f].intensity = 0.4;
                    else if (t > 0) {
                        // Flickering right before light turns completely off
                        let flicker = Math.random() > 0.3 ? 1.0 : 0.2;
                        floorLights[f].intensity = (t / 2.0) * 0.4 * flicker;
                    }
                    else floorLights[f].intensity = 0;
                }
            }
        } else {
            // Keep all fLights on
            for (let f = 0; f < floorLights.length; f++) {
                if (floorLights[f]) floorLights[f].intensity = 0.4;
            }
        }
        
        // --- Battery Pickups Logic ---
        for (let i = batteryPickups.length - 1; i >= 0; i--) {
            let p = batteryPickups[i];
            if (p.floor === seeker.floor) {
                let dist = Math.hypot(seeker.x - p.x, seeker.z - p.z);
                if (dist < 1.0) {
                    // Collect!
                    hudEnergy = Math.min(100.0, hudEnergy + 60.0);
                    if (p.mesh.parent) p.mesh.parent.remove(p.mesh);
                    batteryPickups.splice(i, 1);
                    document.getElementById('cam-flash').innerText = flashLightOn ? '🔦 ON (F)' : '🔦 OFF (F)';
                    _flashSeeker(0x34c759); // Flash green!
                }
            }
        }
    }

    // Animate Flashlight Dust
    if (window.flashDust && flashDust.userData.velocities && flashLightOn) {
        const dPos = flashDust.geometry.attributes.position.array;
        const dVel = flashDust.userData.velocities;
        for (let i = 0; i < dPos.length / 3; i++) {
            dPos[i*3] += dVel[i*3] * dt;
            dPos[i*3+1] += dVel[i*3+1] * dt;
            dPos[i*3+2] += dVel[i*3+2] * dt;
            // Wrap particles when they float too far inside the cone
            if (dPos[i*3+2] > 12) {
                dPos[i*3+2] = 0.5; // Reset near lens
                dPos[i*3] = (Math.random() - 0.5) * 1.5;
                dPos[i*3+1] = (Math.random() - 0.5) * 1.5;
            }
        }
        flashDust.geometry.attributes.position.needsUpdate = true;
    }
    if (window.flashDust) flashDust.visible = flashLightOn;

    if (!window.RLMode) {
        executeLogicTick(dt);
    }

    // Clear just-pressed keys at end of frame
    for (const k in keysJustPressed) keysJustPressed[k] = false;
});

document.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'f' && gamePhase === 'seeking') {
        toggleFlashlight();
    }
});

// ═══════════════════════════════════════════════════════════
//  ALISA SDK
// ═══════════════════════════════════════════════════════════
ALISA_SDK.register({
    sim: 'corporate_building',
    getSemanticState: () => ({
        status: simulationRunning ? 'running' : 'menu',
        time: +simTime.toFixed(1),
        game_status: gameStatus,
        searches_made: searches,
        seeker_floor: seeker.floor + 1,
        seeker_x: +seeker.x.toFixed(1),
        seeker_mode: seeker.mode,
        seeker_in_elevator: seeker.inElevator,
        elevator_floor: elevator.currentFloor + 1,
        elevator_moving: elevator.moving,
        total_floors: totalFloors,
        doors_per_floor: doorsPerFloor,
        recent_checks: doorChecks.slice(-3) // return last 3 feedbacks
    }),
    getAvailableActions: () => {
        if (!simulationRunning) return ['wait'];
        if (gameStatus === 'Found' || gameStatus === 'FOUND!') return ['wait'];

        const acts = ['move_left', 'move_right', 'move_in', 'move_out', 'wait'];
        if (!seeker.inElevator) {
            acts.push('stairs_up', 'stairs_down', 'call_elevator', 'enter_elevator');
            
            // Allow search if near any door
            const fd = floors[seeker.floor];
            if (fd) {
                let nearDoor = false;
                for (let i = 0; i < fd.doors.length; i++) {
                    if (Math.hypot(seeker.x - fd.doors[i].x, seeker.z - (-CORRIDOR_DEPTH/2 + 0.2)) < 1.2) nearDoor = true;
                }
                if (nearDoor) acts.push('search_door');
            }
        } else {
            for (let i = 1; i <= totalFloors; i++) acts.push('goto_floor_' + i);
            acts.push('exit_elevator');
        }
        return acts;
    },
    executeAction: (intentStr) => {
        const intent = intentStr.toLowerCase().trim();
        if (intent === 'move_left') { keys['a'] = true; setTimeout(() => keys['a']=false, 150); }
        else if (intent === 'move_right') { keys['d'] = true; setTimeout(() => keys['d']=false, 150); }
        else if (intent === 'move_in') { keys['w'] = true; setTimeout(() => keys['w']=false, 150); }
        else if (intent === 'move_out') { keys['s'] = true; setTimeout(() => keys['s']=false, 150); }
        else if (intent === 'stairs_up' || intent === 'stairs_down') { keysJustPressed[' '] = true; }
        else if (intent === 'call_elevator') { keysJustPressed['e'] = true; }
        else if (intent === 'enter_elevator' || intent === 'exit_elevator') { keysJustPressed[' '] = true; }
        else if (intent === 'search_door') { keysJustPressed['enter'] = true; }
        else if (intent.startsWith('goto_floor_')) {
            const n = parseInt(intent.split('_')[2]);
            if (n && n <= totalFloors) keysJustPressed[String(n)] = true;
        }
        return {success: true, msg: 'Dispatched: ' + intent};
    },
    getScore: () => ({
        score: (gameStatus === 'Found' || gameStatus === 'FOUND!') ? Math.max(100 - searches*5, 10) : 0,
        searches: searches,
        time: simTime,
        found: gameStatus === 'Found' || gameStatus === 'FOUND!'
    })
});
