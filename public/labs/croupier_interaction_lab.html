<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALISA — Interaction Lab (Food Chain Arena)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #0a0a14; font-family: 'JetBrains Mono', monospace; color: #fff; user-select: none; }

        #hud {
            position: absolute; top: 10px; left: 10px;
            background: rgba(8,12,24,0.9); padding: 14px 18px; border-radius: 10px;
            border: 1px solid #ff6600; font-size: 12px; line-height: 1.9; z-index: 10;
            box-shadow: 0 0 20px rgba(255,102,0,0.15); min-width: 200px;
        }
        #hud .title { color: #ff8844; font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        #hud .stat { color: #aab; }
        .v-green { color: #88ff88; font-weight: bold; }
        .v-red { color: #ff4444; font-weight: bold; }
        .v-orange { color: #ffaa44; font-weight: bold; }
        .v-cyan { color: #44ddff; font-weight: bold; }

        #scoreboard {
            position: absolute; top: 10px; right: 10px;
            background: rgba(8,12,24,0.9); padding: 12px 16px; border-radius: 10px;
            border: 1px solid #444; font-size: 11px; line-height: 2; z-index: 10;
        }
        #scoreboard .title { color: #888; font-size: 12px; font-weight: bold; margin-bottom: 2px; }

        #modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        #modal .box {
            background: rgba(12,16,28,0.95); border: 2px solid #ff6600;
            padding: 35px; border-radius: 12px; max-width: 520px; width: 90%;
        }
        #modal h2 { color: #ff8844; font-size: 24px; text-align: center; margin-bottom: 8px; }
        #modal p { color: #8aa; font-size: 12px; text-align: center; line-height: 1.6; margin-bottom: 16px; }
        .cfg { display: flex; gap: 10px; margin-bottom: 14px; justify-content: center; flex-wrap: wrap; }
        .cfg-col { min-width: 80px; }
        .cfg label { font-size: 10px; color: #8aa; }
        .cfg input, .cfg select {
            background: #0a152e; color: #fff; border: 1px solid #ff6600;
            padding: 5px 8px; border-radius: 6px; font-size: 11px; width: 100%; outline: none; font-family: monospace;
        }
        #btnStart {
            display: block; width: 100%; background: linear-gradient(135deg, #cc5500, #ff8800);
            color: #fff; border: none; padding: 11px; font-size: 15px; font-weight: bold;
            border-radius: 8px; cursor: pointer; font-family: inherit;
        }
        #btnStart:hover { filter: brightness(1.1); }
    </style>

    <!--
        El mapa del motor lo pone `/js/mundo.js`, y aquí además CAMBIA LA VERSIÓN:
        esta página declaraba three 0.160 y la común es la 0.170, que es la que
        trae los addons modernos —SMAA entre ellos—. Se comprobó abriéndola.
    -->
    <script src="/js/mundo.js"></script>
</head>
<body>

    <!-- HUD -->
    <div id="hud" style="display:none;">
        <div class="title">🦊 FOOD CHAIN ARENA</div>
        <div class="stat">⏱️ Time: <span class="v-green" id="hTime">0.0</span>s</div>
        <div class="stat">🐭 Mice: <span class="v-cyan" id="hMice">0</span></div>
        <div class="stat">🦊 Foxes: <span class="v-orange" id="hFoxes">0</span></div>
        <div class="stat">🦖 Raptors: <span class="v-red" id="hRaptors">0</span></div>
        <div class="stat">🧀 Cheese: <span id="hCheese">0</span></div>
    </div>

    <!-- Scoreboard -->
    <div id="scoreboard" style="display:none;">
        <div class="title">🏆 SCOREBOARD</div>
        <div id="scoreList"></div>
    </div>

    <!-- Launch Modal -->
    <div id="modal">
        <div class="box">
            <h2>🦊 INTERACTION LAB</h2>
            <p>A multi-tier food chain arena.<br>
            Raptors 🦖 hunt Foxes 🦊, Foxes hunt Mice 🐭, Mice forage Cheese 🧀.<br>
            Emergent behaviors: hiding, teamwork, boo attacks, crate jumping!</p>
            <div class="cfg">
                <div class="cfg-col"><label>🐭 Mice</label><br><input type="number" id="cfgMice" value="6" min="1" max="20"></div>
                <div class="cfg-col"><label>🦊 Foxes</label><br><input type="number" id="cfgFoxes" value="3" min="1" max="10"></div>
                <div class="cfg-col"><label>🦖 Raptors</label><br><input type="number" id="cfgRaptors" value="1" min="0" max="3"></div>
                <div class="cfg-col"><label>🧀 Cheese</label><br><input type="number" id="cfgCheese" value="8" min="1" max="20"></div>
                <div class="cfg-col"><label>📦 Crates</label><br><input type="number" id="cfgCrates" value="6" min="0" max="15"></div>
            </div>
            <button id="btnStart">RELEASE THE ANIMALS</button>
        </div>
    </div>

    <script type="module">
        import { montarMundo } from '/js/montarMundo.js';
        import { InteractionLabEngine } from '@alisa-engine/src/world/systems/InteractionLabEngine.js';

        // ─── RENDERER CORE ───
        /**
         * ⚠️ ESTA PÁGINA SE MONTABA SU PROPIO COMPOSER, Y ESE ES EL PATRÓN.
         *
         * Tenía a mano `EffectComposer` + `RenderPass` + `UnrealBloomPass` y su
         * propio `resize`: veintitrés líneas para tener bloom y sólo bloom. Sin
         * tono fílmico, sin SSAO, sin antialiasing y sin entorno PBR — no porque
         * se descartaran, sino porque cada uno son otras tantas líneas y quien
         * copia el andamio copia lo imprescindible.
         *
         * `cielo:false` porque es un laboratorio con niebla, no un exterior. Las
         * luces sí se dejan: `InteractionLabEngine` no trae ninguna propia.
         *
         * ⚠️ `suelo:false`, Y ESTO SE VIO EN LA PANTALLA, NO EN EL CÓDIGO.
         * `montarMundo` llama a `setupDefaultEnvironment()` salvo que se le diga
         * que no, y esta página nunca lo llamaba: al migrarla aparecieron dos
         * cuñas marrones enormes atravesando la cámara — el suelo por defecto
         * metido dentro de una arena que ya trae la suya. Migrar no es sólo
         * cambiar quién monta el andamio: es mirar qué trae de más.
         */
        const { app: core, THREE, arrancar } = await montarMundo({
            ambiente: 'night',
            cielo: false,
            suelo: false,
            nucleo: { clearColor: 0x0a0a14, fogColor: 0x0a0a14, fogDensity: 0.012 },
        });
        core.camera.position.set(0, 30, 22);
        core.controls.target.set(0, 0, 0);
        core.controls.maxDistance = 60;
        core.controls.minDistance = 8;
        core.controls.maxPolarAngle = Math.PI / 2.2;

        // ─── ENGINE ───
        // basePath relative to /labs/ — was '/colony/overworld/' (pre-reorg absolute path, 404'd every animal GLB)
        const labEngine = new InteractionLabEngine(core, '../');

        // ─── GAME START ───
        document.getElementById('btnStart').addEventListener('click', () => {
            const config = {
                mice: parseInt(document.getElementById('cfgMice').value) || 6,
                foxes: parseInt(document.getElementById('cfgFoxes').value) || 3,
                raptors: parseInt(document.getElementById('cfgRaptors').value) || 1,
                cheese: parseInt(document.getElementById('cfgCheese').value) || 8,
                crates: parseInt(document.getElementById('cfgCrates').value) || 6
            };

            labEngine.boot(config);

            document.getElementById('modal').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('scoreboard').style.display = 'block';
        });

        // ─── HUD ───
        function updateHUD() {
            if (!labEngine.running) return;
            document.getElementById('hTime').textContent = labEngine.elapsedTime.toFixed(1);
            document.getElementById('hMice').textContent = labEngine.allPrey.filter(p => p.alive).length;
            document.getElementById('hFoxes').textContent = labEngine.allPredators.filter(p => p.tier === 'mid' && p.alive).length;
            document.getElementById('hRaptors').textContent = labEngine.allPredators.filter(p => p.tier === 'apex' && p.alive).length;
            document.getElementById('hCheese').textContent = labEngine.cheeses.filter(c => !c._eaten).length;

            // Scoreboard
            const all = [...labEngine.allPredators].sort((a,b) => b.score - a.score);
            let html = '';
            for (const a of all) {
                const icon = a.tier === 'apex' ? '🦖' : '🦊';
                const cls = a.alive ? '' : ' style="opacity:0.4"';
                html += `<div${cls}>${icon} ${a.id}: <span class="v-orange">${a.score}</span></div>`;
            }
            document.getElementById('scoreList').innerHTML = html;
        }

        // ─── MAIN LOOP ───
        arrancar((dt) => {
            labEngine.tick(dt, labEngine.elapsedTime);
            updateHUD();
        });

        // ─── RL BRIDGE ───
        window.RLMode = false;
        window.getObservationVector = () => labEngine.getObservationVector();

    </script>

<!--
  ⚠️ EL BOTÓN DE «ALGO SE VE RARO», Y ESTA PÁGINA NO LO IMPLEMENTA.

<script type="module" src="/arcade/js/protohub/reportar.js"></script>
</body>
</html>
