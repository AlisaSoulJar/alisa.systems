<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Aris · Self Puppet</title>
<style>
  html,body{margin:0;height:100%;background:#080b10;overflow:hidden;font-family:ui-monospace,monospace}
  #hud{position:fixed;top:10px;left:12px;color:#bcd;font-size:12px;z-index:10;text-shadow:0 0 4px #000;pointer-events:none}
  #hud b{color:#ffd166}
  #sub{position:fixed;bottom:56px;left:0;width:100%;text-align:center;color:#fff;font-size:22px;z-index:10;text-shadow:0 2px 8px #000}
  #sub .m{color:#ffd166;font-weight:bold}
  #meta{position:fixed;bottom:30px;left:0;width:100%;text-align:center;color:#7ab;font-size:13px;z-index:10;text-shadow:0 0 4px #000}
  #tag{position:fixed;top:10px;right:14px;color:#556;font-size:11px;z-index:10}
</style>
<script type="importmap">
{ "imports": { "three": "/vendor/three-0.160.0/build/three.module.js",
               "three/addons/": "/vendor/three-0.160.0/examples/jsm/" }}
</script>
</head>
<body>
<div id="hud"><b>SELF PUPPET</b> · Aris (Gorilla.glb) ejecutando SUS métodos<br>being→avatar(#2) · método→movimiento (resolver general) · kinematics(#1)</div>
<div id="tag">cualquier avatar × sus métodos</div>
<div id="sub">…</div>
<div id="meta"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// Aris's real methods (avatars.db) resolved by MotionSpecGene.resolve_motion
const ACTS = [
  { method:"render",  motion:"construct",  sym:"⚙️", narr:"Aris compila el estado en píxeles." },
  { method:"frame",   motion:"frame_scan", sym:"🖼️", narr:"Aris encuadra la escena con cien ojos." },
  { method:"capture", motion:"frame_scan", sym:"📸", narr:"Aris captura el instante." },
];

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x080b10);
scene.fog=new THREE.Fog(0x080b10, 7, 22);
const cam=new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.05, 100); cam.position.set(0,2.0,6);
const rn=new THREE.WebGLRenderer({antialias:true}); rn.setSize(innerWidth,innerHeight); rn.setPixelRatio(Math.min(devicePixelRatio,2));
rn.outputColorSpace=THREE.SRGBColorSpace; rn.toneMappingExposure=1.1;
document.body.appendChild(rn.domElement);
const ctrl=new OrbitControls(cam,rn.domElement); ctrl.target.set(0,1.1,0);
scene.add(new THREE.HemisphereLight(0xbcd0ff,0x141a20,1.2));
const key=new THREE.DirectionalLight(0xfff2d8,1.6); key.position.set(3,7,5); scene.add(key);
const spot=new THREE.SpotLight(0xffffff,50,18,0.5,0.6); spot.position.set(0,6,3); scene.add(spot);
scene.add(new THREE.GridHelper(20,20,0x1c2a3a,0x121a24));
const disc=new THREE.Mesh(new THREE.CircleGeometry(1.1,40), new THREE.MeshStandardMaterial({color:0x2a1f14,emissive:0x120c08,emissiveIntensity:0.4}));
disc.rotation.x=-Math.PI/2; disc.position.y=0.01; scene.add(disc);

const symCanvas=document.createElement("canvas"); symCanvas.width=symCanvas.height=128;
function symTex(t){const x=symCanvas.getContext("2d");x.clearRect(0,0,128,128);x.font="90px sans-serif";x.textAlign="center";x.textBaseline="middle";x.shadowColor="#000";x.shadowBlur=10;x.fillText(t,64,70);return new THREE.CanvasTexture(symCanvas);}
const sprite=new THREE.Sprite(new THREE.SpriteMaterial({transparent:true})); sprite.scale.set(0.85,0.85,1); sprite.position.set(0.95,2.05,0); scene.add(sprite);

let gorilla=null, cur=0;
function setAct(i){
  cur=((i%ACTS.length)+ACTS.length)%ACTS.length; const a=ACTS[cur];
  sprite.material.map=symTex(a.sym); sprite.material.needsUpdate=true;
  document.getElementById("sub").innerHTML=`Aris · <span class="m">${a.method}()</span> — ${a.narr}`;
  document.getElementById("meta").textContent=`método "${a.method}" → movimiento "${a.motion}" → kinematics:interact · avatar Gorilla.glb`;
  if(gorilla) gorilla.userData.t0=performance.now()/1000;
}
window.__setAct=setAct; window.__report={being:"Aris", avatar:"Gorilla.glb", acts:ACTS};

// Gorilla.glb is MISSING from props/models -> avatars.db override fails ->
// join #2 procedural fallback: render Aris from her real skeleton (primate).
function buildBody(bones, tint){
  const g=new THREE.Group();
  const lineMat=new THREE.LineBasicMaterial({color:tint});
  const jointMat=new THREE.MeshStandardMaterial({color:tint,emissive:tint,emissiveIntensity:0.35});
  const jg=new THREE.SphereGeometry(0.11,10,10); const seen=new Set();
  bones.forEach(([a,b])=>{
    const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a),new THREE.Vector3(...b)]);
    g.add(new THREE.Line(geo,lineMat));
    [a,b].forEach(p=>{const k=p.join(",");if(!seen.has(k)){seen.add(k);const j=new THREE.Mesh(jg,jointMat);j.position.set(...p);g.add(j);}});
  });
  return g;
}
fetch("./../data/skeletons.json").then(r=>r.json()).then(SK=>{
  const bones=(SK.primate||{}).bones||[[[0,0.5,0],[0,1.5,0]]];
  const body=buildBody(bones, 0xffcf6b);
  const b=new THREE.Box3().setFromObject(body); const sz=new THREE.Vector3(); b.getSize(sz);
  body.scale.setScalar(2.0/(sz.y||5)); const b2=new THREE.Box3().setFromObject(body); const c=new THREE.Vector3(); b2.getCenter(c);
  const piv=new THREE.Group(); const inner=new THREE.Group(); inner.add(body);
  body.position.set(-c.x,-b2.min.y,-c.z); piv.add(inner); scene.add(piv);
  gorilla=piv; gorilla.userData.t0=performance.now()/1000; setAct(0);
  document.getElementById("hud").innerHTML+=`<br><span style="color:#ff9">⚠ Gorilla.glb ausente → fallback procedural (primate 21🦴, join #2)</span>`;
}).catch(e=>{document.getElementById("sub").textContent="skeletons fetch fallo: "+e;});

window.__ready=false; let f=0; let auto=performance.now();
function loop(){ requestAnimationFrame(loop);
  const t=performance.now()/1000;
  if(gorilla){ const a=ACTS[cur]; const dt=t-gorilla.userData.t0;
    if(a.motion==="construct"){ gorilla.rotation.x=0.18; gorilla.position.y=Math.abs(Math.sin(t*4))*0.05; gorilla.rotation.y=0; }
    else if(a.motion==="frame_scan"){ gorilla.rotation.x=0; gorilla.position.y=0; gorilla.rotation.y=Math.sin(t*1.4)*0.5; }
    else { gorilla.rotation.set(0,0,0); }
  }
  sprite.position.y=2.05+Math.sin(t*2)*0.07;
  if(performance.now()-auto>2200 && !window.__hold){ auto=performance.now(); setAct(cur+1); }
  ctrl.update(); rn.render(scene,cam); if(gorilla && ++f>8) window.__ready=true;
}
loop();
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rn.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
