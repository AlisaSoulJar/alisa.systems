        <!-- Scripts loaded dynamically inside module to prevent THREE undefined race conditions -->
    <script type="module" id="alisa-core-init">
        import * as THREE from 'three';
        import { AlisaRenderCore } from '@alisa-engine/src/soma/AlisaRenderCore.js';
        import { AssetManager } from '@alisa-engine/src/soma/AssetManager.js';
        import { CroupierSystem } from '@alisa-engine/src/world/CroupierSystem.js';
        import { KinematicRageSystem } from '@alisa-engine/src/world/systems/KinematicRageSystem.js';
        import { ArcadeTableRoomFactory } from '@alisa-engine/src/world/factories/ArcadeTableRoomFactory.js';
        
        window.THREE = Object.assign({}, THREE);
        window.AssetManager = AssetManager;
        window.croupierEngine = new CroupierSystem({ deckX: 2.5, deckY: 0.77, deckZ: 0 });
        window.rageEngine = new KinematicRageSystem({ gravity: -60.0 });
        
        const isPocket = new URLSearchParams(window.location.search).get('pocket') === '1';
        
        const app = new AlisaRenderCore({ 
            cameraPosition: new THREE.Vector3(4, 3, 6),
            clearColor: isPocket ? 0x000000 : 0xe0e5ec,
            alpha: isPocket ? true : false,
            fogColor: isPocket ? null : null
        });
        if (isPocket) {
            app.renderer.setClearColor(0x000000, 0);
            document.body.style.background = 'transparent';
        }
        app.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        app.controls.target.set(0, 0.5, 0);
        app.controls.maxPolarAngle = Math.PI / 2 + 0.1;

        window.scene = app.scene;
        window.camera = app.camera;
        window.renderer = app.renderer;
        window.controls = app.controls;
        window.app = app; // Expose for legacy hooks
        
        const loadScript = src => new Promise(r => {
            const s = document.createElement('script');
            s.src = src; s.onload = r; document.head.appendChild(s);
        });

        async function init() {
            await loadScript('../../arcade/js/arcade_mats.js?v=final2');
            await loadScript('../../arcade/js/SovereignCardEngine.js?v=hifi1');
            await loadScript('../js/chess_procedural.js');
            await loadScript('../js/arcade_boards.js');
            
            const tableFactory = new ArcadeTableRoomFactory(app.scene, app.camera, app.controls, {
                onSit: (targetX) => {
                    const hudPanel = document.querySelector('.hud-panel');
                    const gameSelectBlock = document.getElementById('gameSelect').parentElement;
                    
                    if (targetX === -2.5) {
                        hudPanel.querySelector('h1').innerText = "🔲 Board Games Node";
                        hudPanel.querySelector('.subtitle').innerText = "Sovereign Simulation Gateway";
                        gameSelectBlock.style.display = 'flex';
                        document.getElementById('casino-hud-block').style.display = 'none';
                    } else {
                        hudPanel.querySelector('h1').innerText = "🃏 Sovereign Casino Nodes";
                        hudPanel.querySelector('.subtitle').innerText = "RLCard Sandbox & Stochastic Simulators";
                        gameSelectBlock.style.display = 'none';
                        document.getElementById('game-hud-block').style.display = 'none';
                        document.getElementById('casino-hud-block').style.display = 'flex';
                    }
                    
                    document.getElementById('btn-real-exit').style.display = 'none';
                    document.querySelector('.toggle-btn').style.display = 'none';
                    document.getElementById('btn-standup').style.display = 'block';
                },
                onStand: () => {
                    const hudPanel = document.querySelector('.hud-panel');
                    hudPanel.querySelector('h1').innerText = "🔲 ALISA Arcade Node";
                    hudPanel.querySelector('.subtitle').innerText = "Sovereign Simulation Gateway";
                    document.getElementById('gameSelect').parentElement.style.display = 'flex';
                    
                    if (tableFactory.currentGameSet && document.getElementById('gameSelect').value !== 'none') {
                        document.getElementById('game-hud-block').style.display = 'flex';
                    }
                    document.getElementById('casino-hud-block').style.display = 'none';
                    
                    document.getElementById('btn-real-exit').style.display = 'inline-block';
                    document.querySelector('.toggle-btn').style.display = 'block';
                    document.getElementById('btn-standup').style.display = 'none';
                }
            });

            await tableFactory.init();
            window.tableFactory = tableFactory;
            
            // Expose for SovereignCardEngine legacy coupling
            window.tableCards = tableFactory.tableCards;
            window.matMesh = tableFactory.matMesh;
            window.deckGroup = tableFactory.deckGroup;
            window.standUp = () => tableFactory.standUp();
            
            document.querySelector('.subtitle').innerText = "Matrix Room + Sovereign Arcade";

            let physicsEnabled = false;
            let bGroupGlobal = null;
            let pGroupGlobal = null;

            window.rageQuit = function() {
                if (!tableFactory.currentGameSet || physicsEnabled) return;

                document.getElementById('hud-state').innerText = 'TABLE FLIPPED!';
                document.getElementById('hud-state').style.color = '#f44336';
                
                bGroupGlobal = tableFactory.currentGameSet.children[0];
                pGroupGlobal = tableFactory.currentGameSet.children[1];

                const localScaleY = tableFactory.currentGameSet.scale.y; 
                const floorLocalY = -0.75 / localScaleY; 

                const entitiesToLaunch = [];
                entitiesToLaunch.push({ id: 'board', isBoard: true, position: bGroupGlobal.position.clone(), rotation: bGroupGlobal.rotation.clone() });
                pGroupGlobal.children.forEach((piece, i) => { entitiesToLaunch.push({ id: 'piece_'+i, isBoard: false, position: piece.position.clone(), rotation: piece.rotation.clone(), meshRef: piece }); });

                const rages = window.rageEngine.applyImpulse(entitiesToLaunch, { floorY: floorLocalY });
                rages.forEach((rageEnt, i) => {
                    const originalEntity = entitiesToLaunch[i];
                    if(originalEntity.id === 'board') bGroupGlobal.userData.rageState = rageEnt.rageState;
                    else originalEntity.meshRef.userData.rageState = rageEnt.rageState;
                });

                physicsEnabled = true;
                if (tableFactory.isSitting) setTimeout(() => tableFactory.standUp(), 100);
            };

            app.startLoop((dt) => {
                tableFactory.tick(dt);
                
                if (physicsEnabled && bGroupGlobal && pGroupGlobal && window.rageEngine) {
                    const simFrame = [];
                    simFrame.push({ id: 'board', position: bGroupGlobal.position, rotation: bGroupGlobal.rotation, rageState: bGroupGlobal.userData.rageState });
                    pGroupGlobal.children.forEach((piece, i) => { simFrame.push({ id: 'piece_'+i, position: piece.position, rotation: piece.rotation, rageState: piece.userData.rageState, meshRef: piece }); });

                    const nextFrame = window.rageEngine.tick(simFrame, dt);

                    nextFrame.forEach((ent, i) => {
                        const originalEntity = simFrame[i];
                        if (ent.id === 'board') {
                            bGroupGlobal.position.copy(ent.position);
                            bGroupGlobal.rotation.setFromVector3(ent.rotation);
                            bGroupGlobal.userData.rageState = ent.rageState;
                        } else {
                            originalEntity.meshRef.position.copy(ent.position);
                            originalEntity.meshRef.rotation.setFromVector3(ent.rotation);
                            originalEntity.meshRef.userData.rageState = ent.rageState;
                        }
                    });
                }
            });

            
            await loadScript('../js/SovereignArcadeNode.js');
            if (window.initLegacyRoom) window.initLegacyRoom();

        }
        init();
    </script>
